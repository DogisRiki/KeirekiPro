name: TMP arm64 Probe

# 使い捨ての確認用ワークフロー。spec container-image-vulnerability-scanning の
# タスク1.1 / 1.2 のためだけに存在し、測定が済んだら削除する。
#
# タスク1.1(完了): arm64 標準ランナーが個人アカウント所有のパブリックリポジトリで
# 起動するかの確認。run 32106160197 で aarch64 を確認済み。
#
# タスク1.2: baseline の測定。現行mainの Dockerfile.prod を arm64 で組み立てて
# スキャンし、blocking(FixedVersion 非空かつ CRITICAL/HIGH)の件数・
# 検査対象のアーキテクチャ・区間ごとの所要時間を出す。
#
# 判定スクリプト(タスク2.3 / 2.4)はこの時点では存在しないため、件数は jq の
# 直書きで数える。式は design.md の「判定の定義」に一致させ、タスク2.4 の実装で
# 再利用する。baseline と本実装の件数が同じ定義で出ることを保つため。

on:
  push:
    branches: [ci/container-image-vuln-scan]

permissions:
  contents: read

env:
  # setup-trivy の version 入力の既定値は 'latest' で、指定しないと Trivy 本体は
  # まったく固定されない。design.md の Security Considerations を参照。
  TRIVY_VERSION: "0.74.0"

jobs:
  baseline:
    name: baseline-arm64
    runs-on: ubuntu-24.04-arm
    # 30分に収まるかを測るのが目的なので、上限より長く取る。
    # ここで打ち切ると「30分を超えた」ことしか分からず、内訳が取れない。
    timeout-minutes: 60
    steps:
      - name: Print runner facts
        run: |
          set -euo pipefail
          echo "arch=$(uname -m)"
          echo "nproc=$(nproc)"
          echo "mem=$(free -h | awk '/^Mem:/ {print $2}')"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker ドライバは type=docker エクスポータに非対応のため buildx が要る
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHSA-69fq-xp46-6x23 の安全な参照。v0.3.1 は 2026-06-03 のコミットで
      # 侵害の露出期間(2026-03-19 17:43 〜 21:44)より後。
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}

      - name: Assert trivy version
        run: |
          set -euo pipefail
          actual="$(trivy --version --format json | jq -r '.Version')"
          echo "trivy_version=${actual}"
          if [ "$actual" != "${TRIVY_VERSION}" ]; then
            echo "::error::Trivy のバージョンが指定と一致しません: 期待=${TRIVY_VERSION} 実際=${actual}"
            exit 1
          fi

      # type=docker は単一プラットフォーム専用。これがアーキテクチャ確定の根拠。
      - name: Build production image as single-platform tar
        run: |
          set -euo pipefail
          start=$SECONDS
          docker buildx build \
            --platform linux/arm64 \
            --file docker/backend/Dockerfile.prod \
            --output type=docker,dest=image.tar \
            ./backend
          echo "BUILD_SECONDS=$((SECONDS - start))" >>"$GITHUB_ENV"
          echo "tar_bytes=$(stat -c %s image.tar)"

      # --ignore-unfixed も --severity も付けない。付けると全件提示ができない。
      - name: Scan
        run: |
          set -euo pipefail
          start=$SECONDS
          trivy image --input image.tar --format json --output scan.json
          echo "SCAN_SECONDS=$((SECONDS - start))" >>"$GITHUB_ENV"

      - name: Assert scanned architecture
        run: |
          set -euo pipefail
          arch="$(jq -r '.Metadata.ImageConfig.architecture // "MISSING"' scan.json)"
          echo "scanned_architecture=${arch}"
          if [ "$arch" != "arm64" ]; then
            echo "::error::検査対象のアーキテクチャが arm64 ではありません: ${arch}"
            exit 1
          fi

      - name: Count baseline
        run: |
          set -euo pipefail
          start=$SECONDS

          # design.md の「判定の定義」に一致させる。
          #   fixable = .FixedVersion が存在し空文字列でない
          #   severe  = .Severity が CRITICAL または HIGH
          #   blocking = fixable かつ severe(baseline には抑制が無いため)
          # .Results と .Vulnerabilities はいずれも omitempty で欠落しうるため
          # 両階層に ? を付ける。FixedVersion はパースせず非空判定にのみ使う。
          jq '[ .Results[]?.Vulnerabilities[]?
                | select((.FixedVersion // "") != "")
                | select(.Severity == "CRITICAL" or .Severity == "HIGH")
                | {id: .VulnerabilityID, severity: .Severity,
                   pkgName: .PkgName, installedVersion: .InstalledVersion,
                   fixedVersion: .FixedVersion} ]' scan.json >blocking.json

          jq '[ .Results[]?.Vulnerabilities[]? ]' scan.json >detected.json

          blocking_count="$(jq 'length' blocking.json)"
          detected_count="$(jq 'length' detected.json)"
          echo "JUDGE_SECONDS=$((SECONDS - start))" >>"$GITHUB_ENV"

          echo "BASELINE_BLOCKING=${blocking_count}" >>"$GITHUB_ENV"
          echo "BASELINE_DETECTED=${detected_count}" >>"$GITHUB_ENV"
          echo "blocking=${blocking_count} detected=${detected_count}"

      - name: Report
        run: |
          set -euo pipefail
          total=$((BUILD_SECONDS + SCAN_SECONDS + JUDGE_SECONDS))
          {
            echo "### baseline 測定結果"
            echo
            echo "| 区間 | 秒 |"
            echo "|---|---|"
            echo "| 組み立て | ${BUILD_SECONDS} |"
            echo "| スキャン(DB取得を含む) | ${SCAN_SECONDS} |"
            echo "| 判定 | ${JUDGE_SECONDS} |"
            echo "| **合計** | **${total}**(= $((total / 60)) 分 $((total % 60)) 秒) |"
            echo
            echo "検出 ${BASELINE_DETECTED} 件 / うち blocking ${BASELINE_BLOCKING} 件"
            echo
            if [ "${BASELINE_BLOCKING}" -gt 0 ]; then
              echo "#### blocking の全件"
              echo
              echo "| ID | 深刻度 | パッケージ | 導入版 | 修正版 |"
              echo "|---|---|---|---|---|"
              jq -r '.[] | "| \(.id) | \(.severity) | \(.pkgName) | \(.installedVersion) | \(.fixedVersion) |"' blocking.json
            else
              echo "blocking は0件。"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

          echo "::notice::合計 ${total} 秒 / blocking ${BASELINE_BLOCKING} 件 / 検出 ${BASELINE_DETECTED} 件"
          if [ "$total" -gt 1800 ]; then
            echo "::warning::合計が30分(1800秒)を超えた。要件 1.10 の見直しが要る。"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v6.0.0
        with:
          name: baseline-scan
          path: |
            scan.json
            blocking.json
          retention-days: 3
