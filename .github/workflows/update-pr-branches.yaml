# =====================================================================
# 開いているPRのブランチをmainの最新に合わせる
#
# ブランチ保護の Require branches to be up to date を有効にすると、先行するPRが
# マージされるたびに残りのPRが out-of-date になりマージできなくなる。auto-merge は
# ブランチを自動で最新化せず、Dependabot も衝突が無い限り rebase しない。
# 人間が Update branch を押す運用を避けるため、mainへのpushを起点にここで更新する。
#
# mainへのpushでは、検査が通ったPRだけを更新する。更新するとPRの検査が最初からやり直しに
# なるため、検査の途中や赤のPRを更新すると、マージされないのにやり直しだけが増える(#889)。
# 更新するPRは select-prs-to-update.sh が選ぶ(「検査が通った」の決め方はその冒頭)。
# mainが進んだ時点で検査が通っていなかったPRは、検査が終わったとき(workflow_run)に
# 選び直す。この起点が無いと、検査が通ったあとも古いままで、次にmainへpushされるまで止まる。
# workflow_run は main のワークフローとスクリプトで動き、PRのコードを実行しない。
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
#
# PRを出したとき(opened / reopened / ready_for_review)にも、そのPRだけを更新する。
# mainへのpushだけを起点にすると、最後のpushのあとに古いmainから作ったブランチで
# 出したPRは、次にmainへpushされるまで out-of-date のまま止まるため。
# mainと衝突しているPRでは GitHub が pull_request のワークフローを起動しないので、
# PRの起点では動かない。衝突の解消は、PRを出した側(/ship の見届け)が受け持つ。
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
#
# 同時実行の組は、pushの実行と、PRの起点の実行と、検査が終わったときの実行で分ける。同じ組では待てる実行が1つだけで、
# 新しい実行が待ちに入るとそれまで待っていた実行が取り消されるため、PRの起点の実行が
# 待っているpushの実行を取り消し、ほかのPRが更新されないまま残る。
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
#
# GITHUB_TOKEN ではなくPATを使う。GITHUB_TOKEN によるpushは後続のワークフローを
# 起動しないため、ブランチを最新化しても検査が再実行されず、必須チェックが古いSHAの
# ままになってマージできない。
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/trigger-a-workflow#triggering-a-workflow-from-a-workflow
#
# カナリアPR(ブランチ名 canary/、ラベル canary)は最新化しない。マージしてはならない
# PRのため最新化する必要が無く、最新化するとmainが進むたびに検査が動き直す。
# 判定の条件は auto-merge.yaml(reserve-auto-merge.sh)と揃える。
#
# 更新に失敗したPRは out-of-date のまま残り、必須チェックの設定によりマージされない。
# 失敗は実行ログに残す。
# =====================================================================
name: Update PR Branches

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  # 必須の検査(承認で結果が変わるものを除く)を持つワークフロー。必須の検査を別のワークフローに
  # 足したら、ここにも足す(足さないと、その検査が最後に終わったPRが古いまま止まる)
  workflow_run:
    workflows: [CI Workflow, Guardrails, CodeQL, Container Image Vulnerability Scan, Dependency Review, Terraform]
    types: [completed]

# GITHUB_TOKEN は読み取りだけに使う(スクリプトの取得と、PR・検査の結果の照会)。
# 更新は BOT_GITHUB_TOKEN で行う
permissions:
  contents: read
  pull-requests: read
  checks: read

# pushの実行は1つの組で順に動かす。PRの起点の実行はPRごとの組に、検査が終わったときの実行は
# コミットごとの組に入れ、待っているpushの実行を取り消さない
concurrency:
  group: ${{ github.event_name == 'push' && 'update-pr-branches' || github.event_name == 'workflow_run' && format('update-pr-branches-head-{0}', github.event.workflow_run.head_sha) || format('update-pr-branches-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  update:
    name: update-pr-branches
    # forkのPRにはシークレットが渡らず、forkのブランチには書き込めないため外す。
    # 検査が終わったときの起点は、PRの検査の実行だけを受ける(mainへのpushや定期実行の検査を外す)。
    # 取り消された実行も外す(新しいコミットが積まれたときで、新しいコミットの実行が終わると起動する)
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.event, 'pull_request') && github.event.workflow_run.conclusion != 'cancelled') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 更新するPRを選ぶスクリプトを main から取る。PRの起点では使わないので取らない
      # (PRの起点の既定の取得先はPRのコードで、それを実行しないためでもある)
      - name: Checkout (main)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Update out-of-date PR branches
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # 対象の判定の式。どの起点もこの式だけを使う。
          # forkのブランチには書き込めないため同一リポジトリのPRに限る。
          # draft は検査を回す段階に無いため除く。
          # カナリアPRはマージしないため除く(ブランチ名かラベルのどちらかで判定する)。
          # env.REPO は jq が環境変数から読む(ステップの env の REPO)。
          TARGET_FILTER='select(.draft == false) | select(.head.repo.full_name == env.REPO) | select((.head.ref | startswith("canary/")) | not) | select(any(.labels[]?; .name == "canary") | not)'

          failed=0

          # update-branch を呼び、応答の文面で、最新化した・すでに最新・衝突・想定外の失敗を分ける。
          # 想定外の失敗は数えておき、最後にジョブを赤にする。
          update_branch() {
            local n="$1"
            local out

            if out=$(gh api -X PUT "repos/${REPO}/pulls/${n}/update-branch" 2>&1); then
              echo "最新化しました: #${n}"
              return 0
            fi

            case "$out" in
              *"not behind"* | *"up to date"* | *up-to-date*)
                echo "すでに最新です: #${n}"
                ;;
              *conflict*)
                echo "::warning::#${n} は衝突しているため最新化できません。解決が要ります。"
                ;;
              *)
                echo "::warning::#${n} の最新化に失敗しました: ${out}"
                failed=$((failed + 1))
                ;;
            esac
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            # 検査が通っていて main より古いPRを選ぶ。検査が終わったときの起点では、
            # 最新のコミットが HEAD_SHA のPRだけを見る(pushの起点では HEAD_SHA は空)。
            # 判定できないPRがあっても、選ばれたPRは更新し、最後にジョブを赤にする。
            numbers=$(GH_TOKEN="$READ_TOKEN" TARGET_FILTER="$TARGET_FILTER" bash .github/scripts/select-prs-to-update.sh) || failed=$((failed + 1))

            for n in $numbers; do
              update_branch "$n"
            done
          else
            # イベントの中身ではなく、実行の時点のラベルと下書きの状態で判定するため、PRを取り直す。
            pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
            n=$(jq -r "${TARGET_FILTER} | .number" <<<"$pr")

            if [ -z "$n" ]; then
              echo "#${PR_NUMBER} は最新化の対象外です(下書き・カナリアPR・forkのいずれか)。"
              exit 0
            fi

            # 出した直後のブランチは最新であることが多い。update-branch の応答の文面に頼らず、
            # 比較の API で main より古いかを先に確かめる。
            head_sha=$(jq -r '.head.sha' <<<"$pr")
            behind_by=$(gh api "repos/${REPO}/compare/main...${head_sha}" --jq '.behind_by')

            if [ "$behind_by" -eq 0 ]; then
              echo "すでに最新です: #${n}"
            else
              update_branch "$n"
            fi
          fi

          # 想定外の失敗はジョブを赤にする。更新されなかったPRは out-of-date のまま
          # 残りマージされないため、見落としても取り込まれることはない。
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} 件のPRで想定外の失敗が起きました。"
            exit 1
          fi
