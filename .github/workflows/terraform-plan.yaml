name: Terraform

on:
  pull_request:
    branches: [main]
  # マージ列でも terraform の静的検査を必須チェックとして報告する。
  # 報告しないチェックが残るとキュー側のタイムアウトで失敗扱いになる
  merge_group:
    types: [checks_requested]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: '1.9.0'

jobs:
  # ワークフロー単位の paths フィルタは使わない。フィルタでワークフロー自体が
  # 起動しないと、必須チェックに指定したときにステータスが報告されず、
  # terraform を触らないPRが「Waiting for status to be reported」で止まる。
  # ジョブ単位のスキップは成功として報告されるため、ci.yaml と同じ方式にする。
  detect-terraform-changes:
    runs-on: ubuntu-latest
    # merge_group でも実行されるため、ワークフローレベルの id-token / pull-requests を
    # 継承させずに必要な権限だけを明示する
    permissions:
      contents: read
    outputs:
      terraform_changed: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run paths-filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - 'docker/terraform/**'
              - '.github/workflows/terraform-plan.yaml'

  # AWS認証を必要としない検査。plan と分けているのは、認証やsecretsが無い状況でも
  # 動かせるようにするため。ローカルの /verify-terraform と同じイメージを使い、
  # tflint と checkov のバージョンをCIとローカルで一致させる。
  terraform-static:
    name: terraform-static
    needs: detect-terraform-changes
    if: needs.detect-terraform-changes.outputs.terraform_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build terraform tooling image
        run: docker build -f docker/terraform/Dockerfile -t keirekipro-terraform .

      - name: Terraform Format Check
        run: |
          docker run --rm -v "$PWD/terraform:/workspace" -w /workspace \
            --entrypoint terraform keirekipro-terraform fmt -check -recursive

      - name: Terraform Validate
        # backend=false でS3バックエンドの初期化を省く。構文と参照の検証には要らない
        run: |
          docker run --rm -v "$PWD/terraform:/workspace" -w /workspace \
            --entrypoint sh keirekipro-terraform -c \
            'terraform init -backend=false -input=false >/dev/null && terraform validate'

      - name: tflint
        run: |
          docker run --rm -v "$PWD/terraform:/workspace" -w /workspace \
            --entrypoint tflint keirekipro-terraform --recursive

      - name: checkov
        # 既存の指摘は .checkov.baseline で凍結してある(#124)。
        # baselineに無い指摘が出たら失敗する
        run: |
          docker run --rm -v "$PWD/terraform:/workspace" -w /workspace \
            --entrypoint checkov keirekipro-terraform -d .

  # plan結果はPRのコメントとして人間が読むためのもので、マージ列には要らない。
  # Comment on PR が使う context.issue.number が merge_group では未定義になり
  # API呼び出しが失敗するため、マージ列では実行しない。必須チェックではないので
  # キューは詰まらないが、terraformを触るPRのマージ列が毎回赤バッジ付きになるのを避ける
  terraform-plan:
    needs: detect-terraform-changes
    if: >-
      github.event_name != 'merge_group' &&
      needs.detect-terraform-changes.outputs.terraform_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/keirekipro-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -var-file=environments/prod/terraform.tfvars -no-color -out=tfplan \
            -var="jwt_secret=${{ secrets.TF_VAR_jwt_secret }}" \
            -var="google_oauth_client_id=${{ secrets.TF_VAR_google_oauth_client_id }}" \
            -var="google_oauth_client_secret=${{ secrets.TF_VAR_google_oauth_client_secret }}" \
            -var="github_oauth_client_id=${{ secrets.TF_VAR_github_oauth_client_id }}" \
            -var="github_oauth_client_secret=${{ secrets.TF_VAR_github_oauth_client_secret }}" \
            -var="alert_email_address=${{ secrets.TF_VAR_alert_email_address }}"
        continue-on-error: true

      - name: Generate Plan Output
        id: show
        run: terraform show -no-color tfplan
        continue-on-error: true

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const initOutcome = '${{ steps.init.outcome }}';
            const validateOutcome = '${{ steps.validate.outcome }}';
            const planOutcome = '${{ steps.plan.outcome }}';

            let planOutput = `${{ steps.show.outputs.stdout }}`;

            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const failureNote = planOutcome === 'success'
              ? ''
              : `\n> :x: Planが失敗しました。詳細は [Actionsの実行ログ](${runUrl}) を参照してください。\n`;

            // 出力が長すぎる場合は切り詰める
            const maxLength = 60000;
            if (planOutput.length > maxLength) {
              planOutput = planOutput.substring(0, maxLength) + '\n\n... (truncated)';
            }

            const output = `## Terraform Plan Results

            | Step | Status |
            |------|--------|
            | ⚙️ Init | ${initOutcome === 'success' ? '✅ Success' : '❌ Failed'} |
            | ✅ Validate | ${validateOutcome === 'success' ? '✅ Success' : '❌ Failed'} |
            | 📖 Plan | ${planOutcome === 'success' ? '✅ Success' : '❌ Failed'} |
            ${failureNote}
            <details><summary>📋 Show Plan Output</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            // 既存のコメントを探して更新、なければ新規作成
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## Terraform Plan Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output
              });
            }

      - name: Exit on Plan Failure
        if: steps.plan.outcome == 'failure'
        run: exit 1
