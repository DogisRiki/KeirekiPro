name: Claude

# プロアクティブループ:
#   1. @claude メンション(Issue/PRコメント)からの起動
#   2. 週次の依存バージョン更新レーン(追加は不可。追加は dependency-gate が人間承認を要求する)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC): 依存バージョン更新
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  claude-mention:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  weekly-dependency-update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code (dependency updates)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            週次の依存バージョン更新レーンです。以下を実施してください。

            1. frontend: `cd frontend && pnpm outdated` で更新可能な依存を確認し、
               既存依存の「バージョン更新のみ」を patch/minor 範囲で適用する
               (`pnpm update --latest` は使わず、メジャー更新と新規追加はしない)
            2. backend: `backend/build.gradle` の既存依存のバージョンを最新の patch/minor に更新する
               (新規依存の追加はしない)
            3. セキュリティアドバイザリ(`gh api` の Dependabot alerts か `pnpm audit`)を確認し、
               該当があれば優先的に更新する
            4. CLAUDE.md の品質ゲート(CI環境ではネイティブ実行)を通す
            5. 変更があれば `.commit_template` 準拠でコミットし、featureブランチ
               (`chore/weekly-dependency-update-<日付>`)へpushしてPRを作成、
               PR本文に更新内容の一覧と `Refs: N/A` を記載し、auto-merge(squash)を予約する
            6. 更新対象が無ければ何もせず終了する

            注意: 依存の「追加」を行うと dependency-gate が人間承認を要求します。
            このレーンでは追加を行わないでください。メジャー更新が必要な場合はIssueを起票してください。
