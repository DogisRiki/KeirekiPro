name: Claude

# @claude メンション(Issue/PRコメント)からの起動。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-mention:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Run Claude Code
        # 長期PATを渡すためコミットSHAで固定する(タグは差し替え可能なため)。
        # SHAとバージョンコメントはDependabotのgithub-actionsレーンが更新する
        uses: anthropics/claude-code-action@239e3a730883eeb5c53db12b0fc9573b3024b126 # v1.0.191
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 既定のGITHUB_TOKENで作成したPRはワークフローを起動しない(GitHubの再帰防止仕様)。
          # botのPATを渡すことで、作成されたPRで必須チェックが発火する。
          github_token: ${{ secrets.BOT_GITHUB_TOKEN }}
          # Bashは既定で無効のため、必要なコマンドだけを明示的に許可する。
          # 用途は Issue/PR からの調査・小修正・PR作成に限定する。
          # 参照: https://github.com/anthropics/claude-code-action/blob/main/docs/configuration.md
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(cd:*),Bash(pnpm:*),Bash(git:*),Bash(gh:*)"
            --disallowedTools "Bash(gh extension:*),Bash(git config:*)"
