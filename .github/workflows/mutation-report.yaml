name: Mutation Report

# 週次のmutation testingレポート(レポートモード。PR必須ゲートにはしない)。
# スコア低下は retrospective の入力とし、月次監査で確認する。

on:
  schedule:
    # 毎週土曜 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.16.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Stryker (report mode)
        working-directory: frontend
        continue-on-error: true
        run: |
          pnpm exec stryker run 2>&1 | tail -50 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Stryker report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: stryker-report
          path: frontend/reports/
          retention-days: 30
          if-no-files-found: ignore

  backend-mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run PIT (report mode)
        working-directory: backend
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew pitest 2>&1 | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload PIT report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pitest-report
          path: backend/build/reports/pitest/
          retention-days: 30
          if-no-files-found: ignore
