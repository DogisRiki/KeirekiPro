name: Mutation Report

# 週次のmutation testingレポート(レポートモード。PR必須ゲートにはしない)。
# スコア低下は月次監査(項目2)で確認する。比較の材料として、実行のたびに
# スコアを台帳のIssue「メトリクス台帳: mutationスコア」に1行追記する(#334)。
# 行には測定方式(全件か、前回の結果を使った差分か)を残す。全件の回だけ、
# 直前の全件の回との差と、main で最後にテストを実行した CI のカバレッジ
# (値と基準値)を台帳のIssueにコメントし、所有者にメンションする(#415)。
# 差分の回は追記だけで、コメントしない。良し悪しは判定しない。
# backend は、Java 版(PIT)と Go 版(gremlins の make mutation-full)の両方を測る(#445)。

on:
  schedule:
    # 毎週土曜 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      full:
        description: 'frontendの前回の結果を使わず、全件を測り直す'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # 全件の測定は4時間半ほどかかり、ジョブの上限(6時間)に近い(#377)。
  # そのため、前回の結果を使い回し、変わった箇所だけを測り直す(Stryker の incremental モード)。
  # 前回の結果は、main で実行したときの成果物 stryker-report(保持90日)から取り出す。
  # actions/cache は7日アクセスが無いと消え、週次の間隔と境目が重なるため使わない。
  frontend-mutation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      # Node.js は配布元の署名を確かめてから入れる(.github/actions/verified-node)。
      # setup-node は node-version を省くと PATH の Node.js を使うので、pnpm のキャッシュにだけ使う
      - name: Use Node.js
        uses: ./.github/actions/verified-node
        with:
          node-version: '24.22.2'

      - name: Cache pnpm store
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # incremental モードは、依存の更新など、変異させる対象とテスト以外の変更を検出しない。
      # 古い結果を使い回し続けないように、毎月最初の定期実行(と、手動実行で full を
      # 選んだとき)は前回の結果を使わず、全件を測り直す。月次監査の前に全件の値がそろう
      #
      # 決めた測定方式は出力 mode に書き、job の出力で record-metrics に渡す
      # (台帳の行の測定方式の列と、全件の回だけのコメントに使う)。どの分岐で
      # 終わっても1回だけ書く。
      #   full-scheduled    毎月最初の定期実行(UTC の1〜7日)
      #   full-manual       手動実行で full を選んだ
      #   full-no-previous  前回の結果が見つからない・取得に失敗した・成果物に結果が無い
      #   incremental       前回の結果を使う(差分)
      - name: Download previous Stryker report
        id: mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_INPUT: ${{ inputs.full }}
        run: |
          if [ "$FULL_INPUT" = true ]; then
            echo "mode=full-manual" >>"$GITHUB_OUTPUT"
            echo "全件を測り直す(手動実行で full を選んだため、前回の結果を使わない)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date -u +%-d)" -le 7 ]; then
            echo "mode=full-scheduled" >>"$GITHUB_OUTPUT"
            echo "全件を測り直す(毎月最初の定期実行のため、前回の結果を使わない)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=stryker-report&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")]
                  | sort_by(.created_at) | last | .workflow_run.id // empty') || run_id=""
          # 取り出せないときは全件の測定になる(Stryker は結果ファイルが無ければ全件を測る)
          if [ -z "$run_id" ] || ! gh run download "$run_id" -n stryker-report -D "${RUNNER_TEMP}/previous-stryker"; then
            echo "mode=full-no-previous" >>"$GITHUB_OUTPUT"
            echo "前回の結果が見つからないため、全件を測る" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -f "${RUNNER_TEMP}/previous-stryker/mutation/mutation.json" ]; then
            cp "${RUNNER_TEMP}/previous-stryker/mutation/mutation.json" "${RUNNER_TEMP}/stryker-incremental.json"
            echo "mode=incremental" >>"$GITHUB_OUTPUT"
            echo "前回の結果(run ${run_id})を使い、変わった箇所だけを測り直す" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=full-no-previous" >>"$GITHUB_OUTPUT"
            echo "前回の成果物(run ${run_id})に結果が無いため、全件を測る" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # 前回の結果が無いときも --incremental はそのまま渡してよい(全件の測定になる)
      - name: Run Stryker (report mode)
        shell: bash
        working-directory: frontend
        continue-on-error: true
        run: |
          pnpm exec stryker run --incremental --incrementalFile "${RUNNER_TEMP}/stryker-incremental.json" 2>&1 \
            | tail -50 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Stryker report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stryker-report
          path: frontend/reports/
          retention-days: 90
          if-no-files-found: ignore

  backend-mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'backend/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run PIT (report mode)
        shell: bash
        working-directory: backend
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew pitest 2>&1 | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload PIT report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pitest-report
          path: backend/build/reports/pitest/
          retention-days: 90
          if-no-files-found: ignore

  # Go 版の backend の全体の変異テスト(make mutation-full)。PIT と同じく、毎回全件を測る。
  # gremlins は JSON の報告を backend/mutation-report.json に書き(Makefile の MUTATION_REPORT)、
  # record-metrics がそれを台帳に記録する。変異が1つも作られなかったときは、gremlins は
  # 報告を書かない(台帳には「取得できず」と残る)。
  # 結合テストは testcontainers-go がランナーの Docker で Postgres と Redis を動かす
  # (CI の backend-go の仕事と同じ)。
  backend-go-mutation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go の版は backend/go.mod に書いた版を使う(CI の backend-go の仕事と同じ)
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run gremlins (report mode)
        shell: bash
        continue-on-error: true
        run: |
          make mutation-full 2>&1 | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload gremlins report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gremlins-report
          path: backend/mutation-report.json
          retention-days: 90
          if-no-files-found: ignore

  # スコアを台帳のIssueに1行追記する。レポートが無い側は「取得できず」と記録し、
  # 測定が止まったことを台帳の上で見えるようにする(実例: #372)。
  # 監査のワークフローは状態を持たない(audit-automation の要件6-3)ため、
  # 記録は測定したこのワークフローが行う。
  #
  # 測定方式(MUTATION_MODE)は frontend-mutation の出力 mode を使う。frontend の
  # job が途中で失敗して出力が無いときは、前回の結果なしの全件として扱う
  # (backend の PIT と gremlins は毎回全件を測るため)。全件の回は、直前の全件の回との差と
  # カバレッジを台帳のIssueにコメントし、差分の回は行の追記だけにする。
  # カバレッジは測り直さず、main で最後にテストを実行した CI の成果物と
  # ゲート設定の基準値を読む(collect-coverage.sh)。カバレッジを読めなくても
  # 記録とコメントは止めず、コメントのカバレッジの欄を「取得できず」にする。
  record-metrics:
    needs: [frontend-mutation, backend-mutation, backend-go-mutation]
    if: always()
    runs-on: ubuntu-latest
    # actions: read は、カバレッジを載せた CI の成果物の一覧と取得に使う
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      MUTATION_MODE: ${{ needs.frontend-mutation.outputs.mode || 'full-no-previous' }}
    # 手動実行と定期実行が重なっても、台帳の本文の読み書きが交差しないようにする
    concurrency:
      group: mutation-metrics-ledger
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # レポートが無い(測定が失敗した)ときはダウンロードも失敗する。
      # その場合も記録は行うため、ここでは止めない
      - name: Download PIT report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pitest-report
          path: ${{ runner.temp }}/pitest-report

      - name: Download Stryker report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stryker-report
          path: ${{ runner.temp }}/stryker-report

      - name: Download gremlins report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gremlins-report
          path: ${{ runner.temp }}/gremlins-report

      # 記録の前にスクリプトのテストを行う。壊れたスクリプトで台帳を書き換えない。
      # 2本は途中で失敗しても両方実行し、1本でも失敗したら赤で終える
      # (以降の記録は行わない)
      - name: Test recorder
        run: |
          set -uo pipefail
          failed=0
          for t in test-lib-ledger-issue test-record-mutation-metrics; do
            echo "::group::${t}.sh"
            if ! bash ".github/scripts/tests/${t}.sh"; then
              echo "::error::${t}.sh が失敗しました。"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::記録のスクリプトのテストに失敗しました。台帳のIssueは操作しません。"
            exit 1
          fi

      # カバレッジの読み取りのテスト。このテストは今のリポジトリのゲート設定
      # (vite.config.ts と quality.gradle と backend/.testcoverage.yml)と
      # backend/go.mod も読むため、設定の書き方が変わると
      # 失敗する。失敗しても記録は止めず(continue-on-error)、カバレッジの
      # 読み取りだけを行わない(コメントのカバレッジの欄が「取得できず」になる)
      - name: Test coverage collector
        id: test-coverage
        continue-on-error: true
        run: bash .github/scripts/tests/test-collect-coverage.sh

      # 全件の回だけ、カバレッジを読む。失敗・時間切れでも記録は止めない
      # (continue-on-error)。成功したときだけ Record scores に COVERAGE_FILE を渡す。
      # gh api には時間の上限が無いため、ステップに上限を付ける
      - name: Collect coverage
        id: coverage
        if: startsWith(env.MUTATION_MODE, 'full') && steps.test-coverage.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/collect-coverage.sh "${RUNNER_TEMP}/coverage.md"

      # 終了コードの契約は record-mutation-metrics.sh の冒頭を参照。
      # GITHUB_REPOSITORY_OWNER と GITHUB_RUN_ID はランナーの既定の環境変数を使う。
      # COVERAGE_FILE が空(カバレッジを読まなかった・読めなかった)のときは、
      # コメントのカバレッジの欄が「取得できず」になる
      - name: Record scores
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_FILE: ${{ steps.coverage.outcome == 'success' && format('{0}/coverage.md', runner.temp) || '' }}
        run: |
          bash .github/scripts/record-mutation-metrics.sh \
            "${RUNNER_TEMP}/pitest-report/mutations.xml" \
            "${RUNNER_TEMP}/stryker-report/mutation/mutation.json" \
            "${RUNNER_TEMP}/gremlins-report/mutation-report.json"
