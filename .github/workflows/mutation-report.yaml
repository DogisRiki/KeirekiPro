name: Mutation Report

# 週次のmutation testingレポート(レポートモード。PR必須ゲートにはしない)。
# スコア低下は月次監査(項目2)で確認する。比較の材料として、実行のたびに
# スコアを台帳のIssue「メトリクス台帳: mutationスコア」に1行追記する(#334)。

on:
  schedule:
    # 毎週土曜 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Stryker (report mode)
        working-directory: frontend
        continue-on-error: true
        run: |
          pnpm exec stryker run 2>&1 | tail -50 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Stryker report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stryker-report
          path: frontend/reports/
          retention-days: 90
          if-no-files-found: ignore

  backend-mutation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run PIT (report mode)
        working-directory: backend
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew pitest 2>&1 | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload PIT report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pitest-report
          path: backend/build/reports/pitest/
          retention-days: 90
          if-no-files-found: ignore

  # スコアを台帳のIssueに1行追記する。レポートが無い側は「取得できず」と記録し、
  # 測定が止まったことを台帳の上で見えるようにする(実例: #372)。
  # 監査のワークフローは状態を持たない(audit-automation の要件6-3)ため、
  # 記録は測定したこのワークフローが行う。
  record-metrics:
    needs: [frontend-mutation, backend-mutation]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # 手動実行と定期実行が重なっても、台帳の本文の読み書きが交差しないようにする
    concurrency:
      group: mutation-metrics-ledger
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # レポートが無い(測定が失敗した)ときはダウンロードも失敗する。
      # その場合も記録は行うため、ここでは止めない
      - name: Download PIT report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pitest-report
          path: ${{ runner.temp }}/pitest-report

      - name: Download Stryker report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stryker-report
          path: ${{ runner.temp }}/stryker-report

      # 記録の前にスクリプトのテストを行う。壊れたスクリプトで台帳を書き換えない
      - name: Test recorder
        run: bash .github/scripts/tests/test-record-mutation-metrics.sh

      - name: Record scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/record-mutation-metrics.sh \
            "${RUNNER_TEMP}/pitest-report/mutations.xml" \
            "${RUNNER_TEMP}/stryker-report/mutation/mutation.json"
