name: CI Workflow

# 本番デプロイはこのワークフローからは行わない。
# mainへのマージ = デプロイ可能な状態の確定(成果物artifactの保存)であり、
# 実際の本番反映は release.yaml (workflow_dispatch) の手動トリガーでのみ行う。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production-release' || format('ci-pr-{0}', github.event.pull_request.number || github.run_id) }}
  # PRは同一PRの並走をキャンセルする(mainへのpushはキャンセルしない)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    # ジョブ単位のpermissionsはワークフロー全体の指定を置き換えるため、
    # checkout用の contents: read もここに明示する。
    # actions: read は audit-liveness ステップが実行履歴APIを読むためだけに要る。
    permissions:
      contents: read
      actions: read
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      backend_changed: ${{ steps.filter.outputs.backend }}
      backend_java: ${{ steps.backend.outputs.backend_java }}
      backend_go: ${{ steps.backend.outputs.backend_go }}
      backend_compat: ${{ steps.backend.outputs.backend_compat }}
      dockerfile_changed: ${{ steps.filter.outputs.dockerfile }}
      dockerfile_files: ${{ steps.filter.outputs.dockerfile_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run paths-filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # dockerfile だけ変更ファイルの一覧も受け取る。ビルドし直す対象を
          # このジョブの判定結果だけから決めるため(条件が2箇所に分かれないようにする)。
          #
          # 形式はjsonにする。shell形式は特殊文字を含むパスをクォートで包むが、
          # そのクォートは非クォート展開では解釈されず、該当ファイルが「存在しないパス」
          # として黙ってスキップされる(= ビルドされないまま緑になる)ため使わない。
          list-files: json
          filters: |
            frontend:
              - 'frontend/**'
            # backend-test を動かすかの見分け。Go 版の本番のイメージの Dockerfile は
            # docker/backend-go/ にあるので、docker/backend*/** も含める。
            backend:
              - 'backend/**'
              - 'docker/backend*/**'
            # 下の3つは、backend の3つの仕事を動かすかを決めるもとの見分け。
            # ファイルの形は design.md の「CI の仕事」の一覧と同じにする。
            # マイグレーションのファイルは、Java 版と Go 版が同じものを読むので、
            # backend_java(backend/src/** に含まれる)と backend_go の両方に当たる。
            backend_java:
              - 'backend/src/**'
              - 'backend/*.gradle'
              - 'backend/gradle/**'
              - 'backend/config/**'
              - 'backend/gradlew*'
              - 'docker/backend/**'
            backend_go:
              - 'backend/**/*.go'
              - 'backend/go.mod'
              - 'backend/go.sum'
              - 'backend/Makefile'
              - 'backend/.golangci.yml'
              - 'backend/.testcoverage.yml'
              - 'backend/.gremlins.yaml'
              - 'backend/api/**'
              - 'backend/sqlc.yaml'
              - 'backend/assets/**'
              - 'backend/src/main/resources/db/migration/**'
              - 'docker/backend-go/**'
            backend_compat:
              - 'backend/compat/**'
            dockerfile:
              - 'docker/**/Dockerfile*'

      # backend の3つの仕事の見分けを、検査するコミットにあるファイルで絞る。
      # backend_go は、backend/go.mod があるときだけ当てる。Go 版の土台が main に入る前に、
      # マイグレーションのファイルか backend/api/** を変えた PR で、Go 版のコードが無いまま
      # backend-go が動いて失敗しないようにするため。
      # backend_compat は、backend/compat/ があり、変わったファイルが Java 版か Go 版か
      # 比べる検査のファイルに当たるときだけ当てる。比べる検査のコードが main に入る前に、
      # backend-compat がコードの無いまま動いて失敗しないようにするため。
      # paths-filter の値が true でも false でもないときは、成功に倒さず失敗にする。
      - name: Decide backend jobs
        id: backend
        env:
          JAVA_FILES: ${{ steps.filter.outputs.backend_java }}
          GO_FILES: ${{ steps.filter.outputs.backend_go }}
          COMPAT_FILES: ${{ steps.filter.outputs.backend_compat }}
        run: |
          set -euo pipefail
          for v in "$JAVA_FILES" "$GO_FILES" "$COMPAT_FILES"; do
            if [ "$v" != true ] && [ "$v" != false ]; then
              echo "::error::paths-filter の backend の見分けの値(${v})を読めませんでした。"
              exit 1
            fi
          done
          go=false
          if [ "$GO_FILES" = true ] && [ -f backend/go.mod ]; then
            go=true
          fi
          compat=false
          if [ -d backend/compat ] && { [ "$JAVA_FILES" = true ] || [ "$GO_FILES" = true ] || [ "$COMPAT_FILES" = true ]; }; then
            compat=true
          fi
          {
            echo "backend_java=${JAVA_FILES}"
            echo "backend_go=${go}"
            echo "backend_compat=${compat}"
          } >> "$GITHUB_OUTPUT"
          echo "backend の見分け: backend_java=${JAVA_FILES} backend_go=${go} backend_compat=${compat}"

      # 週次監査(audit-weekly.yaml)自体が止まったことを次のPRで検知する(死活確認)。
      # 監査を監視する専用の仕組みは「それを誰が監視するか」の入れ子になるため作らず、
      # 全PRで必ず実行されるこのジョブの末尾に1ステップだけ置く。
      #
      # pull_request 限定の理由: ci.yaml はmainへのpushでも起動するが、push実行で
      # このステップが落ちると frontend-test がスキップされ、デプロイ用artifactの
      # 保存が欠落する(マージ後経路の破壊。#326と同型の事故)。要件もPRのCIに限定している。
      #
      # 「成功」ではなく「完了」(結論を問わない)を見る理由: 死活確認が知りたいのは
      # 監査が動いているかであり、監査の結果ではない。成功だけを数えると、逸脱を
      # 見つけた監査が赤で終わるたびに全PRが止まり、逸脱を直すPRまでマージできなくなる
      # (#347 の行き詰まり)。逸脱と判定不能は監査側が通知Issueで知らせる。
      # 残余リスク: 「完了」にはキャンセルや通知の失敗で終わった実行も含まれるため、
      # 判定が行われたかどうかはここでは分からない。判定の有無は判定不能のIssueで見る。
      #
      # 完了ゼロ=pass の理由: 導入直後は完了した実行が存在しないため。ただしこの判定は
      # 「登録はあるが一度も完了していない」場合も素通りするため、マージ後に
      # workflow_dispatch で audit-weekly の完了を1件作ることを導入手順の必須ステップとする。
      #
      # 判定不能(API失敗・応答を解釈できない)は成功に倒さず赤にする(fail closed)。
      # 判定はAPI 1リクエストだけのため、再実行は安価。
      - name: Check audit liveness
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # status=completed(結論を問わない)で絞り、最新1件だけを取る(1リクエスト)。
          # status の値の定義: https://docs.github.com/en/rest/actions/workflow-runs#list-workflow-runs-for-a-workflow
          # 取得の失敗を「完了ゼロ」と混同しない(API障害を「導入直後」と誤読しない)。
          # ただし 404(ワークフロー未登録)だけは導入前の正常な状態として通過させる。
          # audit-weekly.yaml を追加するPR自身のCIがこのステップを含むため、404 を
          # 判定不能扱いにすると導入PRが構造的にマージできなくなる(2026-09-06 実測)。
          # gh api はHTTPエラーでも応答ボディをstdoutへ出すので、失敗時はボディで判別する。
          runs_json=""
          if ! runs_json=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/audit-weekly.yaml/runs?status=completed&per_page=1" 2>/dev/null); then
            if printf '%s' "$runs_json" | jq -e '(.message? // "") == "Not Found"' >/dev/null 2>&1; then
              echo "audit-weekly はまだ登録されていないため通過します(導入前の許容。マージ後に workflow_dispatch で初回の完了を作る)。"
              exit 0
            fi
            echo "::error::週次監査(audit-weekly)の実行履歴を取得できませんでした(判定不能)。成功に倒さず失敗にしています。このジョブを再実行してください。"
            exit 1
          fi

          # workflow_runs が配列であることを確かめてから読む。エラーメッセージの
          # JSON(例: {"message":"Not Found"})を「完了ゼロ」と誤読しないため。
          latest=""
          if ! latest=$(printf '%s' "$runs_json" | jq -er \
              'if (.workflow_runs | type) == "array" then
                 (if (.workflow_runs | length) == 0 then "none" else .workflow_runs[0].created_at end)
               else empty end' 2>/dev/null); then
            echo "::error::週次監査(audit-weekly)の実行履歴の応答を解釈できませんでした(判定不能)。成功に倒さず失敗にしています。このジョブを再実行してください。"
            exit 1
          fi

          if [ "$latest" = "none" ]; then
            echo "audit-weekly の完了した実行はまだ存在しないため通過します(導入直後の許容)。"
            exit 0
          fi

          latest_epoch=""
          if ! latest_epoch=$(date -u -d "$latest" +%s 2>/dev/null); then
            echo "::error::週次監査(audit-weekly)の直近の完了の日時(${latest})を解釈できませんでした(判定不能)。成功に倒さず失敗にしています。"
            exit 1
          fi

          now_epoch=$(date -u +%s)
          age_seconds=$((now_epoch - latest_epoch))

          # 10日 = 864000秒(UTCの秒差)。週1回の監査が1回分丸ごと欠けても
          # 7日+実行遅延に収まるため、10日空いたら「監査が止まった」とみなす。
          if [ "$age_seconds" -ge 864000 ]; then
            echo "::error::週次監査(audit-weekly)の完了した実行が10日以上ありません(直近の完了: ${latest})。監査が止まっています。audit-weekly の状態を確認してください。"
            exit 1
          fi

          echo "audit-weekly の直近の完了: ${latest}(10日未満のため通過)"

  frontend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      # Node.js は配布元の署名を確かめてから入れる(.github/actions/verified-node)。
      # setup-node は node-version を省くと PATH の Node.js を使うので、pnpm のキャッシュにだけ使う
      - name: Use Node.js
        uses: ./.github/actions/verified-node
        with:
          node-version: '24.22.2'

      - name: Cache pnpm store
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Format
        run: pnpm run format

      - name: Run ESLint
        run: pnpm run lint

      # coverage は単体テストを全部流してカバレッジを測る。pnpm test を別に流すと同じテストが2回流れる(#746)
      - name: Run tests with coverage
        run: pnpm run coverage

      - name: Build for production
        run: pnpm run build

      - name: Upload frontend deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 90

      - name: Upload frontend test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-test-results
          path: |
            frontend/test-results/**
            frontend/coverage/**
          # 月1回の mutation の記録が main の直近のカバレッジを読むため、main への push は
          # 公開リポジトリの上限の90日残す(ci.yaml の push は main だけで起動する)。PR は7日のまま。
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

  e2e-smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      # Node.js は配布元の署名を確かめてから入れる(.github/actions/verified-node)。
      # setup-node は node-version を省くと PATH の Node.js を使うので、pnpm のキャッシュにだけ使う
      - name: Use Node.js
        uses: ./.github/actions/verified-node
        with:
          node-version: '24.22.2'

      - name: Cache pnpm store
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build for production
        run: pnpm run build

      - name: Run E2E smoke tests
        run: pnpm exec playwright test

      - name: Upload E2E report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-smoke-report
          path: frontend/playwright-report/
          retention-days: 7

  # backend は、Java 版と Go 版と、2つの版の応答を比べる検査の3つの仕事に分けて検査する。
  # 3つの仕事は、detect-changes の見分け(backend_java / backend_go / backend_compat)が
  # 当たったときだけ動く。必須の検査 backend-test は、3つの仕事の結果を
  # backend-test-verdict.sh で判定する。見分けが当たった仕事が success でないとき、
  # または見分けが当たったのに飛ばされた仕事があるときに、backend-test は失敗する。
  backend-java:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_java == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      # 部品の版は libs.versions.toml に集約してあるので、鍵に含めないと版を上げても
      # キャッシュが保存し直されない。wrapper は Gradle の本体で、毎回のダウンロードを避ける。
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'backend/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      # Configuration Cache を使うと、Gradle は1つのプロジェクトの中のタスクも同時に動かす
      # (https://docs.gradle.org/current/userguide/configuration_cache.html)。
      # Spotless・SpotBugs・Checkstyle がテストを待たずに動く。CI のこのジョブだけに付ける。
      - name: Run backend checks
        run: ./gradlew check --configuration-cache

      # PMD の UnitTestShouldIncludeAssert は check の pmdTest で流れている。別のジョブで
      # 流し直さず、check が作ったレポートから件数を要約する。警告のみなのでジョブを赤にしない。
      - name: Summarize PMD report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          report="build/reports/pmd/test.xml"
          {
            echo "### :mag: 何も検証していないJavaテストのレポート(PMD UnitTestShouldIncludeAssert・警告のみ)"
            echo ""
            if [ ! -f "$report" ]; then
              echo "PMD のレポートが作られなかった。check が pmdTest より前に失敗したため、件数を数えられない。"
            else
              count=$(grep -c "<violation" "$report" || true)
              echo "検出件数: **${count} 件**"
              if [ "$count" -gt 0 ]; then
                echo ""
                echo "誤検知(ヘルパーメソッド経由で検証しているテスト)は、backend/config/pmd/ruleset.xml の"
                echo "extraAssertMethodNames に検証メソッド名を追加して抑える。"
              fi
            fi
            echo ""
            echo "> 昇格条件: 誤検知の設定整理が完了して実検出が0になったら、backend/gradle/quality.gradle の"
            echo "> PMD設定 ignoreFailures を false にしてビルド失敗へ昇格する(昇格はIssueを起票して行う)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 成果物の名前は backend-check-results のまま変えない。月1回の mutation の記録
      # (collect-coverage.sh)が、この名前で main の直近のカバレッジを読むため。
      - name: Upload backend check results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-check-results
          path: |
            backend/build/reports/**
            backend/build/test-results/**
          # 月1回の mutation の記録が main の直近のカバレッジを読むため、main への push は
          # 公開リポジトリの上限の90日残す(ci.yaml の push は main だけで起動する)。PR は7日のまま。
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

  backend-go:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      # PR では、変えた箇所の変異テスト(make mutation-diff)が main との差分を git で読むため、
      # 履歴のすべてを取る。PR と push で値を分ける式は書かない。式の中の数の 0 は偽として
      # 扱われ、`cond && 0 || 1` の形はいつも 1 になるため(PR でも履歴を取れなくなる)。
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Go の版は backend/go.mod に書いた版を使う。開発環境のイメージと同じ版で検査するため。
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # golangci-lint は、公式が勧める、版を固定した実行ファイルで入れる(go tool では入れない)。
      # 版は docker/backend-go/Dockerfile の golangci-lint の版とそろえる。
      # install-only なので、このステップは検査を動かさず、PATH に足すだけにする。
      # 検査は make check の中の make lint が動かす。
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Run backend checks
        run: make check

      # 成果物の名前は backend-go-coverage のまま変えない。週次の mutation の記録
      # (collect-coverage.sh)が、この名前で main の直近の Go 版のカバレッジを読むため。
      # make test が書く coverage.out の1つだけを残す(成果物の最上位に置かれる)。
      # make check が test より前で失敗して coverage.out が無いときは、何も残さない。
      - name: Upload Go coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-go-coverage
          path: backend/coverage.out
          if-no-files-found: ignore
          # 週次の mutation の記録が main の直近のカバレッジを読むため、main への push は
          # 公開リポジトリの上限の90日残す(ci.yaml の push は main だけで起動する)。PR は7日のまま。
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

      # 変えた箇所の変異テストは、git の履歴を読むので CI でだけ動かす。
      # 比べる元の枝の名前は、run: に式を直に書かず、環境変数で渡す。
      - name: Run mutation tests on changed code
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: make mutation-diff BASE="origin/${BASE_REF}"

  backend-compat:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_compat == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 比べる検査は、イメージの組み立てと仕様書と進み具合の表を読むために、リポジトリの最上位のパスを
    # 環境変数 KEIREKIPRO_REPO_ROOT で受け取る。渡さないと、比べる検査は始めに失敗する。
    env:
      KEIREKIPRO_REPO_ROOT: ${{ github.workspace }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # 比べる検査は、2つの版が作った PDF を poppler-utils(pdftotext・pdffonts・pdftoppm)で読んで比べる。
      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      # 比べる検査は、Java 版と Go 版の本番のイメージを、この機械の Docker に組み立てさせてから比べる。
      - name: Run compatibility tests
        run: make compat

      - name: Run cross-version tests
        run: make compat-cross

      # 違いの報告と、失敗したときの両方の版のコンテナのログは、backend/compat/report/ に書かれる。
      - name: Upload compatibility report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-compat-report
          path: backend/compat/report/**
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}

  # 必須の検査。名前は required-checks.json と ruleset に登録した backend-test のまま変えない。
  # always() を付けるのは、3つの仕事のどれかが失敗または飛ばされても、この判定を必ず動かすため。
  # 付けないと、needs の仕事が失敗したときにこの仕事が飛ばされ、飛ばされた必須の検査は
  # 成功と同じに扱われるので、失敗した PR が main に入ってしまう。
  backend-test:
    needs: [detect-changes, backend-java, backend-go, backend-compat]
    if: always() && needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Judge backend jobs
        env:
          BACKEND_JAVA: ${{ needs.detect-changes.outputs.backend_java }}
          BACKEND_GO: ${{ needs.detect-changes.outputs.backend_go }}
          BACKEND_COMPAT: ${{ needs.detect-changes.outputs.backend_compat }}
          JAVA_RESULT: ${{ needs.backend-java.result }}
          GO_RESULT: ${{ needs.backend-go.result }}
          COMPAT_RESULT: ${{ needs.backend-compat.result }}
        run: bash .github/scripts/backend-test-verdict.sh

  # Dockerfileの変更だけでは frontend-test / backend-test / e2e-smoke がどれも動かない。
  # ベースイメージの更新はDependabotによって自動マージされるため、このジョブが無いと
  # 本番イメージのベース更新が一度もビルドされないままmainに入る。
  #
  # 検証はamd64で行う。本番のデプロイ先はarm64だが、書いてあるのはmanifest listの
  # digestであり、arm64のmanifestが存在することは固定時に確認している。
  # ここで捉えるのは、Dockerfileの記述の破綻とベースイメージの中身の変化。
  # arm64に固有の破綻は release.yaml のビルドで検知する。
  docker-smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.dockerfile_changed == 'true'
    runs-on: ubuntu-latest
    # 既定の360分は、配布元が応答しなくなったときに6時間握り続けることを意味する。
    # auto-mergeの待ち時間に直結するため明示する。全Dockerfileを一括変更するPRでも
    # 逐次ビルドの合計が収まる値にする(Dockerfile.prodのGradleビルドが最長で10分強)。
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build changed Dockerfiles
        env:
          DOCKERFILES: ${{ needs.detect-changes.outputs.dockerfile_files }}
        run: |
          set -euo pipefail

          # ガードは jq -e で行う。出力が空文字列・空配列・JSONとして不正の
          # いずれの場合も非ゼロ終了になり、ここで確実に赤にする。
          # ("$(jq 'length' ...)" を [ -eq 0 ] にかける形は、空入力でjqが
          #  出力なしのexit 0となり、ifの条件部のエラーはset -eでも止まらないため、
          #  ガードを素通りして「何もビルドしないまま緑」になる)
          if ! jq -e 'type == "array" and length > 0' >/dev/null <<<"$DOCKERFILES"; then
            echo "::error::変更されたDockerfileを特定できませんでした。"
            exit 1
          fi

          while IFS= read -r f; do
            if [ ! -f "$f" ]; then
              echo "削除されたためスキップします: $f"
              continue
            fi

            # ビルドコンテキストは compose.yaml と backend-deploy.yaml の指定に合わせる。
            # 食い違うと、ここが通ってもデプロイ時のビルドが落ちる。
            case "$f" in
              docker/backend/Dockerfile.prod | docker/backend-go/Dockerfile.prod) context="./backend" ;;
              *) context="." ;;
            esac

            echo "::group::docker build -f $f $context"
            docker build --file "$f" "$context"
            echo "::endgroup::"
          done < <(jq -r '.[]' <<<"$DOCKERFILES")
