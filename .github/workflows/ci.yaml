name: CI Workflow

# 本番デプロイはこのワークフローからは行わない。
# mainへのマージ = デプロイ可能な状態の確定(成果物artifactの保存)であり、
# 実際の本番反映は release.yaml (workflow_dispatch) の手動トリガーでのみ行う。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production-release' || format('ci-pr-{0}', github.event.pull_request.number || github.run_id) }}
  # PRは同一PRの並走をキャンセルする(mainへのpushはキャンセルしない)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      backend_changed: ${{ steps.filter.outputs.backend }}
      dockerfile_changed: ${{ steps.filter.outputs.dockerfile }}
      dockerfile_files: ${{ steps.filter.outputs.dockerfile_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run paths-filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # dockerfile だけ変更ファイルの一覧も受け取る。ビルドし直す対象を
          # このジョブの判定結果だけから決めるため(条件が2箇所に分かれないようにする)。
          #
          # 形式はjsonにする。shell形式は特殊文字を含むパスをクォートで包むが、
          # そのクォートは非クォート展開では解釈されず、該当ファイルが「存在しないパス」
          # として黙ってスキップされる(= ビルドされないまま緑になる)ため使わない。
          list-files: json
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            dockerfile:
              - 'docker/**/Dockerfile*'

  frontend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Format
        run: pnpm run format

      - name: Run ESLint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Run coverage
        run: pnpm run coverage

      - name: Build for production
        run: pnpm run build

      - name: Upload frontend deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 90

      - name: Upload frontend test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-test-results
          path: |
            frontend/test-results/**
            frontend/coverage/**
          retention-days: 7

  e2e-smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: frontend/package.json

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build for production
        run: pnpm run build

      - name: Run E2E smoke tests
        run: pnpm exec playwright test

      - name: Upload E2E report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-smoke-report
          path: frontend/playwright-report/
          retention-days: 7

  backend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run backend checks
        run: ./gradlew check

      - name: Upload backend check results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-check-results
          path: |
            backend/build/reports/**
            backend/build/test-results/**
          retention-days: 7

  # Dockerfileの変更だけでは frontend-test / backend-test / e2e-smoke がどれも動かない。
  # ベースイメージの更新はDependabotによって自動マージされるため、このジョブが無いと
  # 本番イメージのベース更新が一度もビルドされないままmainに入る。
  #
  # 検証はamd64で行う。本番のデプロイ先はarm64だが、書いてあるのはmanifest listの
  # digestであり、arm64のmanifestが存在することは固定時に確認している。
  # ここで捉えるのは、Dockerfileの記述の破綻とベースイメージの中身の変化。
  # arm64に固有の破綻は release.yaml のビルドで検知する。
  docker-smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.dockerfile_changed == 'true'
    runs-on: ubuntu-latest
    # 既定の360分は、配布元が応答しなくなったときに6時間握り続けることを意味する。
    # auto-mergeの待ち時間に直結するため明示する。全Dockerfileを一括変更するPRでも
    # 逐次ビルドの合計が収まる値にする(Dockerfile.prodのGradleビルドが最長で10分強)。
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build changed Dockerfiles
        env:
          DOCKERFILES: ${{ needs.detect-changes.outputs.dockerfile_files }}
        run: |
          set -euo pipefail

          # ガードは jq -e で行う。出力が空文字列・空配列・JSONとして不正の
          # いずれの場合も非ゼロ終了になり、ここで確実に赤にする。
          # ("$(jq 'length' ...)" を [ -eq 0 ] にかける形は、空入力でjqが
          #  出力なしのexit 0となり、ifの条件部のエラーはset -eでも止まらないため、
          #  ガードを素通りして「何もビルドしないまま緑」になる)
          if ! jq -e 'type == "array" and length > 0' >/dev/null <<<"$DOCKERFILES"; then
            echo "::error::変更されたDockerfileを特定できませんでした。"
            exit 1
          fi

          while IFS= read -r f; do
            if [ ! -f "$f" ]; then
              echo "削除されたためスキップします: $f"
              continue
            fi

            # ビルドコンテキストは compose.yaml と backend-deploy.yaml の指定に合わせる。
            # 食い違うと、ここが通ってもデプロイ時のビルドが落ちる。
            case "$f" in
              docker/backend/Dockerfile.prod) context="./backend" ;;
              *) context="." ;;
            esac

            echo "::group::docker build -f $f $context"
            docker build --file "$f" "$context"
            echo "::endgroup::"
          done < <(jq -r '.[]' <<<"$DOCKERFILES")
