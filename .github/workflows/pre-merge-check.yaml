name: Pre-merge Check

# マージ前の人間確認(選択式)。
#
# 人間がIssueに pre-merge-check ラベルを付けると、/ship が作るPRへ引き継がれる
# (PRに直接付けてもよい)。ラベル付きPRは、リポジトリ所有者のApproveがあるまで
# このチェックが赤になり、マージが保留される(required check に指定する)。
# 用途: マージ前にローカルで画面を確認したい変更。確認して問題があれば
# PRコメントで差し戻す(Issueの再起票はしない)。
#
# 判定は dependency-gate と同方式: 所有者アカウント名で照合し、bot・第三者の
# Approveは無効。承認後にコミットが積まれると承認は自動で無効になり(Dismiss stale
# approvals)、このチェックも再び赤に戻る。

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
  # マージ列でも必須チェックとして結果を報告する。判定はPR段階で確定するため
  # ここでは実行せず、スキップ(=成功)を同名で報告する
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  # merge_group には pull_request.number が無い。フォールバックが無いとキューの各項目が
  # 同一グループになり、後から入った項目が先行する項目をキャンセルする
  group: pre-merge-check-${{ github.event.pull_request.number || github.run_id }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pre-merge-check:
    name: pre-merge-check
    runs-on: ubuntu-latest
    # ラベルと所有者の承認状態はPR単位の概念で、マージ列では同じ判定にならない。
    # PR段階で確定した結果を引き継ぐ(スキップ=成功)。
    # pull_request_review での発火は残す。承認の取り消しを赤へ戻す唯一の経路のため
    if: github.event_name != 'merge_group'
    steps:
      - name: Evaluate pre-merge-check label and owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER_LOGIN: ${{ github.repository_owner }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # ラベルはイベントペイロードではなくAPIから取得する(古い情報を見ない)
          has_label=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" \
            --jq '[.[].name] | contains(["pre-merge-check"])')

          if [ "$has_label" != "true" ]; then
            echo "pre-merge-check ラベルなし。確認は不要のため通過します。"
            exit 0
          fi

          # --paginate には --slurp を併用する(ページ単位でjqが適用され判定を誤るため)。
          # gh の --jq は --slurp と併用できない仕様のため、jq へパイプして評価する。
          # commit_id で現在のhead SHAに対するレビューだけに絞る(承認後にコミットを積んで
          # ゲートを迂回されないようにする。ブランチ保護のDismiss stale approvals頼みにしない)。
          verdict=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --slurp \
            | jq -r --arg owner "$OWNER_LOGIN" --arg head "$HEAD_SHA" '[.[][] | select(.user.login == $owner) | select(.commit_id == $head) | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")] | sort_by(.submitted_at) | last | .state // "NONE"')
          echo "Owner review verdict: $verdict"

          if [ "$verdict" = "APPROVED" ]; then
            echo "pre-merge-check ラベル付きPRですが、リポジトリ所有者のApprove済みのため通過します。"
            exit 0
          fi

          echo "::error::このPRには pre-merge-check ラベルが付いています。所有者がローカルで確認してApproveするまでマージは保留されます(問題があればPRコメントで差し戻してください)。"
          exit 1
