name: Backend Deploy

on:
  workflow_call:
    inputs:
      ecr_repository_url:
        description: 'ECR repository URL'
        required: false
        type: string
      ecs_cluster_name:
        description: 'ECS cluster name'
        required: false
        type: string
      ecs_service_name:
        description: 'ECS service name'
        required: false
        type: string
      # 出荷する版(current、java、go のどれか)。release.yaml の入力 backend_impl を受け取る。
      backend_impl:
        description: 'Backend implementation to deploy (current, java, or go)'
        required: false
        type: string
        default: current

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: keirekipro-backend
  ECS_CLUSTER: keirekipro-cluster
  ECS_SERVICE: keirekipro-backend-service
  ECS_TASK_DEFINITION_FAMILY: keirekipro-backend-task
  CONTAINER_NAME: keirekipro-backend

jobs:
  deploy:
    # ECS は arm64 の CPU で動くため、イメージも arm64 の CPU の機械で作る。
    # x86_64 の機械で arm64 の CPU をまねて作ると、Gradle の組み立てが
    # 十数分かかる(#749)。container-scan も同じ機械で同じ Dockerfile から作っている。
    runs-on: ubuntu-24.04-arm
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/keirekipro-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set variables
        id: vars
        run: |
          if [ -n "${{ inputs.ecr_repository_url }}" ]; then
            {
              echo "ecr_repository_url=${{ inputs.ecr_repository_url }}"
              echo "ecs_cluster_name=${{ inputs.ecs_cluster_name }}"
              echo "ecs_service_name=${{ inputs.ecs_service_name }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "ecr_repository_url=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
              echo "ecs_cluster_name=${{ env.ECS_CLUSTER }}"
              echo "ecs_service_name=${{ env.ECS_SERVICE }}"
            } >> "$GITHUB_OUTPUT"
          fi

      # サービスが今動かしているタスク定義を読み、出荷する版と、Dockerfile と、
      # 組み立ての文脈と、イメージのタグを決める。current のときは、今のイメージのタグが
      # go- で始まれば Go 版、そうでなければ Java 版になる。決めた版はワークフローの要約に書く。
      # ファミリーの最新のリビジョンは読まない。terraform はタスク定義を変えるたびに
      # イメージを :placeholder にしたリビジョンを登録し、サービスは前のリビジョンのまま動くため、
      # 最新のリビジョンのタグでは、Go 版で動いている本番を Java 版と取り違える。
      # 版を決められないときは、イメージを組み立てる前にここで止まり、本番は今の版のまま動く。
      - name: Decide backend implementation
        id: impl
        env:
          BACKEND_IMPL: ${{ inputs.backend_impl }}
          GIT_SHA: ${{ github.sha }}
          ECS_CLUSTER_NAME: ${{ steps.vars.outputs.ecs_cluster_name }}
          ECS_SERVICE_NAME: ${{ steps.vars.outputs.ecs_service_name }}
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME" \
            --query 'services[0].taskDefinition' \
            --output text)
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            --output json > current-task-definition.json
          CURRENT_IMAGE=$(jq -r --arg CONTAINER "$CONTAINER_NAME" \
            '.containerDefinitions[] | select(.name == $CONTAINER) | .image' \
            current-task-definition.json)
          export CURRENT_IMAGE
          bash .github/scripts/backend-deploy-impl.sh
          {
            echo "### Backend の出荷の版"
            echo ""
            echo "- 入力 backend_impl: \`${BACKEND_IMPL}\`"
            echo "- サービスが動かしているタスク定義: \`${TASK_DEF_ARN}\`"
            echo "- そのイメージ: \`${CURRENT_IMAGE}\`"
            echo "- 出荷する版: \`$(sed -n 's/^impl=//p' "$GITHUB_OUTPUT" | tail -n 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub のキャッシュは読みも書きもしない(#749)。書き出しに1分半ほどかかるうえ、
      # キャッシュが当たると Dockerfile.prod の apt-get upgrade が飛ばされ、
      # ビルドのたびに OS の部品の修正版を取り込む意図(#453)が崩れるため。
      # 組み立ての引数 VERSION には、イメージのタグと同じコミットの SHA を渡す。
      # どちらの版の Dockerfile.prod も、VERSION をログの service.version に書く版にする。
      # 渡さないと、ログの版の欄が Go 版では dev、Java 版では unknown になり、
      # 本番のログがどのコミットのものかを見分けられない(#954)。
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.impl.outputs.context }}
          file: ${{ steps.impl.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.vars.outputs.ecr_repository_url }}:${{ steps.impl.outputs.image_tag }}
          build-args: |
            VERSION=${{ github.sha }}
          platforms: linux/arm64
          provenance: false

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --query 'taskDefinition' \
            --output json > task-definition.json

          # 不要なフィールドを削除（新しいタスク定義登録時に必要）
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-definition.json > cleaned-task-definition.json
          mv cleaned-task-definition.json task-definition.json

      - name: Update task definition with new image
        run: |
          NEW_IMAGE="${{ steps.vars.outputs.ecr_repository_url }}:${{ steps.impl.outputs.image_tag }}"

          jq --arg IMAGE "$NEW_IMAGE" --arg CONTAINER "${{ env.CONTAINER_NAME }}" \
            '.containerDefinitions = [.containerDefinitions[] | if .name == $CONTAINER then .image = $IMAGE else . end]' \
            task-definition.json > new-task-definition.json

          mv new-task-definition.json task-definition.json

      - name: Register new task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_definition_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service desired count to 1 (if needed)
        run: |
          CURRENT_COUNT=$(aws ecs describe-services \
            --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
            --services ${{ steps.vars.outputs.ecs_service_name }} \
            --query 'services[0].desiredCount' \
            --output text)

          if [ "$CURRENT_COUNT" -eq "0" ]; then
            echo "Updating desired count from 0 to 1..."
            aws ecs update-service \
              --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
              --service ${{ steps.vars.outputs.ecs_service_name }} \
              --desired-count 1
          fi

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
            --service ${{ steps.vars.outputs.ecs_service_name }} \
            --task-definition ${{ steps.register-task-def.outputs.task_definition_arn }} \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
            --services ${{ steps.vars.outputs.ecs_service_name }}
          echo "ECS service is now stable."

      - name: Verify deployment
        run: |
          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
            --services ${{ steps.vars.outputs.ecs_service_name }} \
            --query 'services[0].runningCount' \
            --output text)

          DESIRED_COUNT=$(aws ecs describe-services \
            --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
            --services ${{ steps.vars.outputs.ecs_service_name }} \
            --query 'services[0].desiredCount' \
            --output text)

          echo "Running tasks: $RUNNING_COUNT / Desired tasks: $DESIRED_COUNT"

          if [ "$RUNNING_COUNT" -ne "$DESIRED_COUNT" ]; then
            echo "Deployment verification failed!"
            exit 1
          fi

          echo "Deployment completed successfully!"
