name: Backend Deploy

on:
  workflow_call:
    inputs:
      ecr_repository_url:
        description: 'ECR repository URL'
        required: false
        type: string
      ecs_cluster_name:
        description: 'ECS cluster name'
        required: false
        type: string
      ecs_service_name:
        description: 'ECS service name'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: keirekipro-backend
  ECS_CLUSTER: keirekipro-cluster
  ECS_SERVICE: keirekipro-backend-service
  ECS_TASK_DEFINITION_FAMILY: keirekipro-backend-task
  CONTAINER_NAME: keirekipro-backend

jobs:
  deploy:
    # ECS は arm64 の CPU で動くため、イメージも arm64 の CPU の機械で作る。
    # x86_64 の機械で arm64 の CPU をまねて作ると、Gradle の組み立てが
    # 十数分かかる(#749)。container-scan も同じ機械で同じ Dockerfile から作っている。
    runs-on: ubuntu-24.04-arm
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/keirekipro-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set variables
        id: vars
        run: |
          if [ -n "${{ inputs.ecr_repository_url }}" ]; then
            {
              echo "ecr_repository_url=${{ inputs.ecr_repository_url }}"
              echo "ecs_cluster_name=${{ inputs.ecs_cluster_name }}"
              echo "ecs_service_name=${{ inputs.ecs_service_name }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "ecr_repository_url=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
              echo "ecs_cluster_name=${{ env.ECS_CLUSTER }}"
              echo "ecs_service_name=${{ env.ECS_SERVICE }}"
            } >> "$GITHUB_OUTPUT"
          fi

      # GitHub のキャッシュは読みも書きもしない(#749)。書き出しに1分半ほどかかるうえ、
      # キャッシュが当たると Dockerfile.prod の apt-get upgrade が飛ばされ、
      # ビルドのたびに OS の部品の修正版を取り込む意図(#453)が崩れるため。
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./docker/backend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.vars.outputs.ecr_repository_url }}:${{ github.sha }}
          platforms: linux/arm64
          provenance: false

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --query 'taskDefinition' \
            --output json > task-definition.json

          # 不要なフィールドを削除（新しいタスク定義登録時に必要）
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-definition.json > cleaned-task-definition.json
          mv cleaned-task-definition.json task-definition.json

      - name: Update task definition with new image
        run: |
          NEW_IMAGE="${{ steps.vars.outputs.ecr_repository_url }}:${{ github.sha }}"

          jq --arg IMAGE "$NEW_IMAGE" --arg CONTAINER "${{ env.CONTAINER_NAME }}" \
            '.containerDefinitions = [.containerDefinitions[] | if .name == $CONTAINER then .image = $IMAGE else . end]' \
            task-definition.json > new-task-definition.json

          mv new-task-definition.json task-definition.json

      - name: Register new task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_definition_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service desired count to 1 (if needed)
        run: |
          CURRENT_COUNT=$(aws ecs describe-services \
            --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
            --services ${{ steps.vars.outputs.ecs_service_name }} \
            --query 'services[0].desiredCount' \
            --output text)

          if [ "$CURRENT_COUNT" -eq "0" ]; then
            echo "Updating desired count from 0 to 1..."
            aws ecs update-service \
              --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
              --service ${{ steps.vars.outputs.ecs_service_name }} \
              --desired-count 1
          fi

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
            --service ${{ steps.vars.outputs.ecs_service_name }} \
            --task-definition ${{ steps.register-task-def.outputs.task_definition_arn }} \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
            --services ${{ steps.vars.outputs.ecs_service_name }}
          echo "ECS service is now stable."

      - name: Verify deployment
        run: |
          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
            --services ${{ steps.vars.outputs.ecs_service_name }} \
            --query 'services[0].runningCount' \
            --output text)

          DESIRED_COUNT=$(aws ecs describe-services \
            --cluster ${{ steps.vars.outputs.ecs_cluster_name }} \
            --services ${{ steps.vars.outputs.ecs_service_name }} \
            --query 'services[0].desiredCount' \
            --output text)

          echo "Running tasks: $RUNNING_COUNT / Desired tasks: $DESIRED_COUNT"

          if [ "$RUNNING_COUNT" -ne "$DESIRED_COUNT" ]; then
            echo "Deployment verification failed!"
            exit 1
          fi

          echo "Deployment completed successfully!"
