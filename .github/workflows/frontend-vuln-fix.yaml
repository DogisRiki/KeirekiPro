name: Frontend Transitive Vulnerability Fix

# Dependabot が PR を作らない frontend の間接依存の警告について、警告が消える版に上げる PR を作る。
# 動きの全文は .github/scripts/frontend-vuln-fix.sh の先頭のコメントにある。
# Actions には警告が出たときのイベントが無いので、毎日決まった時刻に警告を読みに行く。
# 警告を読むのと PR を作るのは bot の PAT(BOT_GITHUB_TOKEN)で行う。GITHUB_TOKEN が作った PR では
# CI が動かず(canary.yaml と同じ理由)、GITHUB_TOKEN の vulnerability-alerts は actionlint が知らない。

on:
  schedule:
    - cron: '43 0 * * *' # 毎日 09:43 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-vuln-fix
  cancel-in-progress: false

jobs:
  frontend-vuln-fix:
    runs-on: ubuntu-latest
    # PR を作る組ごとに、ci.yaml の frontend-test と同じ検査(テストと組み立てを含む)を流すので長めにとる
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test script # 壊れたスクリプトで PR を作らない
        run: bash .github/scripts/tests/test-frontend-vuln-fix.sh
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      # Node.js は配布元の署名を確かめてから入れる(.github/actions/verified-node)
      - uses: ./.github/actions/verified-node
        with:
          node-version: '24.22.2'
      - name: Create pull requests
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: bash .github/scripts/frontend-vuln-fix.sh run
