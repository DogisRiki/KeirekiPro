name: Audit Weekly

# 週次監査(#310 段階1): 人間が画面を開いて行っていた定期監査のうち、
# 機械判定できる3項目を自動判定に置き換える。
#
#   scan-freshness   定期スキャン(container-scan-scheduled.yaml)の直近成功が
#                    8日未満かを確認する(旧・週次8)
#   dependabot-stuck 必須チェックの失敗で止まっているDependabot PRを検知する
#                    (旧・週次6)
#   skipped-required 期待一覧とrulesetの集合照合と、必須チェックがスキップの
#                    ままマージされたPRの検知(新規)
#
# 判定・通知・結論の3段で動く(#347):
#   - 判定: 各判定スクリプトの終了コードを 0=逸脱なし / 1=逸脱あり /
#     それ以外(2を含む)=判定不能 と読む。1つでも判定不能があれば全体を
#     判定不能、そうでなく逸脱ありがあれば全体を逸脱ありとする
#   - 通知: 結果を audit-issue.sh が監査通知Issue(週次監査: 逸脱あり /
#     週次監査: 判定不能)に反映する。起票・追記・解消時のクローズを行い、
#     所有者を担当者に割り当てる
#   - 結論: 逸脱なし・逸脱ありで、かつ通知が成功したときだけ成功で終わる。
#     逸脱ありを赤にしないのは、PRのCIの死活確認(ci.yaml の audit-liveness)
#     と行き詰まらないため。逸脱の内容はIssueで届く
#
# なぜIssueで通知するか:
#   定期実行(schedule)の失敗通知は、cronの記述を最後に書き換えた利用者にしか
#   届かない(https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows)。
#   このワークフローを書いたのはbotのため、赤で終わっても所有者には届いて
#   いなかった(#347)。Issueの担当者への割り当てとメンションで所有者に届ける。
#
# なぜこの設計か(#310 の要点。#347 で書き込みの範囲を改めた):
#   - 書き込みはIssueの起票・追記・クローズと担当者の割り当てに限る。修正PRの
#     自動作成・Dependabotへの操作・リポジトリ内容への書き込みは行わない
#     (監査が直す対象はゲート自身であり、自己検査の循環を作らないため)
#   - AI呼び出し0回・GitHub以外の外部サービスへの問い合わせなし・履歴保存なし
#   - このワークフロー自体が止まったことの検知(死活)はci.yaml側の
#     audit-liveness ステップが担う。監査を監視する専用の仕組みは作らない
#
# 判定不能・通知失敗の赤は、失敗したrunのre-run(同じrunの再実行)で
# 再判定する。新規のworkflow_dispatchで流し直すと、skipped-required の
# 対象期間の下限が「失敗したrunの時刻」になり、未走査の穴が恒久的に残る。
#
# 判定の基準と報告の文面は判定スクリプト側、Issueの操作と本文は
# audit-issue.sh 側が持つ。ここは実行編成と集約のみ。

on:
  schedule:
    # 毎週月曜 00:17 UTC(09:17 JST)。skipped-required の対象期間は
    # 「前回実行以降」のため、週1回の定期実行で走査の窓が連続する。
    - cron: '17 0 * * 1'
  # 手動検証用。判定不能の赤の再実行には使わない(上記のとおりre-runを使う)
  workflow_dispatch:

# 判定はread系のみ。書き込みは通知のための issues: write だけを加える
# (contents・pull-requests への書き込みは持たない)。secrets は使わない。
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  issues: write

concurrency:
  # 同時に走ると skipped-required の「前回実行以降」の窓の解釈が交錯するため、
  # 走行中は後発を待たせる。cancel-in-progress を true にすると cancelled の
  # 実行が履歴に残り、赤でも緑でもない結論ができる。
  group: audit-weekly
  cancel-in-progress: false

jobs:
  audit-weekly:
    # ジョブ名は死活ステップ(ci.yaml の audit-liveness)がAPIで実行履歴を
    # 引くときの識別に使う。実行履歴はワークフローファイル名
    # (audit-weekly.yaml)で引くため、ファイル名の変更は死活側の追随が必要。
    name: audit-weekly
    runs-on: ubuntu-latest
    # 判定はAPIの読み取りとjqの集計だけ。既定の360分を握らせないために明示する
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 期待一覧の paused 一覧は判定結果にかかわらず常時Job Summaryへ出す。
      # 記録された停止はここに現れ続け、記録の無い停止は判定で現れる
      # (記録の有無で意図的な停止と事故を見分ける)。判定より前に出すのは、
      # 後続のどのステップが失敗しても一覧が欠けないようにするため。
      # 期待一覧を解釈できない場合もここでは止めない(スキーマ検証は
      # skipped-required の判定が持ち、判定不能として報告する)。
      - name: Report paused checks
        run: |
          set -uo pipefail
          {
            echo "### 停止中と記録されている必須チェック(期待一覧)"
            echo ""
            if paused=$(jq -er '[.checks[] | select(.state == "paused")
                | "- \(.context)(理由: \(.reason) / 参照: #\(.issue))"] | join("\n")' \
                .github/audit/required-checks.json 2>/dev/null); then
              if [ -n "$paused" ]; then
                printf '%s\n' "$paused"
              else
                echo "- なし"
              fi
            else
              echo "- 期待一覧を解釈できませんでした(skipped-required の判定が判定不能として報告します)"
            fi
            echo ""
          } >>"$GITHUB_STEP_SUMMARY"

      # 判定。自己テスト → 本判定3本 → 集約 の順に行い、結果をステップ出力
      # result(none / deviation / undecidable)に書く。このステップ自体は
      # 常に成功で終わり(set +e で途中の失敗でも止めない)、成否は Conclude が
      # 決める。
      #
      # 自己テストを先に置く。壊れた判定スクリプトの結論(緑も赤も)を信用せず、
      # 1本でも失敗したら本判定を行わずに判定不能とする(dependency-review.yaml
      # の cooldown ジョブと同じ、自テスト後に本判定の型)。3本は途中で失敗しても
      # 全部実行する(container-scan-scheduled.yaml のテスト集約と同じ方式)。
      #
      # 本判定は1本目が逸脱・判定不能でも残りを実行する。途中で止めると、
      # 最初の結果の陰に残りの逸脱が隠れて翌週まで見えなくなる。各スクリプトの
      # 報告は GITHUB_STEP_SUMMARY を一時ファイルへ向けて受け、本来の
      # Job Summary と報告ファイル(Issue本文に載せる)の両方へ写す。
      # 報告ファイルへの書き込みに失敗したら、Issueで内容を伝えられないため
      # 判定不能に倒す。
      #
      # 各スクリプトは GITHUB_REPOSITORY / GITHUB_RUN_ID(ランナーの既定環境変数)
      # と GH_TOKEN を前提とする。secrets は使わない(github.token のみ)。
      # スクリプトには実行ビットが無い(core.fileMode=false で 100644 として
      # 記録される)。直接起動すると exit 126 になるため bash 経由で起動する。
      - name: Judge
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -uo pipefail
          report="${RUNNER_TEMP}/audit-report.md"
          overall=none

          # 報告ファイルが作れないと、通知で内容を伝えられない
          if ! : >"$report"; then
            echo "::error::報告ファイルを作成できませんでした: ${report}"
            overall=undecidable
          fi

          # 報告を Job Summary と報告ファイルの両方へ追記する
          emit() {
            printf '%s\n' "$1" >>"$GITHUB_STEP_SUMMARY"
            if ! printf '%s\n' "$1" >>"$report"; then
              echo "::error::報告ファイルへの書き込みに失敗しました: ${report}"
              overall=undecidable
            fi
          }

          # run_check <項目名> <見出し> <スクリプト> [引数...]
          run_check() {
            local name="$1" title="$2" part rc
            shift 2
            part="${RUNNER_TEMP}/audit-summary-${name}.md"
            : >"$part"
            echo "::group::${name}(${title})"
            GITHUB_STEP_SUMMARY="$part" bash "$@"
            rc=$?
            echo "::endgroup::"
            if ! cat "$part" >>"$GITHUB_STEP_SUMMARY"; then
              echo "::warning::${name} の報告を Job Summary に写せませんでした。"
            fi
            if ! cat "$part" >>"$report"; then
              echo "::error::${name} の報告を報告ファイルに写せませんでした。"
              overall=undecidable
            fi
            case "$rc" in
              0)
                echo "${name}: 逸脱なし"
                ;;
              1)
                echo "${name}: 逸脱あり"
                if [ "$overall" = none ]; then
                  overall=deviation
                fi
                ;;
              2)
                echo "${name}: 判定不能"
                overall=undecidable
                ;;
              *)
                # 契約外の終了コードでは判定スクリプトの報告が無いことがあるため、
                # 理由をここで補う
                echo "::error::${name} が想定外の終了コード ${rc} で終了しました。"
                emit ""
                emit "- ${name}: 判定スクリプトが想定外の終了コード ${rc} で終了したため、判定不能として扱います。"
                overall=undecidable
                ;;
            esac
          }

          selftest_failed=0
          for t in test-check-audit-scan-freshness test-check-audit-dependabot-stuck test-check-audit-skipped-required; do
            echo "::group::${t}.sh"
            if ! bash ".github/scripts/tests/${t}.sh"; then
              echo "::error::${t}.sh が失敗しました。"
              selftest_failed=1
            fi
            echo "::endgroup::"
          done

          if [ "$selftest_failed" -ne 0 ]; then
            emit "### 判定スクリプトの自己テストの失敗"
            emit ""
            emit "判定スクリプトのテストに失敗したため、本判定を実行しませんでした(判定不能)。失敗したテストは実行ログの Judge ステップで確認できます。"
            overall=undecidable
          else
            run_check scan-freshness "定期スキャンの稼働確認" \
              .github/scripts/check-audit-scan-freshness.sh container-scan-scheduled.yaml 8
            run_check dependabot-stuck "Dependabot PRの滞留検知" \
              .github/scripts/check-audit-dependabot-stuck.sh .github/audit/required-checks.json
            run_check skipped-required "必須チェックの集合照合とスキップ検知" \
              .github/scripts/check-audit-skipped-required.sh .github/audit/required-checks.json
          fi

          echo "週次監査の結果: ${overall}"
          # 書けなければ result は空になり、Notify と Conclude が判定不能として扱う
          if ! echo "result=${overall}" >>"$GITHUB_OUTPUT"; then
            echo "::error::判定結果をステップ出力に書けませんでした。判定不能として扱われます。"
          fi
          exit 0

      # 通知スクリプトのテスト。判定の後に置くのは、ここが落ちても判定結果を
      # Job Summary に残すため。失敗したら通知せず、Conclude で赤になる。
      - name: Test notifier
        id: test-notifier
        if: always()
        run: bash .github/scripts/tests/test-audit-issue.sh

      # 結果を監査通知Issueに反映する。結果は env 経由で渡し、式を run: に
      # 直接埋め込まない。結果が空(Judge が想定外に終了した)なら判定不能として
      # 通知する。audit-issue.sh が失敗したらこのステップも失敗する。
      - name: Notify
        id: notify
        if: always() && steps.test-notifier.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.judge.outputs.result }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/audit-report.md"
          result="${RESULT:-}"
          if [ -z "$result" ]; then
            echo "::warning::判定ステップが結果を出力しませんでした。判定不能として通知します。"
            result=undecidable
            {
              echo ""
              echo "- 判定ステップが結果を出力せずに終了しました(判定不能)。実行ログの Judge ステップを確認してください。"
            } >>"$report"
          fi
          bash .github/scripts/audit-issue.sh weekly "$result" "$report"

      # 実行の結論。逸脱なし・逸脱ありで、かつ通知が成功したときだけ成功する。
      # 判定不能と通知の失敗は赤で終わらせる(再判定は re-run で行う)。
      - name: Conclude
        if: always()
        env:
          RESULT: ${{ steps.judge.outputs.result }}
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
        run: |
          set -uo pipefail
          failed=0
          case "${RESULT:-}" in
            none)
              echo "週次監査: 逸脱なし"
              ;;
            deviation)
              echo "::notice::週次監査で逸脱を検知しました。内容はIssue「週次監査: 逸脱あり」と Job Summary を確認してください。"
              ;;
            undecidable)
              echo "::error::週次監査は判定不能でした。理由はIssue「週次監査: 判定不能」と Job Summary を確認し、この実行を Re-run で再実行してください(新規の手動実行は使わない)。"
              failed=1
              ;;
            *)
              echo "::error::判定ステップが結果を出力しませんでした(判定不能)。実行ログの Judge ステップを確認し、この実行を Re-run で再実行してください(新規の手動実行は使わない)。"
              failed=1
              ;;
          esac
          if [ "${NOTIFY_OUTCOME:-}" != success ]; then
            echo "::error::監査通知Issueへの反映が成功しませんでした(Notify: ${NOTIFY_OUTCOME:-未実行})。Issueは更新されていないか、途中までしか更新されていません。判定の結果は Job Summary を、原因は実行ログの Test notifier / Notify ステップを確認し、この実行を Re-run で再実行してください。"
            failed=1
          fi
          exit "$failed"
