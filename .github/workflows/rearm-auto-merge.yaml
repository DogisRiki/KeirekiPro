# =====================================================================
# ルール違反で外れた auto-merge の予約をかけ直す
#
# 所有者の承認後、rerun-approval-gated-checks.yaml が承認前に失敗したゲートの
# 実行をやり直した直後に、GitHub が auto-merge の予約を外すことがある。
# 記録上の理由は「Repository rule violations found」(reasonCode:
# repository_rule_violation)で、外れたまま誰かが予約し直すまでPRが止まる
# (#348 #371 #379 #437 で発生。#440)。
#
# 予約が外れたイベントを起点に、理由がルール違反のときだけ予約し直す。
# 所有者が手で外した場合など、ほかの理由では何もしない。
#
# GITHUB_TOKEN ではなくPATで予約する。GITHUB_TOKEN で予約した auto-merge の
# マージpushは後続のワークフローを起動せず、依存グラフのスナップショットが
# 欠けて以降のPRが赤になる(#326)。
# =====================================================================
name: Rearm Auto Merge

on:
  pull_request:
    types: [auto_merge_disabled]

# GITHUB_TOKEN には何も与えない。照会と予約は BOT_GITHUB_TOKEN で行う
permissions: {}

jobs:
  rearm:
    name: rearm-auto-merge
    # fork のPRではシークレットを使えないため同一リポジトリのPRに限る。
    # Dependabot のPRは dependabot-auto-merge.yaml が予約の時期を決めているため除く
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    concurrency:
      group: rearm-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # checkout しない。APIを呼ぶだけで、PRのコードを一切実行しない
      - name: Rearm auto-merge after a rule violation
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # イベントの内容ではなく、その時点のPRの状態を照会して判断する。
          # 予約が外れたイベントは、最後のコミット以降のものだけを数える
          # (コミットのたびに承認し直すため、コミットごとに1回は起こりうる)。
          # shellcheck disable=SC2016
          query='query($owner:String!,$name:String!,$number:Int!){
            repository(owner:$owner,name:$name){
              pullRequest(number:$number){
                state isDraft headRefOid autoMergeRequest{enabledAt}
                timelineItems(last:100,itemTypes:[PULL_REQUEST_COMMIT,AUTO_MERGE_DISABLED_EVENT]){
                  nodes{__typename ... on AutoMergeDisabledEvent{reasonCode}}
                }
              }
            }
          }'
          pr=$(gh api graphql -f query="$query" -F owner="$OWNER" -F name="$NAME" -F number="$NUMBER" \
            | jq '.data.repository.pullRequest')

          state=$(jq -r '.state' <<<"$pr")
          draft=$(jq -r '.isDraft' <<<"$pr")
          armed=$(jq -r '.autoMergeRequest != null' <<<"$pr")
          head=$(jq -r '.headRefOid' <<<"$pr")
          events=$(jq '.timelineItems.nodes
            | (map(.__typename) | rindex("PullRequestCommit") // -1) as $i
            | .[($i + 1):]
            | map(select(.__typename == "AutoMergeDisabledEvent"))' <<<"$pr")
          reason=$(jq -r 'last.reasonCode // ""' <<<"$events")
          count=$(jq 'map(select(.reasonCode == "repository_rule_violation")) | length' <<<"$events")

          echo "state=${state} draft=${draft} armed=${armed} reason=${reason} count=${count}"

          if [ "$state" != "OPEN" ] || [ "$draft" = "true" ] || [ "$armed" = "true" ]; then
            echo "予約し直す必要はありません。"
            exit 0
          fi

          if [ "$reason" != "repository_rule_violation" ]; then
            echo "ルール違反以外の理由で外れたため、予約し直しません。"
            exit 0
          fi

          # 同じコミットで何度も外れるときは、一時的な食い違いではなく本当に
          # ルールを満たしていない。予約し直しを繰り返さず、赤にして知らせる
          if [ "$count" -gt 3 ]; then
            echo "::error::同じコミットで予約が ${count} 回外れました。予約し直さずに止めます。PRの状態を確かめてください。"
            exit 1
          fi

          # 照会した後にコミットが積まれていたら、そのコミットでは予約しない。
          # push で承認は取り消されるため、再承認のあとの流れに任せる。
          # PRがすでにマージできる状態なら、gh は予約せずその場でマージする
          # (bot に ruleset の迂回権限は無いため、ゲートを飛ばすことにはならない)
          if gh pr merge --auto --squash --match-head-commit "$head" "$NUMBER" --repo "${OWNER}/${NAME}"; then
            echo "auto-merge を予約し直しました: #${NUMBER}"
            exit 0
          fi

          current=$(gh pr view "$NUMBER" --repo "${OWNER}/${NAME}" --json headRefOid --jq '.headRefOid')
          if [ "$current" != "$head" ]; then
            echo "新しいコミットが積まれたため、予約し直しを見送りました: #${NUMBER}"
            exit 0
          fi

          echo "::error::auto-merge の予約し直しに失敗しました: #${NUMBER}"
          exit 1
