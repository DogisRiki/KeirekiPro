name: Rerun Approval Gated Checks

# 所有者のApproveで結果が変わるチェック(escape-hatch / dependency-gate / pre-merge-check / dependency-cooldown)は、
# 承認前の pull_request イベントで一度失敗する。これは正しい動作だが、承認後に
# pull_request_review で成功の実行が生まれても、先の失敗した実行が残り続ける。
# 同一SHAに同名のチェックが複数あると、1つでも失敗していればマージがブロックされるため、
# 承認しても手動で再実行するまでマージできない。
#
# このワークフローは、承認時に失敗している対象ジョブだけを再実行して解消する。
# 判定ロジックには手を入れないため、承認前に赤になる挙動はそのまま維持される。
#
# 再実行するのは、PRの今の最新のコミットの実行だけにする。承認のあとに
# update-pr-branches が main を取り込むと、最新のコミットが変わる。古いコミットの実行を
# 再実行すると、再実行は元の実行と同じ同時実行の組(例: guardrails-<PR番号>-pull_request)に入り、
# 新しいコミットで動いている同じ組の実行を取り消してしまう(PR #808 で起きた)。
# 取り消された対象ジョブも再実行する。rerun-failed-jobs は取り消されたジョブも動かし直す
# (PR #808 で gh run rerun --failed が取り消された escape-hatch を動かし直したことで確かめた)。

on:
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  checks: read
  pull-requests: read

jobs:
  rerun:
    name: rerun
    # 所有者のApproveのみを対象にする。publicリポジトリのため第三者もApproveでき、
    # そのたびに再実行が走るのを避ける(結果は変わらず実行時間だけ消費するため)。
    # fork からのPRは対象外にする。fork PRでは GITHUB_TOKEN が読み取り専用になり
    # 再実行APIが403になるため、実行しても解消できない(手動での再実行が必要)
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    # concurrency はジョブに置く。ワークフローに置くと、所有者以外のレビュー提出でも
    # 同じグループの実行が作られ、進行中の再実行を取り消してしまう
    concurrency:
      group: rerun-approval-gated-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed approval-gated jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # PRの今の最新のコミットを読む。イベントの head.sha は承認したときのコミットで、
          # 待っている間に main の取り込みで変わることがあるため、使わない。
          current_head() {
            gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha'
          }

          # filter=all を指定する。既定は最新のチェックだけを返すため、
          # 承認後は成功したチェックだけが残り、解消すべき失敗を取りこぼす。
          # --paginate には --slurp を併用する(ページ単位でjqが適用され判定を誤るため)。
          # gh の --jq は --slurp と併用できない仕様のため、jq へパイプして評価する。
          fetch_targets() {
            gh api "repos/$REPO/commits/$1/check-runs?per_page=100&filter=all" \
              --paginate --slurp \
              | jq '[.[].check_runs[] | .name as $n | select(["escape-hatch","dependency-gate","pre-merge-check","dependency-cooldown"] | index($n))]'
          }

          # 承認がゲートの実行完了より先に届くことがある。実行中のまま検索すると
          # 失敗が見つからず、何もしないまま成功で終わってしまうため完了を待つ。
          # ジョブ単位の再実行はrunの完了を前提とするため、runが完了するまで待つ。
          # 待つたびに最新のコミットを読み直し、変わっていれば新しいコミットの実行の完了を待つ。
          head_sha=""
          for i in $(seq 1 60); do
            head_sha=$(current_head)
            pending=$(fetch_targets "$head_sha" | jq 'map(select(.status != "completed")) | length')
            [ "$pending" -eq 0 ] && break
            if [ "$i" -eq 60 ]; then
              echo "::error::対象ジョブが10分以内に完了しなかった。手動で再実行してください。"
              exit 1
            fi
            sleep 10
          done
          echo "最新のコミット: $head_sha"

          # 失敗しているか取り消された対象ジョブを含む run を、run単位で再実行する。
          # details_url は .../actions/runs/<runId>/job/<jobId> の形式。
          #
          # ジョブ単位の再実行(actions/jobs/<jobId>/rerun)は使わない。filter=all は
          # 過去の attempt の check-run も返すため、すでに再実行済みの run に属する
          # ジョブを指すと「現在の attempt のジョブしか再実行できない」で403になる。
          # run単位の rerun-failed-jobs は常に最新の attempt を対象にするため起きない。
          run_ids=$(fetch_targets "$head_sha" |
            jq -r 'map(select(.conclusion == "failure" or .conclusion == "cancelled") | .details_url) | .[]' |
            awk -F'/' '{ for (i = 1; i < NF; i++) if ($i == "runs") print $(i + 1) }' |
            sort -u)

          if [ -z "$run_ids" ]; then
            echo "再実行が必要な対象ジョブはありません。"
            exit 0
          fi

          failed=0

          for run_id in $run_ids; do
            # 再実行の直前に最新のコミットを読み直す。変わっていれば、残りの run は古いコミットの
            # 実行なので再実行しない。再実行すると新しいコミットの実行を取り消すためである。
            # 新しいコミットの実行は、承認を読んで動く。
            if [ "$(current_head)" != "$head_sha" ]; then
              echo "最新のコミットが変わったため、古いコミットの実行は再実行しません: run=$run_id"
              break
            fi
            echo "再実行: run=$run_id"
            if out=$(gh api -X POST "repos/$REPO/actions/runs/${run_id}/rerun-failed-jobs" 2>&1); then
              continue
            fi
            # 別の経路で既に解消している場合は失敗ジョブが無く、その旨のエラーになる。
            # 承認の反映という目的は達しているため赤にしない。
            case "$out" in
              *"failed jobs"* | *"failed_jobs"*)
                echo "すでに解消しています: run=$run_id"
                ;;
              *)
                echo "::warning::run=$run_id の再実行に失敗しました: ${out}"
                failed=$((failed + 1))
                ;;
            esac
          done

          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} 件の run で再実行に失敗しました。手動で再実行してください。"
            exit 1
          fi
