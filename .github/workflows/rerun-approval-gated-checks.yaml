name: Rerun Approval Gated Checks

# 所有者のApproveで結果が変わるチェック(escape-hatch / dependency-gate / pre-merge-check)は、
# 承認前の pull_request イベントで一度失敗する。これは正しい動作だが、承認後に
# pull_request_review で成功の実行が生まれても、先の失敗した実行が残り続ける。
# 同一SHAに同名のチェックが複数あると、1つでも失敗していればマージがブロックされるため、
# 承認しても手動で再実行するまでマージできない。
#
# このワークフローは、承認時に失敗している対象ジョブだけを再実行して解消する。
# 判定ロジックには手を入れないため、承認前に赤になる挙動はそのまま維持される。

on:
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  checks: read

jobs:
  rerun:
    name: rerun
    # 所有者のApproveのみを対象にする。publicリポジトリのため第三者もApproveでき、
    # そのたびに再実行が走るのを避ける(結果は変わらず実行時間だけ消費するため)。
    # fork からのPRは対象外にする。fork PRでは GITHUB_TOKEN が読み取り専用になり
    # 再実行APIが403になるため、実行しても解消できない(手動での再実行が必要)
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    # concurrency はジョブに置く。ワークフローに置くと、所有者以外のレビュー提出でも
    # 同じグループの実行が作られ、進行中の再実行を取り消してしまう
    concurrency:
      group: rerun-approval-gated-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed approval-gated jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # filter=all を指定する。既定は最新のチェックだけを返すため、
          # 承認後は成功したチェックだけが残り、解消すべき失敗を取りこぼす。
          # --paginate には --slurp を併用する(ページ単位でjqが適用され判定を誤るため)。
          # gh の --jq は --slurp と併用できない仕様のため、jq へパイプして評価する。
          fetch_targets() {
            gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100&filter=all" \
              --paginate --slurp \
              | jq '[.[].check_runs[] | .name as $n | select(["escape-hatch","dependency-gate","pre-merge-check"] | index($n))]'
          }

          # 承認がゲートの実行完了より先に届くことがある。実行中のまま検索すると
          # 失敗が見つからず、何もしないまま成功で終わってしまうため完了を待つ。
          # ジョブ単位の再実行はrunの完了を前提とするため、runが完了するまで待つ。
          for i in $(seq 1 60); do
            pending=$(fetch_targets | jq 'map(select(.status != "completed")) | length')
            [ "$pending" -eq 0 ] && break
            if [ "$i" -eq 60 ]; then
              echo "::error::対象ジョブが10分以内に完了しなかった。手動で再実行してください。"
              exit 1
            fi
            sleep 10
          done

          # 失敗している対象ジョブを含む run を、run単位で再実行する。
          # details_url は .../actions/runs/<runId>/job/<jobId> の形式。
          #
          # ジョブ単位の再実行(actions/jobs/<jobId>/rerun)は使わない。filter=all は
          # 過去の attempt の check-run も返すため、すでに再実行済みの run に属する
          # ジョブを指すと「現在の attempt のジョブしか再実行できない」で403になる。
          # run単位の rerun-failed-jobs は常に最新の attempt を対象にするため起きない。
          run_ids=$(fetch_targets |
            jq -r 'map(select(.conclusion == "failure") | .details_url) | .[]' |
            awk -F'/' '{ for (i = 1; i < NF; i++) if ($i == "runs") print $(i + 1) }' |
            sort -u)

          if [ -z "$run_ids" ]; then
            echo "再実行が必要な対象ジョブはありません。"
            exit 0
          fi

          failed=0

          for run_id in $run_ids; do
            echo "再実行: run=$run_id"
            if out=$(gh api -X POST "repos/$REPO/actions/runs/${run_id}/rerun-failed-jobs" 2>&1); then
              continue
            fi
            # 別の経路で既に解消している場合は失敗ジョブが無く、その旨のエラーになる。
            # 承認の反映という目的は達しているため赤にしない。
            case "$out" in
              *"failed jobs"* | *"failed_jobs"*)
                echo "すでに解消しています: run=$run_id"
                ;;
              *)
                echo "::warning::run=$run_id の再実行に失敗しました: ${out}"
                failed=$((failed + 1))
                ;;
            esac
          done

          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} 件の run で再実行に失敗しました。手動で再実行してください。"
            exit 1
          fi
