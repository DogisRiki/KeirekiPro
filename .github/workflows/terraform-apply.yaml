name: Terraform Apply

# インフラの本番反映は人間の手動実行でのみ行う(アプリのrelease.yamlと同じ方針)。
# mainへのマージだけではapplyされない。terraform/** のPRは terraform-plan.yaml が
# plan結果をコメントするので、それを確認してマージし、反映したいタイミングで
# このワークフローを実行する。

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: '1.9.0'

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    # production environment を経由させることで、Settings に登録した承認者の
    # 承認が済むまでジョブが開始しない。開始前に止まるため、AWS の認証情報は
    # まだ発行されていない。
    #
    # 手元の禁止設定(.claude/settings.json の deny)は Claude Code 側の仕組みで、
    # 打ち方によっては素通りしうる。こちらは GitHub 側で強制されるため、
    # 誰がどう起動しても承認を挟む。
    #
    # environment を指定すると OIDC の sub が
    # repo:OWNER/REPO:environment:production になり、ref は refs/heads/main の
    # まま残る。信頼ポリシーの DeployFromMainProductionEnvironment が
    # この組み合わせを許可しているため、ロール側の変更は要らない。
    environment: production
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/keirekipro-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      # マージからapply実行までの間にmainが進んでいた場合の確認用に、
      # apply直前の差分をログへ表示する。-out で保存したplanをそのまま適用することで、
      # 表示した差分と適用内容の厳密一致を保証する
      - name: Terraform Plan (差分の事前表示)
        run: |
          terraform plan -var-file=environments/prod/terraform.tfvars -no-color -out=tfplan \
            -var="jwt_secret=${{ secrets.TF_VAR_jwt_secret }}" \
            -var="google_oauth_client_id=${{ secrets.TF_VAR_google_oauth_client_id }}" \
            -var="google_oauth_client_secret=${{ secrets.TF_VAR_google_oauth_client_secret }}" \
            -var="github_oauth_client_id=${{ secrets.TF_VAR_github_oauth_client_id }}" \
            -var="github_oauth_client_secret=${{ secrets.TF_VAR_github_oauth_client_secret }}" \
            -var="alert_email_address=${{ secrets.TF_VAR_alert_email_address }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
