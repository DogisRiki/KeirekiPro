name: Terraform Apply

# インフラの本番反映は人間の手動実行でのみ行う(アプリのrelease.yamlと同じ方針)。
# mainへのマージだけではapplyされない。反映したいタイミングでこのワークフローを実行する。
# PRで動く terraform-plan.yaml は本番の状態を読まない検査だけを行う。本番の状態との
# 差分は、承認のあと、適用の直前にこのワークフローのログへ出す。
# 本番の秘密は production environment の secrets に置き、承認が通ったジョブにだけ渡る。
#
# 実行するときに「plan_only」にチェックを付けると、差分をログに出したところで止まり、
# 本番には適用しない。Terraform の版を上げたあとなど、適用の前に差分だけを見たいときに使う。
# terraform plan は本番の資源も状態ファイルも書き換えない。

on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'チェックを付けると、差分をログに出したところで止まり、本番には適用しない'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: '1.9.0'

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    # production environment を経由させることで、Settings に登録した承認者の
    # 承認が済むまでジョブが開始しない。開始前に止まるため、AWS の認証情報は
    # まだ発行されていない。
    #
    # 手元の禁止設定(.claude/settings.json の deny)は Claude Code 側の仕組みで、
    # こちらは GitHub 側で強制され、誰がどう起動しても承認を挟む。
    #
    # environment を指定すると OIDC の sub が
    # repo:OWNER/REPO:environment:production になり、ref は refs/heads/main の
    # まま残る。信頼ポリシーの DeployFromMainProductionEnvironment が
    # この組み合わせを許可しているため、ロール側の変更は要らない。
    environment: production
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/keirekipro-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      # Terraform は配布元の署名を確かめてから入れる(.github/actions/verified-terraform)。
      # 確かめられなければ、Terraform を使う前にジョブが失敗する
      - name: Setup Terraform
        uses: ./.github/actions/verified-terraform
        with:
          terraform-version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      # 本番の状態との差分を、apply直前にログへ表示する。-out で保存したplanをそのまま適用することで、
      # 表示した差分と適用内容の厳密一致を保証する
      - name: Terraform Plan (差分の事前表示)
        run: |
          terraform plan -var-file=environments/prod/terraform.tfvars -no-color -out=tfplan \
            -var="jwt_secret=${{ secrets.TF_VAR_jwt_secret }}" \
            -var="google_oauth_client_id=${{ secrets.TF_VAR_google_oauth_client_id }}" \
            -var="google_oauth_client_secret=${{ secrets.TF_VAR_google_oauth_client_secret }}" \
            -var="github_oauth_client_id=${{ secrets.TF_VAR_github_oauth_client_id }}" \
            -var="github_oauth_client_secret=${{ secrets.TF_VAR_github_oauth_client_secret }}" \
            -var="alert_email_address=${{ secrets.TF_VAR_alert_email_address }}"

      - name: Terraform Apply
        if: ${{ !inputs.plan_only }}
        run: terraform apply -auto-approve tfplan

      # plan_only で動かしたときは、適用していないことを実行の概要に書く
      - name: 適用しなかったことの記録
        if: ${{ inputs.plan_only }}
        run: |
          {
            echo "## 差分を出したところで止めました"
            echo ""
            echo "plan_only にチェックを付けて動かしたため、本番には適用していません。"
            echo "差分は「Terraform Plan (差分の事前表示)」の記録にあります。"
          } >> "$GITHUB_STEP_SUMMARY"
