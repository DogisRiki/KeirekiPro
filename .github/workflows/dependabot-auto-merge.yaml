name: Dependabot Auto Merge

# DependabotのPRにauto-mergeを予約する。予約後は、必須チェックがすべて緑になり
# 必要な承認が揃った時点でGitHubがマージ列へ投入し、マージ列での再検証を経てマージする。
#
# レーンごとに扱いを分けない。承認が要るレーンは既存のゲートがそのまま押さえるため。
# .github/ を変更する github-actions レーンは CODEOWNERS により所有者の承認まで、
# ゲート設定に触れるPRは dependency-gate により承認まで、それぞれ止まったままになる。
#
# 導入の主目的は docker レーンの滞留防止。digest固定運用では、PRをcloseすると
# 同じタグの更新が恒久的にブロックされ、開いたままのPRも定期ジョブでは更新されない。
# つまり滞留がそのままイメージの更新停止を意味する。
# https://github.com/dependabot/dependabot-core/issues/9024
# https://github.com/dependabot/dependabot-core/issues/7387
#
# merge_group トリガは足さない。このワークフローは必須ステータスチェックではなく、
# マージ列に対して報告する義務が無いため。
#
# 参照: https://docs.github.com/en/code-security/tutorials/secure-your-dependencies/automate-dependabot-with-actions

on:
  pull_request:
    types: [opened, reopened, synchronize]

# GITHUB_TOKEN には何も与えない。予約は BOT_GITHUB_TOKEN で行い、このワークフローは
# checkout もアクションの呼び出しもしないため GITHUB_TOKEN を使う経路が無い。
# 鍵が未登録だと GH_TOKEN は空文字になり、gh は空文字を未設定として扱って
# 環境変数 GITHUB_TOKEN へフォールバックする(go-gh の tokenForHost)。ただし
# GITHUB_TOKEN は env で明示的に渡さない限り環境変数として存在しないため、
# このワークフローではフォールバック先が無く、gh はトークン未設定のエラーで止まる。
# permissions を空にするのは、将来 GITHUB_TOKEN を env に渡す変更が入っても、
# 借りた権限で予約だけ通って鍵の不備が隠れないようにするための保険。
# pull_request_target は使わない。Dependabot発のPRには例外があり、
# secretsも書き込み権限も得られないうえ、PRのコードを特権で実行する危険がある。
permissions: {}

jobs:
  auto-merge:
    name: auto-merge
    # PRの作成者で判定する。github.actor は「最後にイベントを起こした人」であり、
    # ブランチ名の書き換えやマージ衝突の解決を経由して偽装できるため使わない。
    # forkからのPRは対象外にする(Dependabotは同一リポジトリにブランチを作る)。
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: dependabot-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          # マージ列が有効なブランチでは、組み込みの GITHUB_TOKEN ではPRをキューへ
          # 投入できない(公式明記)。かつDependabot発のイベントは Actions secrets を
          # 参照できないため、使えるのは Dependabot secrets に登録した鍵だけになる。
          # 未登録のまま切り替えると、このジョブが赤(非必須)になるだけで
          # DependabotのPRが静かに滞留する
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          # 予約は冪等。synchronize でも実行するのは、初回の予約が一時的な失敗で
          # 付かなかった場合に付け直すため。
          # (auto-mergeが解除されるのは書き込み権限の無い者によるpushとbase切り替えの
          #  ときだけで、Dependabotのforce-pushでは解除されない)
          #
          # --squash はマージ列が有効な間は警告が出るだけで無視される(方式はキュー側の
          # 設定で決まる)。外してはいけない。キューを緊急に無効化したときに、
          # 非対話環境でメソッド指定が無いと gh がエラーになり予約手段が壊れる
          gh pr merge --auto --squash "$PR_URL"
