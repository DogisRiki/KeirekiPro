name: Dependabot Auto-merge

# Dependabotの「脆弱性修正」のPRにだけ auto-merge(squash)を予約する。
#
# DependabotのPRは2種類あり、要求が正反対のため扱いを分ける。
#   security updates: lockfileのみの更新が大半でレビュー対象の差分が無い。
#                     Criticalの対応であり、人手を挟まず流す
#   version updates : バージョン文字列という読める差分がある。
#                     独立レビューを経ないまま自動マージしないため、所有者がマージする
#
# 判別には fetch-metadata の alert-state を使う。値が入っていれば脆弱性修正、
# 空ならバージョン更新。この参照には alert-lookup: true とPATが必要で、
# 既定のGITHUB_TOKENでは動かない。
# Dependabot発の pull_request ではActions secretsが遮断されPATを参照できないため、
# pull_request_target で起動する。PRのコードはcheckoutしない(pwn request対策)。
# 他のPRではジョブ自体がスキップされ、昇格した権限で動くコードは存在しない。
#
# 参照:
#   https://github.com/dependabot/fetch-metadata
#   https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-on-actions

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: auto-merge
    # user.login はGitHubが設定する値で、PR作成者は詐称できない
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          alert-lookup: true
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Enable auto-merge for security updates
        # alert-state が空でなければ脆弱性修正のPR
        if: steps.metadata.outputs.alert-state != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "脆弱性修正のPR(alert-state: ${{ steps.metadata.outputs.alert-state }})のため auto-merge を予約します。"
          gh pr merge --auto --squash "$PR_URL"

      - name: Skip auto-merge for version updates
        if: steps.metadata.outputs.alert-state == ''
        run: |
          echo "バージョン更新のPRのため auto-merge は予約しません。所有者がマージしてください。"
