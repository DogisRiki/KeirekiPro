name: Dependency Gate

# 依存追加とビルド定義の変更に対する人間ゲート(required check に指定する)。
#
# 判定対象:
#   - frontend/package.json の dependencies / devDependencies に増えたキー
#     (バージョン更新のみは対象外)
#   - backend のビルド定義ファイルの変更そのもの
#     (*.gradle / *.gradle.kts / *.versions.toml / gradle-wrapper.properties)
#     中身は解析しないため、バージョン更新やコメントのみの変更も対象になる
#
# 判定: 対象の変更あり かつ リポジトリ所有者のApproveなし -> 赤
#       所有者がApproveした時点で pull_request_review 発火により再評価され緑になる。
# Approve判定は所有者アカウントで照合し、bot・第三者のApproveは無効。
#
# backendのビルド定義を解析しない理由は check-dependency-additions.sh の冒頭に記載。

on:
  pull_request:
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-gate-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  dependency-gate:
    name: dependency-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # 検知スクリプト自身のテスト。落ちた場合はゲートも失敗させる(fail-closed)。
      - name: Test dependency addition detector
        run: bash .github/scripts/tests/test-check-dependency-additions.sh

      - name: Check owner approval
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          # --paginate には --slurp を併用する(ページ単位でjqが適用され判定を誤るため)。
          # gh の --jq は --slurp と併用できない仕様のため、jq へパイプして評価する。
          # commit_id で現在のhead SHAに対するレビューだけに絞る(承認後にコミットを積んで
          # ゲートを迂回されないようにする。ブランチ保護のDismiss stale approvals頼みにしない)。
          verdict=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" --paginate --slurp \
            | jq -r --arg owner "$owner" --arg head "$head_sha" '[.[][] | select(.user.login == $owner) | select(.commit_id == $head) | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")] | sort_by(.submitted_at) | last | .state // "NONE"')
          echo "Owner review verdict: $verdict"
          if [ "$verdict" = "APPROVED" ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run dependency addition check
        env:
          OWNER_APPROVED: ${{ steps.approval.outputs.approved }}
        run: |
          chmod +x .github/scripts/check-dependency-additions.sh
          .github/scripts/check-dependency-additions.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
