# 依存パッケージの更新はDependabotが担当する。
# メジャー更新は ignore で除外し、必要な場合は人間がIssueを起票して個別に扱う。
# ignore の update-types はバージョン更新にのみ適用され、脆弱性対応のPRは抑制されない。
#
# frontend(npm)は version updates の対象に含めていない。Dependabotのサポート対象は
# pnpm 10 までで、このリポジトリが指定する pnpm 11 は未対応のため
# (https://github.com/dependabot/dependabot-core/issues/14794 は現在open)。
# 対応後にレーンを追加する。それまでのfrontendのバージョン更新は通常のPRで行う。
#
# security updates はこの設定ファイルに依存せずアラート起点で動くため、
# frontendでもPRの作成が試みられる。実際に作成されるかは、そのアラートが修正可能で、
# マニフェストまたはlockfileから更新できるかによる。
#
# cooldown は書かない。2026-07-14 から、新しいリリースがレジストリで最低3日
# 利用可能になるまで version update のPRを開かないのがデフォルトになっている。
#
# 参照: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      backend-dependencies:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # アクションの更新は月次にする。npm/Gradleほど頻繁に変わらないため。
  # メジャー更新を除外しないのは、アクションの通常の更新経路がメジャー版の切り替え
  # (v5からv6など)であり、除外すると更新が事実上止まるため。
  # .github/workflows/ はCODEOWNERS保護対象で、所有者の承認なしにはマージされない。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        update-types: ["minor", "patch"]

  # Dockerfileは docker/ 配下の7ディレクトリに集約しているため、globの1行で全て対象になる。
  # ベースイメージは digest 固定してあり、タグが動かなくても digest 比較で更新PRが出る。
  #
  # メジャー更新の除外は必須。eclipse-temurin の `21-jre` は Dependabot のタグ比較で
  # version=21 / suffix=-jre と解釈されるため、除外しないと Java の次期メジャー版への
  # 昇格PRが飛んでくる。除外した分は監査手順の半期項目で棚卸しする。
  #
  # このレーンのPRはcloseしないこと。closeするとそのタグの更新が恒久的にブロックされ、
  # 復旧経路が限られる(照合キーにdigestが含まれないため)。
  # 詳細と出口は doc/開発フロー/監査手順.md に記載している。
  #
  # digest更新はgroupsに入らず(現在バージョンと最新が同じタグ文字列になるため)、
  # ディレクトリごとの個別PRになる。上限はディレクトリ数を下回らない値にする。
  - package-ecosystem: "docker"
    directories:
      - "/docker/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    groups:
      docker-base-images:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
