<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Go 版の本番のイメージの fontconfig の設定。
  docker/backend-go/Dockerfile.prod が /etc/fonts/local.conf に置く。Debian の既定の設定が、このファイルを読む。
  PDF を作る Chromium が、Java 版と同じ Noto の4つのフォントだけで文字を描くようにする。
-->
<fontconfig>
  <!-- Java 版の backend/src/main/resources/fonts/ から写した4つのフォントの置き場 -->
  <dir>/usr/share/fonts/keirekipro</dir>

  <!--
    fontconfig のパッケージは、依存として DejaVu のフォントを入れる。
    Java 版は4つの Noto のフォントだけで PDF を作るので、ほかのフォントは使わせない。
  -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/*</glob>
    </rejectfont>
  </selectfont>

  <!--
    テンプレートは、利用者が選んだフォントの名前のあとに sans-serif か serif を書く。
    名前の無いフォントを選ばれたときも、Java 版と同じ Noto のフォントで描くように、総称の名前を Noto に向ける。
  -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans JP</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif JP</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans JP</family>
    </prefer>
  </alias>
</fontconfig>
