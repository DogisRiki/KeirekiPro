spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    aws:
      secretsmanager:
        enabled: false
      s3:
        enabled: false
      ses:
        enabled: false

jwt:
  secret: dummy

# コンテキスト起動テスト用。dev/prodのプロファイルにしか無い設定を補う
frontend-base-url: "http://localhost:5173"

cors:
  allowed-origins: "http://localhost:5173"

cookie:
  secure: false

aws:
  ses:
    from-address: "no-reply@test.example.com"
  s3:
    bucket-name: "test-bucket"
