# バックアップの戻しで、形の誤ったファイルを戻す筋書き(要件1の受入基準1、要件6の受入基準1と2)。
# user2 が、経歴書の欄の無い no-resume.json、職歴の欄の無いファイル、項目の並びに null の要素を持つファイル、値の型の違う
# ファイル、知らない名前の欄を持つファイル、中身が並びのファイル、中身が数のファイルを、fixtures/backups/ から json_file で
# 1つずつ戻す。no-resume.json と null の要素を持つファイルには、Java 版も Go 版も 500 で答える。
# 戻しの段には csrf: true を付ける。
name: backup-malformed
group: 5
fixtures: [users/basic.sql, backup/backup.sql]
modes: [compare]
steps:
  - name: login-user2
    request:
      method: POST
      path: /api/auth/login
      json: {email: user2@example.com, password: Passw0rd!}
    expect: {status: 200}
  - name: restore-no-resume
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      json_file: backups/no-resume.json
    expect: {status: 500}
  - name: restore-no-careers
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      json_file: backups/malformed-no-careers.json
    expect: {status: 201}
  - name: restore-null-element
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      json_file: backups/malformed-null-element.json
    expect: {status: 500}
  - name: restore-types
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      json_file: backups/malformed-types.json
    expect: {status: 400}
  - name: restore-unknown-fields
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      json_file: backups/malformed-unknown-fields.json
    expect: {status: 201}
  - name: restore-array
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      json_file: backups/malformed-array.json
    expect: {status: 400}
  - name: restore-number
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      json_file: backups/malformed-number.json
    expect: {status: 400}
