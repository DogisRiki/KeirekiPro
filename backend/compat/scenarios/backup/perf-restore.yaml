# バックアップの操作で、経歴書の戻しの応答の時間を測る筋書き(要件6の受入基準4)。
# 6つの欄のすべてに項目を持つ経歴書 401 のバックアップのファイル fixtures/backups/java-401.json を戻す段を測る。
# 同じファイルを続けて戻すと、名前の重なりで断られるので、prepare_each を真にし、回ごとに前の段を送り直す。
# user1 がログインし、経歴書の一覧の最初の経歴書の ID を取り出して消してから戻す。fixtures が users/basic.sql と
# resumes/fonts.sql なので、user1 の経歴書は、最初は経歴書 401 の1件で、2回目からは前の回に戻した経歴書の1件である。
name: backup-perf-restore
group: 5
fixtures: [users/basic.sql, resumes/fonts.sql]
modes: [perf]
prepare_each: true
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  - name: list-resumes
    request:
      method: GET
      path: /api/resumes
    capture: {resumeID: '$.resumes[0].id'}
    expect: {status: 200}
  - name: delete-first
    request:
      method: DELETE
      path: /api/resumes/{resumeID}
      csrf: true
    expect: {status: 204}
  - name: restore-401
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      json_file: backups/java-401.json
    expect: {status: 201}
