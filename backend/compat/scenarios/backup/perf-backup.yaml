# バックアップの操作で、経歴書の書き出しの応答の時間を測る筋書き(要件6の受入基準4)。
# user1 がログインしたあとに、resumes/fonts.sql の、6つの欄のすべてに項目を持つ経歴書 401 を、
# 画面と同じ Accept の行で書き出す段を繰り返して測る。
name: backup-perf-backup
group: 5
fixtures: [users/basic.sql, resumes/fonts.sql]
modes: [perf]
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  - name: backup-401
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000401/backup
      headers: {Accept: application/json}
    expect: {status: 200, content_type: application/json}
