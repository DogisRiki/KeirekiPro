# 一方の版で書き出したバックアップのファイルを、もう一方の版で戻せることを確かめる、版をまたぐ筋書き(要件7の受入基準1と2)。
# user1 が、最初の版で、経歴書 401(resumes/fonts.sql)を書き出し、本文を取り出す。最初の版で経歴書 401 を消す。戻す経歴書の
# 名前が、経歴書 401 の名前と重ならないようにするためである。
# もう一方の版(to: other)で、取り出した本文を json_capture で戻し、201 で答えられることを確かめ、作った経歴書の ID を取り出す。
# 最後の段は、その前の版に送る段と違う版、つまり最初の版に届く。最初の版で作った経歴書を読み、expect の values で、経歴書の
# 名前と日付と姓と名と、6つの欄の項目の値が、経歴書 401 の値と同じことを確かめる。
# 6つの欄の項目の添字は、経歴書を読む答えの項目の並び(職歴とプロジェクトは期間の新しい順、資格は取得の年月の新しい順、
# ポートフォリオと SNS と自己PR は名前の順)に合わせる。
# 工程の systemTest と maintenance は、values に書かない。経歴書を読む答えで、Java 版だけがこの2つの値を入れ替えて答える
# ので(CB-076)、最後の段を受ける版によって答えが変わるためである。戻した2つの値は、backup-restore の筋書きが、戻したあとの
# データベースを Java 版と Go 版で比べて確かめる。
name: backup-cross-backup
group: 5
fixtures: [users/basic.sql, resumes/fonts.sql]
modes: [cross]
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  # 最初の版で、経歴書 401 を書き出す
  - name: backup-401
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000401/backup
      headers: {Accept: application/json}
    capture: {backup: text}
    expect: {status: 200, content_type: application/json}
  # 最初の版で、経歴書 401 を消す
  - name: delete-401
    request:
      method: DELETE
      path: /api/resumes/00000000-0000-4000-8000-000000000401
      csrf: true
    expect: {status: 204}
  # もう一方の版で、書き出したファイルを戻す
  - name: restore-other-version
    to: other
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      json_capture: backup
    capture: {restoredID: $.id}
    expect: {status: 201}
  # 最初の版で、戻した経歴書を読む
  - name: get-restored-first-version
    request:
      method: GET
      path: /api/resumes/{restoredID}
