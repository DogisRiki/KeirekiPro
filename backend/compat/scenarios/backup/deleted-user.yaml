# バックアップの操作で、退会してすでに居ない利用者の筋書き(要件5の受入基準3、要件6の受入基準1)。
# 手本は scenarios/export/deleted-user.yaml である。
# resumes/resume-ops.sql の退会用の利用者(000000000340)がログインし、ログインの状態の値を取り出してから退会する。
# 退会用の利用者は、パスワードを変えていないので、ログインの状態の世代の番号が 0 のままであり、取り出した値は退会のあとも
# ログインの状態の検査を通る。退会の答えは Cookie の XSRF-TOKEN を残すので、退会のあとの csrf の段は、残った XSRF-TOKEN を使う。
# 退会のあとの段は、取り出した値を Cookie のヘッダで送り、退会の前の経歴書(000000000350)の書き出しと、ファイルの版の誤った
# wrong-version.json と、日付の欄に日付の形でない文字を入れた reject-bad-date.json と、終わりの年月が始まりの年月より前の
# reject-end-before-start.json の戻しを送る。
# Java 版が 500 で答える4つの戻し(変えた動きの一覧の CB-063 から CB-066)は、この筋書きで送らない。
name: backup-deleted-user
group: 5
fixtures: [users/basic.sql, resumes/resume-ops.sql]
modes: [compare]
steps:
  - name: login-withdraw
    request:
      method: POST
      path: /api/auth/login
      json: {email: resume-withdraw@example.com, password: Passw0rd!}
    capture: {withdrawAccess: 'cookie:accessToken'}
    expect: {status: 200}
  - name: get-resume-before-delete
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000350
    expect: {status: 200}
  - name: delete-withdraw-user
    request:
      method: DELETE
      path: /api/users/me
      csrf: true
    expect: {status: 204}
  - name: backup-after-delete
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000350/backup
      headers: {Cookie: 'accessToken={withdrawAccess}', Accept: application/json}
    expect: {status: 404, content_type: application/json}
  - name: restore-wrong-version-after-delete
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      headers: {Cookie: 'accessToken={withdrawAccess}'}
      json_file: backups/wrong-version.json
    expect: {status: 400}
  - name: restore-bad-date-after-delete
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      headers: {Cookie: 'accessToken={withdrawAccess}'}
      json_file: backups/reject-bad-date.json
    expect: {status: 400}
  - name: restore-end-before-start-after-delete
    request:
      method: POST
      path: /api/resumes/restore
      csrf: true
      headers: {Cookie: 'accessToken={withdrawAccess}'}
      json_file: backups/reject-end-before-start.json
    expect: {status: 400}
