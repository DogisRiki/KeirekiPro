# パスワードの再設定の筋書き。申し込み、確認、再設定、アカウントが無いメールアドレス、確認の済んでいないアカウント、
# 期限の切れた値、使い終わった値、値は有効だが利用者が居ない、再設定のあとのほかの端末のログインの状態を確かめる。
# 再設定の値は、届いた再設定のメールの本文の、/password/reset/ のあとから取り出す。
# 再設定の値は、Redis のキー password-reset:<値> に、利用者の ID を JSON の文字列で10分置く。
name: auth-password-reset
group: 1
fixtures: [users/basic.sql, users/auth-users.sql]
modes: [compare, cross]
steps:
  # 1つ目の場面: アカウントが無いメールアドレス。アカウントがあるときと同じ 204 で答え、メールを送らない
  - name: request-reset-no-account
    request:
      method: POST
      path: /api/auth/password/reset/request
      json: {email: nobody@example.com}
    expect: {status: 204}
  # 2つ目の場面: 確認の済んでいないアカウント。同じ 204 で答え、再設定のメールの代わりに確認のメールを送る
  - name: request-reset-unverified
    request:
      method: POST
      path: /api/auth/password/reset/request
      json: {email: unverified@example.com}
    expect: {status: 204}
  # 3つ目の場面: 申し込み、確認、再設定と、再設定のあとのほかの端末のログインの状態
  - name: request-reset
    request:
      method: POST
      path: /api/auth/password/reset/request
      json: {email: user2@example.com}
    capture: {reset1: 'mail:/password/reset/(\S+)'}
    expect: {status: 204}
  # 再設定の確認の段は、申し込んだ版と違う版に届く
  - name: verify-reset-token
    to: other
    request:
      method: POST
      path: /api/auth/password/reset/verify
      json: {token: "{reset1}"}
    expect: {status: 204}
  # ほかの端末のログイン。ここで取り出した値を、再設定のあとに Cookie ヘッダに差し込んで送る。
  # この段に to: other を付け、再設定の段が、申し込んだ版と違う版に届くようにする
  - name: login-other-device
    to: other
    request:
      method: POST
      path: /api/auth/login
      json: {email: user2@example.com, password: Passw0rd!}
    capture: {accessA: 'cookie:accessToken', refreshA: 'cookie:refreshToken'}
    expect: {status: 200}
  - name: reset-password
    to: other
    request:
      method: POST
      path: /api/auth/password/reset
      json: {token: "{reset1}", password: NewPassw0rd, confirmPassword: NewPassw0rd}
    expect: {status: 204}
  # 再設定した版と違う版に送り、ほかの端末のログインの状態の値を 401 で断ることを確かめる
  - name: admin-users-after-reset
    to: other
    request:
      method: GET
      path: /api/admin/users
      headers: {Cookie: 'accessToken={accessA}'}
    expect: {status: 401}
  - name: refresh-after-reset
    request:
      method: POST
      path: /api/auth/token/refresh
      headers: {Cookie: 'refreshToken={refreshA}'}
    expect: {status: 401}
  - name: login-old-password
    request:
      method: POST
      path: /api/auth/login
      json: {email: user2@example.com, password: Passw0rd!}
    expect: {status: 400}
  - name: login-new-password
    request:
      method: POST
      path: /api/auth/login
      json: {email: user2@example.com, password: NewPassw0rd}
    expect: {status: 200}
  # 4つ目の場面: 使い終わった値。再設定で消えた値をもう一度送る
  # この段には to: other を付けない。付けると、管理者の経路の段 admin-users-after-reset の to: other のあとに版がもう一度替わり、
  # Java 版から Go 版の向きと Go 版から Java 版の向きで、値を使い終えた再設定の段 reset-password と同じ版に戻る。
  # 付けなければ、どの向きでも、再設定の段と違う版に届く
  - name: verify-used-token
    request:
      method: POST
      path: /api/auth/password/reset/verify
      json: {token: "{reset1}"}
    expect: {status: 400}
  - name: reset-used-token
    to: other
    request:
      method: POST
      path: /api/auth/password/reset
      json: {token: "{reset1}", password: OtherPassw0rd, confirmPassword: OtherPassw0rd}
    expect: {status: 400}
  # 5つ目の場面: 期限の切れた値。時間が過ぎるのを待たずに、Redis の値を消して作る
  - name: request-reset-again
    request:
      method: POST
      path: /api/auth/password/reset/request
      json: {email: user2@example.com}
    capture: {reset2: 'mail:/password/reset/(\S+)'}
    expect: {status: 204}
  - name: expire-reset-token
    redis:
      del: ['password-reset:{reset2}']
  - name: verify-expired-token
    to: other
    request:
      method: POST
      path: /api/auth/password/reset/verify
      json: {token: "{reset2}"}
    expect: {status: 400}
  # この段には to: other を付けない。付けると、前の確認の段 verify-expired-token の to: other と2つ続き、
  # Java 版から Go 版の向きと Go 版から Java 版の向きで、値を出した申し込みの段 request-reset-again と同じ版に戻る。
  # 付けなければ、その2つの向きでは、申し込みの段と違う版に届く(交互の向きでは同じ版に届く)
  - name: reset-expired-token
    request:
      method: POST
      path: /api/auth/password/reset
      json: {token: "{reset2}", password: OtherPassw0rd, confirmPassword: OtherPassw0rd}
    expect: {status: 400}
  # 6つ目の場面: 値は有効だが利用者が居ない。筋書きに書いた値のキーに、居ない利用者の ID を置いて作る
  - name: put-reset-token-missing-user
    redis:
      set:
        - key: password-reset:compatMissingUserToken000000000000000000000
          value: '"00000000-0000-4000-8000-000000000099"'
          ttl_seconds: 600
  - name: verify-missing-user-token
    to: other
    request:
      method: POST
      path: /api/auth/password/reset/verify
      json: {token: compatMissingUserToken000000000000000000000}
    expect: {status: 204}
  - name: reset-missing-user
    to: other
    request:
      method: POST
      path: /api/auth/password/reset
      json: {token: compatMissingUserToken000000000000000000000, password: OtherPassw0rd, confirmPassword: OtherPassw0rd}
    expect: {status: 401}
