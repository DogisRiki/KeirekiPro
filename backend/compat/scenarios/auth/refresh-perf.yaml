# 作り直しの応答の時間を測る筋書き。ログインのあとに作り直しを繰り返して測る。
# 作り直しの応答の Set-Cookie で、次の回は新しいログインを続けるための値を送る。
name: auth-refresh-perf
group: 1
fixtures: [users/basic.sql, users/auth-users.sql]
modes: [perf]
steps:
  - name: login
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  - name: refresh
    request:
      method: POST
      path: /api/auth/token/refresh
    expect: {status: 200}
