# 出力の操作で、設定を付けた出力の PDF の応答の時間とメモリの最大を測る筋書き(要件5の受入基準4)。
# user1 がログインしたあとに、resumes/fonts.sql の、6つの欄のすべてに項目を持ち PDF が2頁になる経歴書 401 に、
# 画面と同じ Accept の行で設定を付けた出力の本文を送る段を繰り返して測る。同時に送ったときの Go 版のメモリの最大も測る。
name: export-perf-pdf
group: 4
fixtures: [users/basic.sql, resumes/fonts.sql]
modes: [perf]
measure_memory: true
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  - name: export-pdf
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000401/export
      csrf: true
      headers: {Accept: 'application/pdf, application/json'}
      json_file: resumes/fonts-NotoSansJP.json
    expect: {status: 200, content_type: application/pdf}
