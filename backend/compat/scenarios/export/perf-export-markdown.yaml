# 出力の操作で、設定を付けない出力の Markdown の応答の時間を測る筋書き(要件5の受入基準4)。
# user1 がログインしたあとに、resumes/fonts.sql の、6つの欄のすべてに項目を持つ経歴書 401 に、
# 画面と同じ Accept の行で Markdown を求める段を繰り返して測る。
name: export-perf-markdown
group: 4
fixtures: [users/basic.sql, resumes/fonts.sql]
modes: [perf]
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  - name: export-markdown
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000401/export
      headers: {Accept: 'text/markdown, application/json'}
    expect: {status: 200, content_type: text/markdown;charset=utf-8}
