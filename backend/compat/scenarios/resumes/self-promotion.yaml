# 自己PR の項目の追加、更新、削除と、自己PR の入力の誤りの筋書き。
# user1 が、resumes/resume-ops.sql の経歴書 A(000000000320)を持つ状態から始める。
# 経歴書 A の自己PR は、A 粘り強く調べる(00000000032b)と、本文に改行を持つ B 文書を残す(00000000032c)である。
# 自己PR はタイトルの順に並ぶ。Java 版と Go 版の並びの違いは、変えた動きの一覧の CB-001 の match が許す。
# 足す自己PR のタイトルを「C 」で始めると、2つの版のどちらでも並びの3つ目に入る。足した自己PR の ID は、その場所から取り出す。
# 1つの段では、確かめる誤りの種類を1つにする。
# 鍵を大文字で書いた要求と、画面が送らない書き方の ID を入れた要求は、2つの版の答えが違う(変えた動きの一覧の CB-051 と CB-054)ので送らない。
# 自己PR には真偽の欄が無いので、真偽の欄に読めない値を入れた要求は送らない。
name: resumes-self-promotion
group: 3
fixtures: [users/basic.sql, resumes/resume-ops.sql]
modes: [compare]
steps:
