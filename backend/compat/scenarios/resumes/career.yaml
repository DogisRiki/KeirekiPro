# 職歴の項目の追加、更新、削除と、職歴の入力の誤りと、期間の決まりと、職歴どうしの期間の重なりの筋書き。
# user1 が、resumes/resume-ops.sql の経歴書 A(000000000320)と経歴書 B(000000000330)を持つ状態から始める。
# 経歴書 A の職歴は、株式会社そうさ(000000000321、2015-04 から 2019-03)と、在籍中の Operation Works 株式会社(000000000322、2019-04 から)である。
# 職歴は期間の新しい順に並ぶので、2015-03 までに終わる職歴を経歴書 A に足すと、職歴の並びの3つ目に入る。足した職歴の ID は、その場所から取り出す。
# 年月の上限の 2100-12 は、在籍中の職歴と期間が重なるので、在籍中の職歴の無い経歴書 B に足す。
# 1つの段では、確かめる誤りの種類を1つにする。年月の値の形の誤りには、画面の年月の入力欄で Home を押したときに画面が送る Invalid Date を送る。
# 鍵を大文字で書いた要求と、画面が送らない書き方の ID と年月を入れた要求は、2つの版の答えが違う(変えた動きの一覧の CB-051 から CB-054)ので送らない。
name: resumes-career
group: 3
fixtures: [users/basic.sql, resumes/resume-ops.sql]
modes: [compare]
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  - name: get-resume-a
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000320
    expect: {status: 200, fields: [$.careers]}
  # 追加と更新と削除
  - name: create-career
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 株式会社まえ, startDate: '2010-04', endDate: '2015-03', isActive: false}
    capture: {newID: '$.careers[2].id'}
    expect: {status: 201, fields: [$.careers, $.updatedAt]}
  # 会社名は UTF-16 の単位で50。終了の年月は、株式会社そうさの開始の年月と同じ月なので、期間は重ならない
  - name: update-career-new-boundary
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/{newID}
      csrf: true
      json: {companyName: 'ああああああああああああああああああああああああああああああああああああああああああああああああ😀', startDate: '2010-04', endDate: '2015-04', isActive: false}
    expect: {status: 200}
  # 直す職歴そのものとは期間を比べない
  - name: update-career-existing
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/00000000-0000-4000-8000-000000000321
      csrf: true
      json: {companyName: 株式会社そうさ改, startDate: '2015-05', endDate: '2019-03', isActive: false}
    expect: {status: 200}
  - name: update-career-active
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/00000000-0000-4000-8000-000000000322
      csrf: true
      json: {companyName: Operation Works 株式会社, startDate: '2019-04', endDate: null, isActive: true}
    expect: {status: 200}
  - name: update-career-active-empty-end
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/00000000-0000-4000-8000-000000000322
      csrf: true
      json: {companyName: Operation Works 株式会社, startDate: '2019-05', endDate: '', isActive: true}
    expect: {status: 200}
  # 年月の下限の 1900-01
  - name: create-career-lower-bound
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 古い会社, startDate: '1900-01', endDate: '1900-12', isActive: false}
    expect: {status: 201}
  # 年月の上限の 2100-12
  - name: create-career-upper-bound-b
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000330/careers
      csrf: true
      json: {companyName: 未来の会社, startDate: '2100-01', endDate: '2100-12', isActive: false}
    expect: {status: 201}
  - name: get-resume-a-after-change
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000320
    expect: {status: 200}
  # 入力が要る欄
  - name: create-all-missing
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {}
    expect: {status: 400, fields: [$.errors.companyName, $.errors.startDate, $.errors.isActive]}
  - name: create-all-null
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: null, startDate: null, endDate: null, isActive: null}
    expect: {status: 400}
  - name: create-all-empty
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: '', startDate: '', endDate: '', isActive: null}
    expect: {status: 400}
  - name: update-all-missing
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/{newID}
      csrf: true
      json: {}
    expect: {status: 400}
  # 長さの上限。空白51文字は、入力が要る文言と長さの文言の2つが付く(変えた動きの一覧の CB-050)
  - name: create-blank-over-limit
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: '                                                   ', startDate: '2000-04', endDate: '2001-03', isActive: false}
    expect: {status: 400}
  # 「あ」49文字と絵文字で、UTF-16 の単位で51
  - name: create-name-over-limit
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 'あああああああああああああああああああああああああああああああああああああああああああああああああ😀', startDate: '2000-04', endDate: '2001-03', isActive: false}
    expect: {status: 400}
  - name: update-name-over-limit
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/{newID}
      csrf: true
      json: {companyName: 'あああああああああああああああああああああああああああああああああああああああああああああああああ😀', startDate: '2010-04', endDate: '2015-03', isActive: false}
    expect: {status: 400}
  # 年月の範囲
  - name: create-start-before-1900
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 範囲の会社, startDate: '1899-12', endDate: '1900-03', isActive: false}
    expect: {status: 400}
  - name: create-end-after-2100
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000330/careers
      csrf: true
      json: {companyName: 範囲の会社, startDate: '2100-01', endDate: '2101-01', isActive: false}
    expect: {status: 400}
  # 年月の値の形。2つの版は、400 と空の errors で答える
  - name: create-start-invalid-date
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 形の会社, startDate: Invalid Date, endDate: '2001-03', isActive: false}
    expect: {status: 400}
  - name: create-end-invalid-date
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 形の会社, startDate: '2000-04', endDate: Invalid Date, isActive: false}
    expect: {status: 400}
  - name: update-start-invalid-date
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/{newID}
      csrf: true
      json: {companyName: 形の会社, startDate: Invalid Date, endDate: '2015-03', isActive: false}
    expect: {status: 400}
  # 期間の決まり
  - name: create-end-before-start
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 期間の会社, startDate: '2000-04', endDate: '2000-03', isActive: false}
    expect: {status: 400, fields: [$.errors.endDate]}
  - name: create-active-with-end
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 期間の会社, startDate: '2000-04', endDate: '2001-03', isActive: true}
    expect: {status: 400, fields: [$.errors.endDate]}
  - name: create-inactive-without-end
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 期間の会社, startDate: '2000-04', endDate: null, isActive: false}
    expect: {status: 400, fields: [$.errors.endDate]}
  - name: update-end-before-start
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/{newID}
      csrf: true
      json: {companyName: 期間の会社, startDate: '2010-04', endDate: '2010-03', isActive: false}
    expect: {status: 400}
  # 職歴どうしの期間の重なり。文言には、重なる職歴の会社名が職歴の並びの順に入る
  - name: create-overlap-one
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 株式会社かさなり, startDate: '2016-04', endDate: '2017-03', isActive: false}
    expect: {status: 400}
  - name: create-overlap-two-active
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 株式会社かさなり, startDate: '2018-04', endDate: null, isActive: true}
    expect: {status: 400}
  - name: update-overlap
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/{newID}
      csrf: true
      json: {companyName: 株式会社まえ, startDate: '2010-04', endDate: '2015-06', isActive: false}
    expect: {status: 400}
  # 本文が読めない要求
  - name: create-name-array
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: [株式会社まえ], startDate: '2000-04', endDate: '2001-03', isActive: false}
    expect: {status: 400}
  - name: create-active-string
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: {companyName: 読めない会社, startDate: '2000-04', endDate: '2001-03', isActive: abc}
    expect: {status: 400}
  - name: update-active-string
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/{newID}
      csrf: true
      json: {companyName: 読めない会社, startDate: '2010-04', endDate: '2015-03', isActive: abc}
    expect: {status: 400}
  - name: create-body-array
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: [{companyName: 読めない会社, startDate: '2000-04', endDate: '2001-03', isActive: false}]
    expect: {status: 400}
  - name: create-body-string
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers
      csrf: true
      json: 読めない会社
    expect: {status: 400}
  # 削除
  - name: delete-career-new
    request:
      method: DELETE
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/{newID}
      csrf: true
    expect: {status: 204}
  - name: delete-career-new-again
    request:
      method: DELETE
      path: /api/resumes/00000000-0000-4000-8000-000000000320/careers/{newID}
      csrf: true
    expect: {status: 404}
  - name: get-resume-a-after-delete
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000320
    expect: {status: 200}
  - name: get-resume-b-after-change
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000330
    expect: {status: 200}
