# ポートフォリオの項目の追加、更新、削除と、ポートフォリオの入力の誤りの筋書き。
# user1 が、resumes/resume-ops.sql の経歴書 A(000000000320)を持つ状態から始める。
# 経歴書 A のポートフォリオは、A 家計簿(000000000327)と、技術スタックが NULL の B 読書の記録(000000000328)である。
# ポートフォリオは名前の順に並ぶ。Java 版と Go 版の並びの違いは、変えた動きの一覧の CB-001 の match が許す。
# 足すポートフォリオの名前を「C 」で始めると、2つの版のどちらでも並びの3つ目に入る。足したポートフォリオの ID は、その場所から取り出す。
# リンクの欄は、入力が要ることと、https の形の URL であることと、UTF-16 の単位で255文字以内であることを確かめる。
# 1つの段では、確かめる誤りの種類を1つにする。ただし、空白だけのリンクは、入力が要る文言と https の形の文言の2つが付く。
# 鍵を大文字で書いた要求と、画面が送らない書き方の ID を入れた要求は、2つの版の答えが違う(変えた動きの一覧の CB-051 と CB-054)ので送らない。
# ポートフォリオには真偽の欄が無いので、真偽の欄に読めない値を入れた要求は送らない。
