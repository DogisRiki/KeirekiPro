# プロジェクトの項目の追加、更新、削除と、プロジェクトの入力の誤りと、期間の決まりと、技術スタックの並びの保存の筋書き。
# user1 が、resumes/resume-ops.sql の経歴書 A(000000000320)を持つ状態から始める。
# 経歴書 A のプロジェクトは、技術スタックの35の列すべてに値を持つ 000000000323(2015-04 から 2017-03)と、継続中で NULL の列と空の並びの列を持つ 000000000324(2019-04 から)である。
# プロジェクトは期間の新しい順に並ぶので、2014-03 までに終わるプロジェクトを足すと並びの3つ目に入り、2011-03 までに終わるプロジェクトをそのあとに足すと4つ目に入る。足したプロジェクトの ID は、その場所から取り出す。
# プロジェクトどうしの期間の重なりは確かめないので、期間は既存のプロジェクトと重なってもよい。
# 本文は、錨(&名前)と併合(<<: *名前)で前の段の本文を使い回し、段ごとに違う欄だけを書く。
# 1つの段では、確かめる誤りの種類を1つにする。年月の値の形の誤りには、画面の年月の入力欄で Home を押したときに画面が送る Invalid Date を送る。
# 鍵を大文字で書いた要求と、画面が送らない書き方の ID と年月を入れた要求は、2つの版の答えが違う(変えた動きの一覧の CB-051 から CB-054)ので送らない。
name: resumes-project
group: 3
fixtures: [users/basic.sql, resumes/resume-ops.sql]
modes: [compare]
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  - name: get-resume-a
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000320
    expect: {status: 200, fields: [$.projects]}
  # 追加と更新と削除。技術スタックの4つの大分類のすべての並びに値を入れる
  - name: create-project-full
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/projects
      csrf: true
      json: &project
        companyName: 株式会社まえ
        startDate: '2012-04'
        endDate: '2014-03'
        isActive: false
        name: 受発注のシステムの開発
        overview: "受発注を管理するシステムを作った。\n帳票の出力も作った。"
        teamComp: 全体8名
        role: 開発の担当として、画面と API を作った。
        achievement: 受注の処理の時間を3割減らした。
        requirements: true
        basicDesign: true
        detailedDesign: false
        implementation: true
        integrationTest: false
        systemTest: true
        maintenance: false
        frontendLanguages: [TypeScript, JavaScript]
        frontendFrameworks: [React]
        frontendLibraries: [Redux, React Router]
        frontendBuildTools: [Vite]
        frontendPackageManagers: [pnpm]
        frontendLinters: [ESLint]
        frontendFormatters: [Prettier]
        frontendTestingTools: [Vitest, Playwright]
        backendLanguages: [Java, Kotlin]
        backendFrameworks: [Spring Boot]
        backendLibraries: [Lombok]
        backendBuildTools: [Gradle]
        backendPackageManagers: [Maven]
        backendLinters: [Checkstyle]
        backendFormatters: [Spotless]
        backendTestingTools: [JUnit, Mockito]
        ormTools: [MyBatis]
        auth: [Spring Security]
        clouds: [AWS]
        operatingSystems: [Linux]
        containers: [Docker]
        databases: [PostgreSQL, Redis]
        webServers: [Nginx]
        ciCdTools: [GitHub Actions]
        iacTools: [Terraform]
        monitoringTools: [CloudWatch]
        loggingTools: [Fluent Bit]
        sourceControls: [Git]
        projectManagements: [Jira]
        communicationTools: [Slack]
        documentationTools: [Confluence]
        apiDevelopmentTools: [Postman]
        designTools: [Figma]
        editors: [VS Code]
        developmentEnvironments: [Dev Containers]
    capture: {fullID: '$.projects[2].id'}
    expect: {status: 201, fields: [$.projects, $.updatedAt]}
  # 技術スタックの並びに、null と空の並びを入れる
  - name: create-project-null-empty
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/projects
      csrf: true
      json:
        <<: *project
        startDate: '2010-04'
        endDate: '2011-03'
        name: 空の並びのプロジェクト
        frontendLanguages: null
        frontendFrameworks: []
        backendLanguages: null
        backendFrameworks: []
        ormTools: null
        auth: []
        clouds: null
        databases: []
        sourceControls: null
        editors: []
    capture: {nullID: '$.projects[3].id'}
    expect: {status: 201}
  # 技術スタックの並びの鍵を1つも送らない
  - name: create-project-no-stack
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/projects
      csrf: true
      json: &base
        companyName: 株式会社さき
        startDate: '2008-04'
        endDate: '2009-03'
        isActive: false
        name: 並びの無いプロジェクト
        overview: 概要
        teamComp: 全体2名
        role: 開発の担当
        achievement: 成果
        requirements: false
        basicDesign: false
        detailedDesign: false
        implementation: true
        integrationTest: false
        systemTest: false
        maintenance: false
    expect: {status: 201}
  - name: update-project-full
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/projects/{fullID}
      csrf: true
      json:
        <<: *project
        name: 受発注のシステムの改修
        maintenance: true
        frontendLanguages: [JavaScript, TypeScript]
        backendLanguages: [Go]
        clouds: [Google Cloud, AWS]
        editors: []
    expect: {status: 200}
  # 値のある技術スタックの並びを、鍵を送らないことで消す
  - name: update-project-existing-no-stack
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/projects/00000000-0000-4000-8000-000000000323
      csrf: true
      json:
        <<: *base
        companyName: 株式会社そうさ
        startDate: '2015-04'
        endDate: '2017-03'
        name: 在庫の管理のシステムの開発
    expect: {status: 200}
  - name: update-project-existing-active
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/projects/00000000-0000-4000-8000-000000000324
      csrf: true
      json:
        <<: *project
        companyName: Operation Works 株式会社
        startDate: '2019-04'
        endDate: null
        isActive: true
        name: 社内の申請のシステムの保守
        frontendLanguages: []
    expect: {status: 200}
  - name: update-project-existing-active-empty-end
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/projects/00000000-0000-4000-8000-000000000324
      csrf: true
      json:
        <<: *project
        companyName: Operation Works 株式会社
        startDate: '2019-05'
        endDate: ''
        isActive: true
        name: 社内の申請のシステムの保守
    expect: {status: 200}
  # 長さの上限ちょうどの値と、年月の下限と上限。会社名と名前は UTF-16 の単位で50、概要と役割と成果は1000、体制は100
  - name: update-project-boundary
