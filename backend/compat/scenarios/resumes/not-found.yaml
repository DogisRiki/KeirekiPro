# 無い経歴書と無い項目と、別の経歴書の項目の筋書き。
# user1 が、resumes/resume-ops.sql の経歴書 A(000000000320)と経歴書 B(000000000330)を持つ状態から始める。
# 無い経歴書の ID は、ID の形をした無い値(0000000003ff)と、大文字で書いた無い値(0000000003FE)と、ID の形でない値(not-a-uuid)を送る。
# 大文字で書いた ID は、経歴書 A の項目の ID(00000000032A から 00000000032C)を大文字で書いて、項目の更新と削除にも送る。
# 別の経歴書の項目は、経歴書 A の経路に、経歴書 B の項目の ID(000000000331 から 000000000336)を組にして送る。経歴書 B の項目は変わらない。
# 前後に空白のある ID と、画面が送らない書き方の ID は、2つの版の答えが違う(変えた動きの一覧の CB-051)ので送らない。
# 項目の ID が ID の形でない、項目の更新と削除の要求は、2つの版の答えが違う(変えた動きの一覧の CB-048)ので送らない。
name: resumes-not-found
group: 3
fixtures: [users/basic.sql, resumes/resume-ops.sql]
modes: [compare]
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  # 無い経歴書
  - name: get-missing-resume
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-0000000003ff
    expect: {status: 404}
  - name: update-basic-missing-resume
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-0000000003ff/basic
      csrf: true
      json: &basic {resumeName: 無い経歴書を直す, date: '2026-05-01', lastName: 山田, firstName: 太郎}
    expect: {status: 404}
  - name: update-basic-missing-resume-invalid
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-0000000003ff/basic
      csrf: true
      json: {<<: *basic, resumeName: ''}
    expect: {status: 400}
  - name: delete-missing-resume
    request:
      method: DELETE
      path: /api/resumes/00000000-0000-4000-8000-0000000003ff
      csrf: true
    expect: {status: 404}
  - name: create-copy-of-missing-resume
    request:
      method: POST
      path: /api/resumes
