  - name: create-project-missing-resume
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-0000000003ff/projects
      csrf: true
      json: &project
        companyName: 株式会社あたらしい
        startDate: '2012-04'
        endDate: '2013-03'
        isActive: false
