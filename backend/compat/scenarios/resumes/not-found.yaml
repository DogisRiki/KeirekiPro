        requirements: true
        basicDesign: true
        detailedDesign: true
        implementation: true
        integrationTest: true
        systemTest: true
        maintenance: false
        frontendLanguages: [TypeScript]
        frontendFrameworks: [React]
        frontendLibraries: []
        frontendBuildTools: []
        frontendPackageManagers: []
        frontendLinters: []
        frontendFormatters: []
        frontendTestingTools: []
        backendLanguages: [Go]
        backendFrameworks: []
        backendLibraries: []
        backendBuildTools: []
        backendPackageManagers: []
        backendLinters: []
        backendFormatters: []
        backendTestingTools: []
        ormTools: []
        auth: []
        clouds: [AWS]
        operatingSystems: []
        containers: []
        databases: [PostgreSQL]
        webServers: []
        ciCdTools: []
        iacTools: []
        monitoringTools: []
        loggingTools: []
        sourceControls: [Git]
        projectManagements: []
        communicationTools: []
        documentationTools: []
        apiDevelopmentTools: []
        designTools: []
        editors: []
        developmentEnvironments: []
    expect: {status: 404}
