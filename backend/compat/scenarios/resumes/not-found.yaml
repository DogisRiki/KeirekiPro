  - name: create-career-missing-resume
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-0000000003ff/careers
      csrf: true
      json: &career {companyName: 株式会社あたらしい, startDate: '1980-04', endDate: '1985-03', isActive: false}
    expect: {status: 404}
  - name: create-career-missing-resume-invalid
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-0000000003ff/careers
      csrf: true
