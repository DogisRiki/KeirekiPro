# 経歴書の一覧の応答の時間を測る筋書き。user1 がログインしたあとに、経歴書の一覧を見る段を繰り返して測る。
# user1 は、resumes/fonts.sql の、6つの欄のすべてに項目を持つ経歴書を1つ持つ。
name: resumes-perf-list-resumes
group: 3
fixtures: [users/basic.sql, resumes/fonts.sql]
modes: [perf]
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  - name: list-resumes
    request:
      method: GET
      path: /api/resumes
    expect: {status: 200}
