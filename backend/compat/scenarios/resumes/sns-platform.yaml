# SNS の項目の追加、更新、削除と、SNS の入力の誤りの筋書き。
# user1 が、resumes/resume-ops.sql の経歴書 A(000000000320)を持つ状態から始める。
# 経歴書 A の SNS は、GitHub(000000000329)と Qiita(00000000032a)である。
# SNS は名前の順に並ぶ。Java 版と Go 版の並びの違いは、変えた動きの一覧の CB-001 の match が許す。
# 足す SNS の名前を Zenn にすると、2つの版のどちらでも並びの3つ目に入る。足した SNS の ID は、その場所から取り出す。
# リンクの欄は、入力が要ることと、https の形の URL であることと、UTF-16 の単位で255文字以内であることを確かめる。
# 1つの段では、確かめる誤りの種類を1つにする。ただし、空白だけのリンクは、入力が要る文言と https の形の文言の2つが付く。
# 鍵を大文字で書いた要求と、画面が送らない書き方の ID を入れた要求は、2つの版の答えが違う(変えた動きの一覧の CB-051 と CB-054)ので送らない。
# SNS には真偽の欄が無いので、真偽の欄に読めない値を入れた要求は送らない。
name: resumes-sns-platform
group: 3
fixtures: [users/basic.sql, resumes/resume-ops.sql]
modes: [compare]
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  - name: get-resume-a
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000320
    expect: {status: 200, fields: [$.snsPlatforms]}
  # 追加と更新と削除
  - name: create-sns-platform
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: &sns {name: Zenn, link: https://zenn.dev/example-ops}
    capture: {newID: '$.snsPlatforms[2].id'}
    expect: {status: 201, fields: [$.snsPlatforms, $.updatedAt]}
  # 名前は UTF-16 の単位で50、リンクは255
  - name: update-sns-platform-new-boundary
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms/{newID}
      csrf: true
      json: {name: 'ああああああああああああああああああああああああああああああああああああああああああああああああ😀', link: 'https://example.com/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa😀'}
    expect: {status: 200, fields: [$.snsPlatforms]}
  - name: update-sns-platform-existing
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms/00000000-0000-4000-8000-000000000329
      csrf: true
      json: {name: GitHub, link: https://github.com/example-ops-renamed}
    expect: {status: 200}
  # 大文字のスキームの https の URL
  - name: create-sns-platform-upper-scheme
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {name: X, link: HTTPS://X.COM/EXAMPLE-OPS}
    expect: {status: 201}
  - name: get-resume-a-after-change
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000320
    expect: {status: 200}
  # 入力が要る欄
  - name: create-all-missing
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {}
    expect: {status: 400, fields: [$.errors.name, $.errors.link]}
  - name: create-all-null
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {name: null, link: null}
    expect: {status: 400}
  - name: create-all-empty
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {name: '', link: ''}
    expect: {status: 400}
  - name: update-all-missing
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms/{newID}
      csrf: true
      json: {}
    expect: {status: 400}
  # 長さの上限。空白51文字は、入力が要る文言と長さの文言の2つが付く(変えた動きの一覧の CB-050)
  - name: create-blank-over-limit
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {<<: *sns, name: '                                                   '}
    expect: {status: 400, fields: [$.errors.name]}
  # 「あ」49文字と絵文字で、UTF-16 の単位で51
  - name: create-name-over-limit
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {<<: *sns, name: 'あああああああああああああああああああああああああああああああああああああああああああああああああ😀'}
    expect: {status: 400, fields: [$.errors.name]}
  - name: update-name-over-limit
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms/{newID}
      csrf: true
      json: {<<: *sns, name: 'あああああああああああああああああああああああああああああああああああああああああああああああああ😀'}
    expect: {status: 400, fields: [$.errors.name]}
  - name: create-link-over-limit
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {<<: *sns, link: 'https://example.com/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa😀'}
    expect: {status: 400, fields: [$.errors.link]}
  # リンクの形
  - name: create-link-blank
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {<<: *sns, link: '   '}
    expect: {status: 400, fields: [$.errors.link]}
  - name: create-link-http
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {<<: *sns, link: 'http://zenn.dev/example-ops'}
    expect: {status: 400, fields: [$.errors.link]}
  - name: create-link-without-scheme
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {<<: *sns, link: zenn.dev/example-ops}
    expect: {status: 400, fields: [$.errors.link]}
  - name: create-link-javascript
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {<<: *sns, link: 'javascript:alert(1)'}
    expect: {status: 400, fields: [$.errors.link]}
  - name: update-link-http
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms/{newID}
      csrf: true
      json: {<<: *sns, link: 'http://zenn.dev/example-ops'}
    expect: {status: 400, fields: [$.errors.link]}
  # 本文が読めない要求
  - name: create-name-array
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: {<<: *sns, name: [Zenn]}
    expect: {status: 400}
  - name: update-link-array
    request:
      method: PUT
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms/{newID}
      csrf: true
      json: {<<: *sns, link: ['https://zenn.dev/example-ops']}
    expect: {status: 400}
  - name: create-body-array
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: [*sns]
    expect: {status: 400}
  - name: create-body-string
    request:
      method: POST
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms
      csrf: true
      json: 読めない SNS
    expect: {status: 400}
  # 削除
  - name: delete-sns-platform-new
    request:
      method: DELETE
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms/{newID}
      csrf: true
    expect: {status: 204}
  - name: delete-sns-platform-new-again
    request:
      method: DELETE
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms/{newID}
      csrf: true
    expect: {status: 404}
  - name: delete-sns-platform-existing
    request:
      method: DELETE
      path: /api/resumes/00000000-0000-4000-8000-000000000320/sns-platforms/00000000-0000-4000-8000-00000000032a
      csrf: true
    expect: {status: 204}
  - name: get-resume-a-after-delete
    request:
      method: GET
      path: /api/resumes/00000000-0000-4000-8000-000000000320
    expect: {status: 200}
