# 一方の版で変えたものが、もう一方の版で見えることを確かめる、版をまたぐ筋書き。
# user1 が、名前、画像、2段階認証の設定を変え、two-providers が GitHub の連携を解除する。変える段のあとの、利用者の情報を読む段は
# to: other を付け、変えた版と違う版に送り、変えたあとの値を expect の values で確かめる。
# 画像は、もう一方の版が返す署名付きの URL を取り出し、絶対の URL の段で読んで、置いた画像と同じバイトの並びかを確かめる。
# 画像は、PNG を置いたあとに、拡張子の違う JPEG に替える。
name: users-cross-update
group: 2
fixtures: [users/basic.sql, users/auth-users.sql, users/users-ops.sql]
modes: [cross]
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  # 名前を変え、もう一方の版で読む
  - name: update-username
    request:
      method: PUT
      path: /api/users/me
      csrf: true
      multipart:
        - {name: username, value: 横断 一郎}
    expect: {status: 200}
  - name: get-user-info-after-username
    to: other
    request:
      method: GET
      path: /api/users/me
    expect: {status: 200, values: {'$.username': 横断 一郎}}
  # PNG の画像を置き、もう一方の版が返す署名付きの URL で読む
  - name: update-image-png
    request:
      method: PUT
      path: /api/users/me
      csrf: true
      multipart:
        - {name: profileImage, file: profile.png, filename: profile.png, content_type: image/png}
    expect: {status: 200}
  - name: get-user-info-after-png
    to: other
    request:
      method: GET
      path: /api/users/me
    capture: {pngURL: $.profileImage}
    expect: {status: 200}
  - name: read-image-png
    request:
      method: GET
      url: '{pngURL}'
    expect: {status: 200, content_type: image/png, body_file: profile.png}
  # 拡張子の違う JPEG の画像に替え、もう一方の版が返す署名付きの URL で読む
  - name: update-image-jpeg
    request:
      method: PUT
      path: /api/users/me
      csrf: true
      multipart:
        - {name: profileImage, file: profile.jpg, filename: profile.jpg, content_type: image/jpeg}
    expect: {status: 200}
  - name: get-user-info-after-jpeg
    to: other
    request:
      method: GET
      path: /api/users/me
    capture: {jpegURL: $.profileImage}
    expect: {status: 200}
  - name: read-image-jpeg
    request:
      method: GET
      url: '{jpegURL}'
    expect: {status: 200, content_type: image/jpeg, body_file: profile.jpg}
  # 2段階認証を使う設定にし、もう一方の版で読む。user1 は確認の済んだメールアドレスとパスワードを持つ
  - name: enable-two-factor
    request:
      method: PUT
      path: /api/users/me
      csrf: true
      multipart:
        - {name: twoFactorAuthEnabled, value: 'true'}
    expect: {status: 200}
  - name: get-user-info-after-two-factor
    to: other
    request:
      method: GET
      path: /api/users/me
    expect: {status: 200, values: {'$.twoFactorAuthEnabled': true}}
  # Google と GitHub の連携を持つ利用者が GitHub の連携を解除し、もう一方の版で読む
  - name: login-two-providers
    request:
      method: POST
      path: /api/auth/login
      json: {email: two-providers@example.com, password: Passw0rd!}
    expect: {status: 200}
  - name: remove-github
    request:
      method: DELETE
      path: /api/users/me/auth-provider/github
      csrf: true
    expect: {status: 204}
  - name: get-user-info-after-remove-github
    to: other
    request:
      method: GET
      path: /api/users/me
    expect: {status: 200, values: {'$.authProviders': [google]}}
