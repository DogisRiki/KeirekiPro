# パスワードの変更の筋書き。user1 は、今のパスワードが合わない要求、今と同じ新しいパスワード、入力の誤りで断られてから、
# パスワードを変える。変える前のログインの状態の値をログインのときに取り出しておき、変えたあとに Cookie で送って、
# ログインの状態が使えなくなったことを比べる。変えたあとは、前のパスワードでログインできず、新しいパスワードでログインできる。
# パスワードを持たない利用者(google-only)は、Google のアカウントでログインし、パスワードを変えられない。
name: users-change-password
group: 2
fixtures: [users/basic.sql, users/auth-users.sql, users/users-ops.sql]
modes: [compare]
oidc_users:
  google: {sub: google-sub-google-only, name: グーグル 五郎, email: google-only@example.com, email_verified: true}
steps:
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    capture: {beforeAccess: 'cookie:accessToken'}
    expect: {status: 200}
  # 今のパスワードが合わない
  - name: change-wrong-now-password
    request:
      method: PATCH
      path: /api/users/me/password
      csrf: true
      json: {nowPassword: Wrong0rd!, newPassword: Changed1Pass}
    expect: {status: 400}
  # 新しいパスワードが今と同じ
  - name: change-same-password
    request:
      method: PATCH
      path: /api/users/me/password
      csrf: true
      json: {nowPassword: Passw0rd!, newPassword: Passw0rd!}
    expect: {status: 400}
  # 新しいパスワードの入力の誤り(短く、数字を含まない)
  - name: change-invalid-password
    request:
      method: PATCH
      path: /api/users/me/password
      csrf: true
      json: {nowPassword: Passw0rd!, newPassword: short}
    expect: {status: 400}
  # 今のパスワードが空
  - name: change-empty-now-password
    request:
      method: PATCH
      path: /api/users/me/password
      csrf: true
      json: {nowPassword: '', newPassword: Changed1Pass}
    expect: {status: 400}
  - name: change-password
    request:
      method: PATCH
      path: /api/users/me/password
      csrf: true
      json: {nowPassword: Passw0rd!, newPassword: Changed1Pass}
    expect: {status: 204}
  # 変える前のログインの状態の値は使えない
  - name: get-user-info-with-before-access
    request:
      method: GET
      path: /api/users/me
      headers: {Cookie: 'accessToken={beforeAccess}'}
    expect: {status: 401}
  # 前のパスワードではログインできない
  - name: login-old-password
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 400}
  # 新しいパスワードでログインできる
  - name: login-new-password
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Changed1Pass}
    expect: {status: 200}
  - name: get-user-info-after-change
    request:
      method: GET
      path: /api/users/me
    expect: {status: 200}
  # パスワードを持たない利用者は、パスワードを変えられない
  - name: start-google-only
    request:
      method: GET
      path: /api/auth/oidc/authorize?provider=google
    capture: {authURL: text}
    expect: {status: 200}
  - name: authorize-google-only
    request:
      method: GET
      url: '{authURL}'
    capture: {code: 'header:Location?code', state: 'header:Location?state'}
    expect: {status: 302}
  - name: callback-google-only
    request:
      method: GET
      path: /api/auth/oidc/callback?code={code}&state={state}
    expect: {status: 302}
  - name: change-password-without-password
    request:
      method: PATCH
      path: /api/users/me/password
      csrf: true
      json: {nowPassword: Passw0rd!, newPassword: Changed1Pass}
    expect: {status: 400}
