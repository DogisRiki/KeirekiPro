# 一方の版で設定したメールアドレスとパスワードを、もう一方の版で確認し、もう一方の版でログインに使えることを確かめる、
# 版をまたぐ筋書き。パスワードもメールアドレスも持たない利用者(google-only)が、Google のアカウントでログインし、
# メールアドレスとパスワードを設定する。届いた確認のリンクを、設定した版と違う版に送って確認し、同じ版に、設定した
# メールアドレスとパスワードでログインする。パスワードを変えたあとは、変えた版と違う版に、新しいパスワードでログインする。
# 最後に、設定したメールアドレスが確認の済んだ形で見えることを、設定した版と違う版で確かめる。
name: users-cross-email-password
group: 2
fixtures: [users/basic.sql, users/auth-users.sql, users/users-ops.sql]
modes: [cross]
oidc_users:
  google: {sub: google-sub-google-only, name: グーグル 五郎, email: google-only@example.com, email_verified: true}
steps:
  - name: start-google-only
    request:
      method: GET
      path: /api/auth/oidc/authorize?provider=google
    capture: {authURL: text}
    expect: {status: 200}
  - name: authorize-google-only
    request:
      method: GET
      url: '{authURL}'
    capture: {code: 'header:Location?code', state: 'header:Location?state'}
    expect: {status: 302}
  - name: callback-google-only
    request:
      method: GET
      path: /api/auth/oidc/callback?code={code}&state={state}
    expect: {status: 302}
  # メールアドレスとパスワードを設定する。確認のメールが届く
  - name: set-email-and-password
    request:
      method: POST
      path: /api/users/me/email-password
      csrf: true
      json: {email: google-only-set@example.com, password: Passw0rd!, confirmPassword: Passw0rd!}
    capture: {link: 'mail:/email/verify#(\S+)'}
    expect: {status: 200}
  # 届いたリンクを、設定した版と違う版に送って確認する
  - name: verify-set-email
    to: other
    request:
      method: POST
      path: /api/auth/email-verification/verify
      json: {token: "{link}"}
    expect: {status: 200, values: {'$.result': VERIFIED}}
  # 確認した版に、設定したメールアドレスとパスワードでログインする
  - name: login-with-set-email
    request:
      method: POST
      path: /api/auth/login
      json: {email: google-only-set@example.com, password: Passw0rd!}
    expect: {status: 200}
  # パスワードを変え、変えた版と違う版に、新しいパスワードでログインする
  - name: change-password
    request:
      method: PATCH
      path: /api/users/me/password
      csrf: true
      json: {nowPassword: Passw0rd!, newPassword: Changed1Pass}
    expect: {status: 204}
  - name: login-new-password
    to: other
    request:
      method: POST
      path: /api/auth/login
      json: {email: google-only-set@example.com, password: Changed1Pass}
    expect: {status: 200}
  - name: get-user-info-after-change
    request:
      method: GET
      path: /api/users/me
    expect: {status: 200, values: {'$.email': google-only-set@example.com, '$.emailVerified': true}}
