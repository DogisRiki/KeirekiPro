# メールアドレスとパスワードの設定の筋書き。
# パスワードを持つ利用者(user1)は、今のパスワードが無い要求と合わない要求で断られ、メールアドレスを付けた要求は
# すでにメールアドレスを持つので断られ、今のパスワードを付けてパスワードだけを設定できる。
# パスワードもメールアドレスも持たない利用者(google-only)は、Google のアカウントでログインし、空のメールアドレス、
# a@b、使われているメールアドレス、パスワードの入力の誤り、2つのパスワードが合わない要求で断られてから、
# 新しいメールアドレスとパスワードを設定する。届いた確認のリンクを確認に送り、設定したメールアドレスとパスワードで
# ログインできるところまで比べる。
name: users-email-password
group: 2
fixtures: [users/basic.sql, users/auth-users.sql, users/users-ops.sql]
modes: [compare]
oidc_users:
  google: {sub: google-sub-google-only, name: グーグル 五郎, email: google-only@example.com, email_verified: true}
steps:
  # パスワードを持つ利用者
  - name: login-user1
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: Passw0rd!}
    expect: {status: 200}
  # 今のパスワードが無い要求
  - name: set-without-current-password
    request:
      method: POST
      path: /api/users/me/email-password
      csrf: true
      json: {password: NewPass1word, confirmPassword: NewPass1word}
    expect: {status: 400}
  # 今のパスワードが合わない要求
  - name: set-with-wrong-current-password
    request:
      method: POST
      path: /api/users/me/email-password
      csrf: true
      json: {password: NewPass1word, confirmPassword: NewPass1word, currentPassword: Wrong0rd!}
    expect: {status: 400}
  # すでにメールアドレスを持つ利用者が、メールアドレスを付けて送る要求
  - name: set-email-already-set
    request:
      method: POST
      path: /api/users/me/email-password
      csrf: true
      json: {email: user1-new@example.com, password: NewPass1word, confirmPassword: NewPass1word, currentPassword: Passw0rd!}
    expect: {status: 400}
  # 今のパスワードを付けて、パスワードだけを設定する
  - name: set-password-with-current-password
    request:
      method: POST
      path: /api/users/me/email-password
      csrf: true
      json: {password: NewPass1word, confirmPassword: NewPass1word, currentPassword: Passw0rd!}
    expect: {status: 200}
  - name: login-user1-new-password
    request:
      method: POST
      path: /api/auth/login
      json: {email: user1@example.com, password: NewPass1word}
    expect: {status: 200}
  # パスワードもメールアドレスも持たない利用者。Google のアカウントでログインする
  - name: start-google-only
    request:
      method: GET
      path: /api/auth/oidc/authorize?provider=google
    capture: {authURL: text}
    expect: {status: 200}
  - name: authorize-google-only
    request:
      method: GET
      url: '{authURL}'
    capture: {code: 'header:Location?code', state: 'header:Location?state'}
    expect: {status: 302}
  - name: callback-google-only
    request:
      method: GET
      path: /api/auth/oidc/callback?code={code}&state={state}
    expect: {status: 302}
  # 空のメールアドレス
  - name: set-empty-email
    request:
      method: POST
      path: /api/users/me/email-password
      csrf: true
      json: {email: '', password: Passw0rd!, confirmPassword: Passw0rd!}
    expect: {status: 400}
  # 形の誤ったメールアドレス
  - name: set-invalid-email
    request:
      method: POST
      path: /api/users/me/email-password
      csrf: true
      json: {email: a@b, password: Passw0rd!, confirmPassword: Passw0rd!}
    expect: {status: 400}
  # ほかの利用者が使っているメールアドレス
  - name: set-used-email
    request:
      method: POST
      path: /api/users/me/email-password
      csrf: true
      json: {email: user2@example.com, password: Passw0rd!, confirmPassword: Passw0rd!}
    expect: {status: 400}
  # パスワードの入力の誤り(短く、数字を含まない)
  - name: set-invalid-password
    request:
      method: POST
      path: /api/users/me/email-password
      csrf: true
      json: {email: google-only-set@example.com, password: short, confirmPassword: short}
    expect: {status: 400}
  # 2つのパスワードが合わない要求
  - name: set-confirm-mismatch
    request:
      method: POST
      path: /api/users/me/email-password
      csrf: true
      json: {email: google-only-set@example.com, password: Passw0rd!, confirmPassword: Other0rd!}
    expect: {status: 400}
  # メールアドレスとパスワードを設定する。確認のメールが届く
  - name: set-email-and-password
    request:
      method: POST
      path: /api/users/me/email-password
      csrf: true
      json: {email: google-only-set@example.com, password: Passw0rd!, confirmPassword: Passw0rd!}
    capture: {link: 'mail:/email/verify#(\S+)'}
    expect: {status: 200, fields: [$.email]}
  - name: verify-set-email
    request:
      method: POST
      path: /api/auth/email-verification/verify
      json: {token: "{link}"}
    expect: {status: 200, fields: [$.result]}
  - name: get-user-info-after-verify
    request:
      method: GET
      path: /api/users/me
    expect: {status: 200}
  # 設定したメールアドレスとパスワードでログインできる
  - name: login-with-set-email
    request:
      method: POST
      path: /api/auth/login
      json: {email: google-only-set@example.com, password: Passw0rd!}
    expect: {status: 200}
