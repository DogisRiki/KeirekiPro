- id: CB-026
  group: 1
  変えた動き: プリフライトでない OPTIONS の要求への答え
  java: 経路のある URL(例 /api/auth/login と /api/resumes)には、200 と空の本文を返す。経路の無い URL(例 /api/admin/users)には、500 と「予期せぬエラーが発生しました。」を返す
