- id: CB-004
  group: 4
  変えた動き: PDF の文字の位置と、写したときの「〜」
  java: openhtmltopdf で文字を配置し、PDF から文字を写すと「～」(U+FF5E)になる
  go: Chromium で文字を配置するので位置が 1〜2pt ずれ、写すと「〜」(U+301C)のままになる
  画面に影響が無い理由: PDF の文字の位置が 1〜2pt ずれる。PDF から写した文字が「～」(U+FF5E)でなく「〜」(U+301C)になる。頁の数、フォント、文字の大きさ、表の色、改頁の位置、頁ごとの文字は、要件10の受入基準1に書いた範囲で Java 版と同じである。所有者が 2026-11-07 に受け入れた。PDF の文字の位置と「〜」のほかの、Go 版の PDF の違い(頁の大きさ、PDF から写した字、長い文の折り返し)は、CB-056 から CB-058 に載せた
  # match を書かない。PDF の比べ方が、2pt までの位置のずれと「～」と「〜」の違いを許す。
  # PDF の違いを match で許すと、ほかの PDF の違いも許してしまう。

