  go: 項目が無い要求を空の文字列の要求と同じに検査するので、newPassword が無い要求と password が無い要求に「8文字以上」と「英小文字、英大文字、数字」の文言を足す。password が無く空でない confirmPassword がある要求には、confirmPassword に一致の文言を足す。パスワードの変更の nowPassword が無い要求は、どちらの版も「入力必須」の文言だけを返す
  画面に影響が無い理由: 画面はどの項目も文字列で送り、項目を省かないので、画面の動きは変わらない。所有者が 2026-11-14 に受け入れた
