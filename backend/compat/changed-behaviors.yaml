  java: 名前と2段階認証の設定を確かめる前に画像を置くので、要求を 400 で断っても、置き場所の画像が送った画像に替わる
  go: 名前と2段階認証の設定を確かめてから画像を置くので、要求を 400 で断ったときは、置き場所の画像が替わらない
  画面に影響が無い理由: 入力の誤りで断られた保存のあとに、プロフィール画像が替わらなくなる。所有者が 2026-11-27 に直すと決めた(Issue #971)
  # 利用者の情報の変更の筋書き(users/update-user-info.yaml)は、画像と空の名前を一緒に送るので、Java 版だけが画像を置く。
  # match は、両方の版が 400 で断った、名前と画像と2段階認証の設定の変更の要求の、画像の置き場所の違いだけを許す。
  # Go 版が画像を置かないことは internal/users/update_integration_test.go が確かめる。
  match:
    operation: updateUserInfo
    target: s3
    status: 400

- id: CB-077
  group: 2
  変えた動き: 名前と画像と2段階認証の設定の変更と、パスワードの変更での、利用者の行の書き込み
  java: 利用者の行と、役割と連携の行を、トランザクションを使わずに書く。途中で失敗すると、役割と連携の行が消えたまま残ることがある
  go: 利用者の行と、役割と連携の行を、1つのトランザクションで書く。途中で失敗したときは、保存の前のまま残る
  画面に影響が無い理由: データベースとのやり取りが途中で失敗したときだけ違いが出て、Go 版では利用者の役割と連携が消えない。所有者が 2026-11-27 に直すと決めた(Issue #971)
  # match を書かない。比べる検査は、データベースとのやり取りを途中で失敗させない。

- id: CB-078
  group: 3
  変えた動き: 経歴書の答えの、プロジェクトの総合テストと運用・保守の工程
  java: 答えの systemTest の鍵に運用・保守の値を、maintenance の鍵に総合テストの値を入れて答える
  go: 答えの systemTest の鍵に総合テストの値を、maintenance の鍵に運用・保守の値を入れて答える
  画面に影響が無い理由: 画面の総合テストと運用・保守のチェックが、利用者が保存したとおりに出る。Java 版では、2つのチェックが入れ替わって出る。PDF と Markdown の出力とバックアップのファイルは、どちらの版も入れ替えないので変わらない。所有者が 2026-11-27 に直すと決めた(Issue #972)
  # match は、経歴書を返す操作の、プロジェクトの工程の2つの鍵の違いだけを許す。バックアップの答えは、どちらの版も
  # 入れ替えないので、$.resume.projects の下には当てない。Go 版の答えは internal/httpapi/resumes_test.go が確かめる。
  match:
    - operation: "*"
      target: body
      path: $.projects[*].process.systemTest
    - operation: "*"
      target: body
      path: $.projects[*].process.maintenance

