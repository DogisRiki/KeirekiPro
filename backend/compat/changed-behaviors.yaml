# 変えた動きの一覧。Go 版が Java 版と違う動きをするところと、比べる検査がその違いを許す範囲(match)を書く。
# 形は .kiro/specs/backend-go-replacement/design.md の「変えた動きの一覧の形」のとおりである。
# match は、1つの形か、並びの形で書く。match の無い項目は、記録だけの項目である。比べる検査は、match に当たらない違いで止まる。
# match で違いを許す範囲は、できるだけ狭く書く。
#
# 項目は次の3種類で、「画面に影響が無い理由」に書くことは種類ごとに違う。
# - Claude が意図して変えた、利用者が目にしない動き: 画面に影響が無い理由を書く。
# - 所有者が Issue #445 の決めた方式で Java 版から変えると決めた4つの動き(CB-001 から CB-004): 画面か出力に違いが出る動きでは、
#   どこが変わるかと、所有者が受け入れたことを書く。画面にも出力にも違いが出ない動きでは、画面に影響が無い理由を書く。
# - まとまりの spec を進める途中で、所有者が受け入れた違い: どこが変わるかと、所有者が受け入れた日を「所有者が YYYY-MM-DD に受け入れた」の形で書く。
#
# 値の中に、空白のあとの # があるときは、値を引用符で囲む。YAML は、引用符で囲んでいない値の中の、空白のあとの # から行末までを注記として読むためである。

- id: CB-001
  group: 3
  変えた動き: 日本語の名前の並び順
  java: ポートフォリオ、SNS、自己PR を、Java の日本語の並べ替えの規則(java.text.Collator)で並べる
  go: ポートフォリオ、SNS、自己PR を、golang.org/x/text/collate の日本語の規則で並べる。半角のカタカナの名前(ｱｲｳ)は、Java 版が最後に並べるのに対して、英字の名前とひらがなの名前のあいだに並べる
  画面に影響が無い理由: "画面、PDF、Markdown、バックアップの並び順が変わる。所有者が 2026-11-07 に受け入れた(Issue #445 の決めた方式)"
  # 経歴書の JSON の並びは、経歴書を返すすべての操作で順だけの違いを許す。バックアップの JSON では、並びが resume の下にある。
  match:
    - operation: "*"
      target: body
      path: $.portfolios[*]
      order_only: true
    - operation: "*"
      target: body
      path: $.snsPlatforms[*]
      order_only: true
    - operation: "*"
      target: body
      path: $.selfPromotions[*]
      order_only: true
    - operation: backupResume
      target: body
      path: $.resume.portfolios[*]
      order_only: true
    - operation: backupResume
      target: body
      path: $.resume.snsPlatforms[*]
      order_only: true
    - operation: backupResume
      target: body
      path: $.resume.selfPromotions[*]
      order_only: true

- id: CB-002
  group: 2
  変えた動き: プロフィール画像の受け入れ
  java: 中身が BMP と WBMP のファイルと、途中で切れた JPEG を受け入れる
  go: 中身が PNG、JPEG、GIF のファイルだけを受け入れ、途中で切れた JPEG を断る
  画面に影響が無い理由: 画面は PNG、JPEG、GIF の選び方を案内しており、ほかのファイルを選んだときは画面にエラーが出る。所有者が 2026-11-07 に受け入れた
  # match を書かない。match の形では、操作とステータスの違いを、送ったファイルの中身で絞れない。
  # 操作で許すと、PNG を送ったときのステータスの違いも許してしまう。比べる検査は、PNG、JPEG、GIF のほかのファイルを送らない。

