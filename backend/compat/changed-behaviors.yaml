  go: Chromium で文字を配置するので位置が 1〜2pt ずれ、写すと「〜」(U+301C)のままになる
  画面に影響が無い理由: 配置、フォント、文字の大きさ、表の色、改頁の位置は同じである。所有者が 2026-11-07 に受け入れた
