  go: Java 版と同じ文字を作れないので、利用者の情報を読めない失敗として、誤りの画面に移す
  画面に影響が無い理由: GitHub は利用者の id を整数で返すので、利用者がログインするときの動きは変わらない。所有者が 2026-11-12 に受け入れた
  # match を書かない。偽のログインのサービスは id を整数で返す。

- id: CB-024
  group: 1
  変えた動き: 開発環境の /actuator/health の中身
  java: 開発環境では、データベースとディスクの空きの詳しい状態(components)と、liveness と readiness の組(groups)も返す
  go: どの環境でも {"status":"UP"} だけを返す
  画面に影響が無い理由: 画面はこの経路を呼ばない。本番の Java 版は詳しい状態を出さず {"status":"UP"} だけを返すので、ALB とコンテナの確かめの動きも変わらない。所有者が 2026-11-12 に受け入れた
  # 仕様書の操作でない経路の段は、操作の名前を持たないので、すべての操作で許す。仕様書の操作の答えは、どれも先頭に components と groups を持たない。
  match:
    - operation: "*"
      target: body
      path: $.components
      status: 200
    - operation: "*"
      target: body
      path: $.groups
      status: 200

- id: CB-025
  group: 1
  変えた動き: 同じ名前の連携の行を2つ持つ利用者の保存
  java: 利用者を読むときに、連携の行を小文字にした連携の名前でまとめ、同じ名前の行のうち後に読んだ1つだけを残す。保存では連携の行をすべて消してから入れ直すので、同じ名前のほかの行は消える
  go: 利用者を読むときに、連携の行を行の ID でまとめるので、同じ名前の行をすべて残し、保存のあとも残す
  画面に影響が無い理由: Java 版も Go 版も、1人の利用者に同じ名前の連携の行を2つ作らないので、画面から使える利用者にこの違いは出ない。所有者が 2026-11-12 に受け入れた
  # match を書かない。比べる検査の初期のデータと筋書きは、同じ名前の連携の行を2つ持つ利用者を作らないので、この違いは出ない。

- id: CB-026
  group: 1
  変えた動き: プリフライトでない OPTIONS の要求への答え
  java: 経路のある URL(例 /api/auth/login と /api/resumes)には、200 と空の本文を返す。経路の無い URL(例 /api/admin/users)には、500 と「予期せぬエラーが発生しました。」を返す
  go: 経路のある URL には、405 と文字の本文「Method Not Allowed」を返す。経路の無い URL には、404 と文字の本文「404 page not found」を返す
  画面に影響が無い理由: 画面は OPTIONS を自分で送らない。ブラウザが送る OPTIONS は Origin と Access-Control-Request-Method を付けたプリフライトで、プリフライトへの答えはどちらの版も同じなので、画面の動きは変わらない。所有者が 2026-11-12 に受け入れた
  # match を書かない。違いを操作で許すと、同じ経路のほかの要求の違いも許してしまうので、比べる検査はプリフライトでない OPTIONS を送らない。
