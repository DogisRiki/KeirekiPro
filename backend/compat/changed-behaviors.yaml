  java: 区切りの間の桁が足りない値(1-2-3-4-5)と、全角の数字を含む値を、経歴書の ID と項目の ID の両方で読む。片側にだけ半角の空白のある値と、先頭にタブのある値を、項目の ID でだけ読む。前後に1つずつ空白のある経歴書の ID には 404 で答える。波括弧で囲んだ値と、urn:uuid で始まる値と、区切りの「-」の無い32桁の値は読めない
