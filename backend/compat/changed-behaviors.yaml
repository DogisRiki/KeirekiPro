# 変えた動きの一覧。Go 版が Java 版と違う動きをするところと、比べる検査がその違いを許す範囲(match)を書く。
# 形は .kiro/specs/backend-go-replacement/design.md の「変えた動きの一覧の形」のとおりである。
# match は、1つの形か、並びの形で書く。match の無い項目は、記録だけの項目である。比べる検査は、match に当たらない違いで止まる。
# match で違いを許す範囲は、できるだけ狭く書く。

- id: CB-001
  group: 3
  変えた動き: 日本語の名前の並び順
  java: ポートフォリオ、SNS、自己PR を、Java の日本語の並べ替えの規則(java.text.Collator)で並べる
  go: ポートフォリオ、SNS、自己PR を、golang.org/x/text/collate の日本語の規則で並べる
  画面に影響が無い理由: 画面と PDF の並び順が変わる。所有者が 2026-11-07 に受け入れた(Issue #445 の決めた方式)
  # 経歴書の JSON の並びは、経歴書を返すすべての操作で順だけの違いを許す。バックアップの JSON では、並びが resume の下にある。
  match:
    - operation: "*"
      target: body
      path: $.portfolios[*]
      order_only: true
    - operation: "*"
      target: body
      path: $.snsPlatforms[*]
      order_only: true
    - operation: "*"
      target: body
      path: $.selfPromotions[*]
      order_only: true
    - operation: backupResume
      target: body
      path: $.resume.portfolios[*]
      order_only: true
    - operation: backupResume
      target: body
      path: $.resume.snsPlatforms[*]
      order_only: true
    - operation: backupResume
      target: body
      path: $.resume.selfPromotions[*]
      order_only: true

- id: CB-002
  group: 2
  変えた動き: プロフィール画像の受け入れ
  java: 中身が BMP と WBMP のファイルと、途中で切れた JPEG を受け入れる
  go: 中身が PNG、JPEG、GIF のファイルだけを受け入れ、途中で切れた JPEG を断る
  画面に影響が無い理由: 画面は PNG、JPEG、GIF の選び方を案内しており、ほかのファイルを選んだときは画面にエラーが出る。所有者が 2026-11-07 に受け入れた
  # match を書かない。match の形では、操作とステータスの違いを、送ったファイルの中身で絞れない。
  # 操作で許すと、PNG を送ったときのステータスの違いも許してしまう。比べる検査は、PNG、JPEG、GIF のほかのファイルを送らない。

- id: CB-003
  group: 4
  変えた動き: 入力の足りない経歴書の書き出し
  java: 要求の Accept に application/json が無いと、401 と空の本文を返す
  go: Accept によらず、400 と足りない項目の一覧を返す
  画面に影響が無い理由: 画面は Accept に application/json を付けて送るので、画面の動きは変わらない。所有者が 2026-11-07 に受け入れた
