- id: CB-082
  group: 3
  変えた動き: 経歴書の出力とバックアップの答えの Content-Disposition
  java: Spring の ContentDisposition で、ASCII に書き換えた名前の filename と、filename* を書く。filename では、ASCII でない字を、字を分解して ASCII の部分だけを残す規則で書き換える。filename* では、RFC 5987 の attr-char を % で書かない
  go: ASCII でない字と、" と \ と、表示できない字を _ に替えた名前の filename と、英数字と - _ . ~ のほかの字をすべて % で書いた filename* を書く。UTF-8 として正しくないバイトは ? に替える
  画面に影響が無い理由: 画面は filename* を読み、% の書き方を解いてファイルの名前にするので、どちらの版も同じファイルの名前で保存する。Spring の書き方を写すのをやめた(Issue #969)
  # match は、出力の3つの操作の Content-Disposition の違いだけを許す。Go 版の答えは exportdisposition_test.go で確かめる。
  match:
    - operation: exportResume
      target: header
      path: Content-Disposition
    - operation: exportResumeWithSettings
      target: header
      path: Content-Disposition
    - operation: backupResume
      target: header
      path: Content-Disposition
