  # match を書かない。比べる検査はこの要求を送らない。

- id: CB-020
  group: 1
  変えた動き: 本文の項目が無い要求の入力の誤り
  java: 項目が無いと値を null として検査し、@NotBlank の文言だけを返す。password が無い要求には「入力必須」の文言だけを、confirmPassword だけが無い要求には「入力必須」の文言だけを返す
  go: 項目が無い要求を空の文字列の要求と同じに検査するので、password が無い要求に「8文字以上」と「英小文字、英大文字、数字」の文言を足し、confirmPassword だけが無い要求に「一致していません」の文言を足す
  画面に影響が無い理由: 画面はどの項目も文字列で送り、項目を省かないので、画面の動きは変わらない。所有者が 2026-11-12 に受け入れた
  # match を書かない。比べる検査は項目を省いた要求を送らない。

- id: CB-021
  group: 1
  変えた動き: パスワードの対になっていないサロゲートの数え方
  java: 要求の JSON の "\ud800" のような対になっていないサロゲートを、半角72文字の上限の検査で1バイトと数える
  go: 対になっていないサロゲートを U+FFFD に置き換え、3バイトと数える。そのため、72バイトの境目の近くのパスワードで、入力の誤りになるかが変わることがある
  画面に影響が無い理由: ブラウザは対になっていないサロゲートを JSON に書かないので、画面の動きは変わらない。所有者が 2026-11-12 に受け入れた
  # match を書かない。比べる検査は対になっていないサロゲートを送らない。

- id: CB-022
  group: 1
  変えた動き: ログインの状態の値とログインを続けるための値の役割の並び
  java: 役割を順の決まらない集合で持つので、USER と ADMIN を持つ利用者の roles の並びが JVM ごとに変わる
  go: roles を、いつも USER、ADMIN の順に並べる
  画面に影響が無い理由: 画面は roles を読まない。どちらの版も、roles に ADMIN が含まれるかだけで管理者の経路を許し、並びの順を使わないので、画面の動きは変わらない。所有者が 2026-11-12 に受け入れた
  # 利用者の操作の筋書きの管理者(users/users-ops.sql)は役割 USER と ADMIN を持つので、ログインを続けるための値の
  # ハッシュの roles の並びが違うことがある。match は、この並びの順だけの違いを許す。ログインの状態の値は Cookie の値として
  # 比べないので、match を書かない。利用者の情報の答えの roles の並びは CB-028 が許す。
  match:
    - operation: "*"
      target: redis
      path: refresh-token:*
      field: roles
      order_only: true

- id: CB-023
  group: 1
