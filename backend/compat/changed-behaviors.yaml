- id: CB-010
  group: 1
  変えた動き: 開発環境の CORS の許す送り元
  java: 開発環境の CORS の許す送り元は、画面の http://localhost:5173 だけである
  go: 開発環境とテストの環境の CORS の許す送り元に、API の説明画面の http://localhost:8082 を足す。開発者が説明画面の「Try it out」で Go 版を呼べるようにするためである
  画面に影響が無い理由: 本番の許す送り元は、どちらの版も https://app.keirekipro.click だけなので、利用者の画面の動きは変わらない。所有者が 2026-11-10 に了承した方針で生じる違いである
  # match を書かない。比べる検査は要求に Origin を付けないので、この違いは出ない。

- id: CB-011
  group: 1
  変えた動き: 入力の誤りの文言の並び
  java: 1つの項目に2つ以上の誤りがあるとき、項目の文言の並びが、Hibernate Validator の誤りの集まりの順で決まり、要求ごとに変わることがある
  go: 1つの項目に2つ以上の誤りがあるとき、項目の文言を、Java 版の要求の型に注釈を書いた順に並べる
  画面に影響が無い理由: 画面は項目ごとの文言を並びのまま出すので、文言の順だけが変わり、出る文言は変わらない。所有者が 2026-11-12 に受け入れた
  # 2つ以上の文言を持ちうる項目だけを並べる。ログインと確認のメールの送り直し(ログインの画面から)と2段階認証の確認の項目は、
  # @NotBlank の文言だけを持つので並べない。
  match:
    - operation: registerUser
      target: body
      path: $.errors.email[*]
      order_only: true
    - operation: registerUser
      target: body
      path: $.errors.username[*]
      order_only: true
    - operation: registerUser
      target: body
      path: $.errors.password[*]
      order_only: true
    - operation: registerUser
      target: body
      path: $.errors.confirmPassword[*]
      order_only: true
    - operation: resetPassword
      target: body
      path: $.errors.password[*]
      order_only: true
    - operation: resetPassword
      target: body
      path: $.errors.confirmPassword[*]
      order_only: true
    - operation: requestPasswordReset
      target: body
      path: $.errors.email[*]
      order_only: true
    - operation: verifyEmail
      target: body
      path: $.errors.token[*]
      order_only: true
    - operation: resendEmailVerification
      target: body
      path: $.errors.token[*]
      order_only: true

- id: CB-012
  group: 1
  変えた動き: Google と GitHub のどちらでログインするかの指定が無い、ログインの開始の要求
  java: 問い合わせに provider が無い GET /api/auth/oidc/authorize に、500 と「予期せぬエラーが発生しました。」を返す
  go: 400 と、文言「入力エラーがあります。」と空の errors を返す
  画面に影響が無い理由: 画面はログインの開始の要求に必ず provider を付けるので、画面の動きは変わらない。所有者が 2026-11-12 に受け入れた
  # 状態の番号の違いは、要求の中身で絞れないので、操作で許す。Google と GitHub のログインの筋書きの開始の段の状態の番号は、
  # 版をまたぐ検査が段ごとの期待と比べるので、開始の段の状態の番号の誤りは、版をまたぐ検査が見つける。
  match:
    - operation: startOidcAuthorization
      target: status
    - operation: startOidcAuthorization
      target: body
      path: $.message

- id: CB-013
  group: 1
  変えた動き: 対象の外の provider でのログインの開始の要求
  java: 'provider が google と github のどちらでもない要求に、Redis にキーが oidc:provider:、oidc:state:、oidc:code_verifier: で始まる3つの記録を置いたあとで、500 と「予期せぬエラーが発生しました。」を返し、3つの記録を残す'
  go: Redis に記録を置く前に、400 と、文言「入力エラーがあります。」と空の errors を返す
  画面に影響が無い理由: 画面は google か github だけを provider に付けるので、画面の動きは変わらない。所有者が 2026-11-12 に受け入れた
  # match を書かない。Redis の違いを操作で許すと、開始の段の Redis の記録の違いをすべて許してしまうので、比べる検査はこの要求を送らない。

