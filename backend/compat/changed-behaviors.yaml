  画面に影響が無い理由: Google と GitHub は code と state を1つずつ付けて戻すので、利用者がログインするときの動きは変わらない。所有者が 2026-11-12 に受け入れた
  # match を書かない。戻り先の状態の番号と Location の違いを操作で許すと、戻り先の移る先の違いをすべて許してしまうので、比べる検査はこの要求を送らない。

