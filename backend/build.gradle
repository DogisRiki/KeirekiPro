// Flyway Gradleプラグイン(10系)はDB別モジュールをbuildscriptクラスパスに要求する。
// バージョンは gradle/libs.versions.toml の [versions] flyway を参照し、
// 下の plugins ブロックと同じ値になるようにしている。
// buildscript から参照できるのは [versions] だけで、[libraries] は参照できない
// (gradle/gradle#18105)。
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.flywaydb:flyway-database-postgresql:${libs.versions.flyway.get()}"
    }
}

// バージョンは gradle/libs.versions.toml に集約している。ここに version を直書きしない
plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    id 'checkstyle'
    id 'jacoco'
    id 'pmd'
    alias(libs.plugins.spotless)
    alias(libs.plugins.spotbugs)
    alias(libs.plugins.pitest)
    alias(libs.plugins.flyway)
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// ArchUnit が junit-bom 5.14.4 を持ち込み junit-platform-launcher が 1.14.4 になる一方、
// Spring Boot は junit-platform-engine を 1.12.2 に固定するため、両者が噛み合わず
// テスト実行時に NoClassDefFoundError: org/junit/platform/engine/OutputDirectoryCreator になる。
// Spring Boot の管理バージョンを上書きして揃える。
//
// 解除の判定: Spring Boot を上げたらこの行を削除し、次を実行する。
//   docker compose exec -w /home/spring/app backend ./gradlew test
// 通れば削除したままでよい。落ちればまだ必要なので戻す。
ext['junit-jupiter.version'] = '5.14.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation libs.mybatis.starter
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        // JUnit Vintage（JUnit4）を除外
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation libs.mybatis.test.starter
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation libs.archunit.junit5
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation libs.springdoc.openapi.starter.webmvc.ui
    implementation libs.openhtmltopdf.core
    implementation libs.openhtmltopdf.pdfbox
    implementation libs.java.jwt

    implementation platform(libs.spring.cloud.aws.dependencies)
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-ses'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation platform(libs.testcontainers.bom)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:localstack'
    implementation libs.freemarker
    implementation libs.commons.validator
    implementation libs.mybatis.postgresql.typehandlers
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
}

configurations.configureEach {
    exclude group: 'commons-logging', module: 'commons-logging'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

// 品質ゲート定義(checkstyle/jacoco/spotless/spotbugs/カバレッジ閾値/checkタスク構成)は
// CODEOWNERS保護対象の gradle/quality.gradle に分離している。この行を削除しないこと(guardrails CIが検証)。
apply from: 'gradle/quality.gradle'

// ローカルDBに対するマイグレーション確認用(./gradlew flywayInfo 等)。
// 接続先は開発用コンテナのデフォルト(シークレットは置かない。環境変数で上書き可能)
flyway {
    url = "jdbc:postgresql://${System.getenv('DB_HOST') ?: 'db'}:${System.getenv('DB_PORT') ?: '5432'}/${System.getenv('DB_NAME') ?: 'keireki_pro'}"
    user = System.getenv('DB_USERNAME') ?: 'postgres'
    password = System.getenv('DB_PASSWORD') ?: 'postgres'
    locations = ['filesystem:src/main/resources/db/migration']
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', 'src/main/java']
        }
    }
}
