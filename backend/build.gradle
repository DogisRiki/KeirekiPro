// Flyway Gradleプラグイン(10系)はDB別モジュールをbuildscriptクラスパスに要求する。
// バージョンは gradle/libs.versions.toml の [versions] flyway を参照し、
// 下の plugins ブロックと同じ値になるようにしている。
// buildscript から参照できるのは [versions] だけで、[libraries] は参照できない
// (gradle/gradle#18105)。
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.flywaydb:flyway-database-postgresql:${libs.versions.flyway.get()}"

        // ビルド用プラグイン(Flyway / Spring Boot)が持ち込む依存の版を引き上げる(#361)。
        // buildscript のクラスパスには Spring Boot の BOM が効かないため、下の ext の上書きとは
        // 別にここで指定する。版は本番側の上書きと同じ [versions] を参照する。
        //   jackson-databind 2.21.4 -> CVE-2026-54515 / CVE-2026-59889 / GHSA-mhm7-754m-9p8w
        //   commons-lang3    3.16.0 -> CVE-2025-48924
        //   httpclient5      5.5.2  -> CVE-2026-64607
        //   httpcore5 5.3.6 -> CVE-2026-54399 / httpcore5-h2 5.3.6 -> CVE-2026-54428
        // 解除の判定: ./gradlew -q buildEnvironment で、制約を外しても各版がここ以上なら削除する。
        constraints {
            classpath "com.fasterxml.jackson.core:jackson-databind:${libs.versions.jackson.bom.get()}"
            classpath "org.apache.commons:commons-lang3:${libs.versions.commons.lang3.get()}"
            classpath "org.apache.httpcomponents.client5:httpclient5:${libs.versions.httpclient5.get()}"
            classpath "org.apache.httpcomponents.core5:httpcore5:${libs.versions.httpcore5.get()}"
            classpath "org.apache.httpcomponents.core5:httpcore5-h2:${libs.versions.httpcore5.get()}"
        }
    }
}

// バージョンは gradle/libs.versions.toml に集約している。ここに version を直書きしない
plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    id 'checkstyle'
    id 'jacoco'
    id 'pmd'
    alias(libs.plugins.spotless)
    alias(libs.plugins.spotbugs)
    alias(libs.plugins.pitest)
    alias(libs.plugins.flyway)
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// ArchUnit が junit-bom 5.14.4 を持ち込み junit-platform-launcher が 1.14.4 になる一方、
// Spring Boot は junit-platform-engine を 1.12.2 に固定するため、両者が噛み合わず
// テスト実行時に NoClassDefFoundError: org/junit/platform/engine/OutputDirectoryCreator になる。
// Spring Boot の管理バージョンを上書きして揃える。
//
// 解除の判定: Spring Boot を上げたらこの行を削除し、次を実行する。
//   docker compose exec -w /home/spring/app backend ./gradlew test
// 通れば削除したままでよい。落ちればまだ必要なので戻す。
ext['junit-jupiter.version'] = '5.14.4'

// Spring Boot 3.5.16 の BOM は netty 4.1.135.Final と postgresql 42.7.11 を管理しており、
// どちらも修正版が公開済みの HIGH を含む(#220)。3.5.x に後継が無く、4.1.0 の BOM でも
// postgresql は 42.7.11 のままのため、Spring Boot を上げても解消しない。
// 上流が追いつくまで、ここで管理バージョンを上書きする。
//
//   netty      CVE-2026-59901 / CVE-2026-55831 / CVE-2026-55833 /
//              CVE-2026-56745 / CVE-2026-56819  -> 4.1.136.Final 以降で修正
//   postgresql CVE-2026-54291                   -> 42.7.12 以降で修正
//   tomcat     CVE-2026-65182 / CVE-2026-65905 / CVE-2026-68525(CRITICAL)
//              -> 10.1.58 以降で修正(10.1.58 は Maven Central 未公開のため 10.1.59 を指定)
//
// いずれも同じ系列の最新パッチを指定している。netty は Lettuce 経由、
// postgresql は JDBC ドライバとして、tomcat は spring-boot-starter-web の
// 組み込みサーバ(BOM 3.5.16 の管理版は 10.1.55)として本番イメージに入る。
//
// 以下の4つも同じ理由で上書きする(#358)。BOM 3.5.16 の管理版に修正版が公開済みの
// 脆弱性があり、いずれも productionRuntimeClasspath に入る。
//
//   jackson-bom    CVE-2026-54515 / CVE-2026-59889 /
//                  GHSA-mhm7-754m-9p8w              -> 2.21.5 以降で修正(BOM は 2.21.4)
//   opentelemetry  CVE-2026-45292                   -> 1.62.0 以降で修正(BOM は 1.49.0)
//   log4j2         CVE-2026-49844                   -> 2.25.5 以降で修正(BOM は 2.24.3)
//   commons-lang3  CVE-2025-48924                   -> 3.18.0 以降で修正(BOM は 3.17.0)
//
// jackson は同じ系列の最新パッチを、opentelemetry と log4j2 は修正の入った最小の版を指定している。
// commons-lang3 は最新の 3.20.0 を指定している。3.20.0 を要求する推移的依存があり、
// 3.18.0 にするとその依存に古い版を押し付けることになるため。
// opentelemetry は micrometer-tracing-bridge-otel と opentelemetry-exporter-otlp 経由、
// log4j-api は spring-boot-starter-logging の log4j-to-slf4j 経由で入る。
//
// httpclient5 / httpcore5 は本番には入らないが、BOM の管理版が checkstyle / pmd / spotbugs の
// 実行時依存(Saxon の xmlresolver 経由)にも適用されるため、同じ方法で上書きする(#361)。
//
//   httpclient5    CVE-2026-64607                   -> 5.6.3 以降で修正(BOM は 5.5.2)
//   httpcore5      CVE-2026-54399 / CVE-2026-54428  -> 5.4.3 以降で修正(BOM は 5.3.6)
//
// いずれも修正の入った系列の最新パッチを指定している。
//
// 解除の判定: Spring Boot を上げたとき、その BOM の netty.version /
// postgresql.version / tomcat.version / jackson-bom.version / opentelemetry.version /
// log4j2.version / commons-lang3.version / httpclient5.version / httpcore5.version が
// ここの値以上なら、該当する行と libs.versions.toml の対応する [versions] を削除する。
ext['netty.version'] = libs.versions.netty.get()
ext['postgresql.version'] = libs.versions.postgresql.get()
ext['tomcat.version'] = libs.versions.tomcat.get()
ext['jackson-bom.version'] = libs.versions.jackson.bom.get()
ext['opentelemetry.version'] = libs.versions.opentelemetry.get()
ext['log4j2.version'] = libs.versions.log4j2.get()
ext['commons-lang3.version'] = libs.versions.commons.lang3.get()
ext['httpclient5.version'] = libs.versions.httpclient5.get()
ext['httpcore5.version'] = libs.versions.httpcore5.get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation libs.mybatis.starter
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        // JUnit Vintage（JUnit4）を除外
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation libs.mybatis.test.starter
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation libs.archunit.junit5
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation libs.springdoc.openapi.starter.webmvc.ui
    implementation libs.openhtmltopdf.core
    implementation libs.openhtmltopdf.pdfbox
    implementation libs.java.jwt

    implementation platform(libs.spring.cloud.aws.dependencies)
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-ses'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation platform(libs.testcontainers.bom)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:localstack'
    implementation libs.freemarker
    implementation libs.commons.validator
    implementation libs.mybatis.postgresql.typehandlers
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    // BOM の管理外で推移的に入る版を引き上げる(#361)。どちらも本番には入らない。
    //   commons-compress 1.24.0 -> CVE-2024-26308 / CVE-2024-25710(testcontainers 1.21.4 経由。
    //                              1.x の最新が 1.21.4 のため、testcontainers 側では解消しない)
    //   plexus-utils     3.3.0  -> CVE-2025-67030(checkstyle の doxia 1.12.0 経由。11 系でも残り、
    //                              14 系では外れている。メジャー更新は設定の互換性の確認が要る)
    // 解除の判定は libs.versions.toml の該当行のコメントを参照する。
    constraints {
        testImplementation "org.apache.commons:commons-compress:${libs.versions.commons.compress.get()}"
        checkstyle "org.codehaus.plexus:plexus-utils:${libs.versions.plexus.utils.get()}"
    }
}

configurations.configureEach {
    exclude group: 'commons-logging', module: 'commons-logging'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

// 品質ゲート定義(checkstyle/jacoco/spotless/spotbugs/カバレッジ閾値/checkタスク構成)は
// CODEOWNERS保護対象の gradle/quality.gradle に分離している。この行を削除しないこと(guardrails CIが検証)。
apply from: 'gradle/quality.gradle'

// ローカルDBに対するマイグレーション確認用(./gradlew flywayInfo 等)。
// 接続先は開発用コンテナのデフォルト(シークレットは置かない。環境変数で上書き可能)
flyway {
    url = "jdbc:postgresql://${System.getenv('DB_HOST') ?: 'db'}:${System.getenv('DB_PORT') ?: '5432'}/${System.getenv('DB_NAME') ?: 'keireki_pro'}"
    user = System.getenv('DB_USERNAME') ?: 'postgres'
    password = System.getenv('DB_PASSWORD') ?: 'postgres'
    locations = ['filesystem:src/main/resources/db/migration']
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', 'src/main/java']
        }
    }
}
