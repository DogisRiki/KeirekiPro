// Flyway GradleプラグインはDB別モジュールをbuildscriptクラスパスに要求する。
// バージョンは gradle/libs.versions.toml の [versions] flyway を参照し、
// 下の plugins ブロックと同じ値になるようにしている。
// buildscript から参照できるのは [versions] だけで、[libraries] は参照できない
// (gradle/gradle#18105)。
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.flywaydb:flyway-database-postgresql:${libs.versions.flyway.get()}"

        // ビルド用プラグインが持ち込む commons-lang3 の版を引き上げる(#361)。
        // buildscript のクラスパスには Spring Boot の BOM が効かないため、ここで指定する。
        // 版は libs.versions.toml の [versions] を参照する。
        //   commons-lang3 3.16.0 -> CVE-2025-48924(3.18.0 以降で修正)
        // 解除の判定: この制約を外して ./gradlew -q buildEnvironment を実行し、
        // commons-lang3 が 3.18.0 以上なら、この制約と libs.versions.toml の commons-lang3 の行を削除する。
        constraints {
            classpath "org.apache.commons:commons-lang3:${libs.versions.commons.lang3.get()}"
        }
    }
}

// バージョンは gradle/libs.versions.toml に集約している。ここに version を直書きしない
plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    id 'checkstyle'
    id 'jacoco'
    id 'pmd'
    alias(libs.plugins.spotless)
    alias(libs.plugins.spotbugs)
    alias(libs.plugins.pitest)
    alias(libs.plugins.flyway)
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Spring Boot 4.1.2 の BOM が管理する OpenTelemetry 1.62.0 には、修正版が公開済みの
// CVE-2026-118259 がある(1.67.0 以降で修正)。opentelemetry-api は
// micrometer-tracing-bridge-otel と opentelemetry-exporter-otlp 経由で本番イメージに入る。
// 上流が追いつくまで、ここで管理バージョンを上書きする。修正の入った最小の版を指定している。
// 解除の判定: Spring Boot を上げたとき、その BOM の opentelemetry.version が
// libs.versions.toml の opentelemetry の版以上なら、この行と libs.versions.toml の opentelemetry の行を削除する。
ext['opentelemetry.version'] = libs.versions.opentelemetry.get()

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation libs.mybatis.starter
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        // JUnit Vintage（JUnit4）を除外
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation libs.mybatis.test.starter
    testImplementation 'org.springframework.security:spring-security-test'
    // archunit-junit6 1.5.1 は junit-platform-engine 6.1.3 を求め、junit-bom 6.1.3 を持ち込む。
    // そのままだと junit-platform-launcher だけが 6.1.3 になり、Spring Boot が決めた 6.0.3 の
    // engine と版がずれる。engine は spring-boot-starter-test の junit-jupiter が持ち込むので外す。
    // 解除の判定: ./gradlew dependencies --configuration testRuntimeClasspath で、外さなくても
    // junit-platform-launcher が Spring Boot の BOM の junit-jupiter.version と同じなら削除する。
    testImplementation(libs.archunit.junit6) {
        exclude group: 'org.junit.platform', module: 'junit-platform-engine'
    }
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation libs.springdoc.openapi.starter.webmvc.ui
    implementation libs.openhtmltopdf.core
    implementation libs.openhtmltopdf.pdfbox
    implementation libs.java.jwt

    implementation platform(libs.spring.cloud.aws.dependencies)
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-ses'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-localstack'
    implementation 'org.springframework.boot:spring-boot-starter-freemarker'
    implementation libs.commons.validator
    implementation libs.mybatis.postgresql.typehandlers
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    // checkstyle が持ち込む guava の版を引き上げる。本番には入らない。
    //   guava 33.7.1-jre -> CVE-2026-102554(33.7.2 で修正)
    // 解除の判定: この制約を外して ./gradlew dependencies --configuration checkstyle を実行し、
    // guava が 33.7.2 以上なら、この制約と libs.versions.toml の guava の行を削除する。
    constraints {
        checkstyle "com.google.guava:guava:${libs.versions.guava.get()}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // テストのクラスを2つの JVM に分けて同時に流す
    maxParallelForks = 2
    finalizedBy 'jacocoTestReport'
}

// 品質ゲート定義(checkstyle/jacoco/spotless/spotbugs/カバレッジ閾値/checkタスク構成)は
// CODEOWNERS保護対象の gradle/quality.gradle に分離している。この行を削除しないこと(guardrails CIが検証)。
apply from: 'gradle/quality.gradle'

// ローカルDBに対するマイグレーション確認用(./gradlew flywayInfo 等)。
// 接続先は開発用コンテナのデフォルト(シークレットは置かない。環境変数で上書き可能)
flyway {
    url = "jdbc:postgresql://${System.getenv('DB_HOST') ?: 'db'}:${System.getenv('DB_PORT') ?: '5432'}/${System.getenv('DB_NAME') ?: 'keireki_pro'}"
    user = System.getenv('DB_USERNAME') ?: 'postgres'
    password = System.getenv('DB_PASSWORD') ?: 'postgres'
    locations = ['filesystem:src/main/resources/db/migration']
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', 'src/main/java']
        }
    }
}
