// Flyway Gradleプラグイン(10系)はDB別モジュールをbuildscriptクラスパスに要求する
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.flywaydb:flyway-database-postgresql:10.22.0'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'jacoco'
    id 'pmd'
    id 'com.diffplug.spotless' version '7.2.1'
    id 'com.github.spotbugs' version '6.5.10'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'org.flywaydb.flyway' version '10.22.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// ArchUnit が junit-bom 5.14.4 を持ち込み junit-platform-launcher が 1.14.4 になる一方、
// Spring Boot は junit-platform-engine を 1.12.2 に固定するため、両者が噛み合わず
// テスト実行時に NoClassDefFoundError: org/junit/platform/engine/OutputDirectoryCreator になる。
// Spring Boot の管理バージョンを上書きして揃える。
//
// 解除の判定: Spring Boot を上げたらこの行を削除し、次を実行する。
//   docker compose exec -w /home/spring/app backend ./gradlew test
// 通れば削除したままでよい。落ちればまだ必要なので戻す。
ext['junit-jupiter.version'] = '5.14.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        // JUnit Vintage（JUnit4）を除外
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'
    implementation 'com.openhtmltopdf:openhtmltopdf-core:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    implementation 'com.auth0:java-jwt:4.6.0'

    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.4.2')
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-ses'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:localstack'
    implementation 'org.freemarker:freemarker:2.3.34'
    implementation 'commons-validator:commons-validator:1.11.0'
    implementation 'com.github.onozaty:mybatis-postgresql-typehandlers:1.0.2'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
}

configurations.configureEach {
    exclude group: 'commons-logging', module: 'commons-logging'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

// 品質ゲート定義(checkstyle/jacoco/spotless/spotbugs/カバレッジ閾値/checkタスク構成)は
// CODEOWNERS保護対象の gradle/quality.gradle に分離している。この行を削除しないこと(guardrails CIが検証)。
apply from: 'gradle/quality.gradle'

// ローカルDBに対するマイグレーション確認用(./gradlew flywayInfo 等)。
// 接続先は開発用コンテナのデフォルト(シークレットは置かない。環境変数で上書き可能)
flyway {
    url = "jdbc:postgresql://${System.getenv('DB_HOST') ?: 'db'}:${System.getenv('DB_PORT') ?: '5432'}/${System.getenv('DB_NAME') ?: 'keireki_pro'}"
    user = System.getenv('DB_USERNAME') ?: 'postgres'
    password = System.getenv('DB_PASSWORD') ?: 'postgres'
    locations = ['filesystem:src/main/resources/db/migration']
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', 'src/main/java']
        }
    }
}
