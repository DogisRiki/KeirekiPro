# =====================================================================
# Gradle version catalog
#
# build.gradle に直書きしていた依存とプラグインのバージョンをここへ集約する。
#
# 目的は宣言と実行の分離にある。build.gradle はプログラムであり、静的解析で
# 「バージョンだけの変更」と「ビルドロジックの変更」を区別することが原理的にできない。
# TOMLは純粋な宣言なのでその区別が要らず、ゲートの扱いを分けられる。
#
#   このファイル      : 宣言。人間の承認を外す対象
#   build.gradle 等   : プログラム。取得先(repositories)の定義を含むため承認を残す
#
# バージョンを書く場所はこのファイルだけにする。build.gradle に versionを直書きすると
# 承認が必要な側に戻ってしまう。
#
# flyway は buildscript の classpath と plugins の両方が同じバージョンを要求する。
# [versions] の1箇所を参照させることで、2箇所がずれることを構造的に防いでいる。
# buildscript ブロックから参照できるのは [versions] だけで、[libraries] と [bundles] は
# 参照できない(gradle/gradle#18105)。flyway に必要なのはバージョンの単一管理なので成立する。
#
# Dependabotの挙動は PR #184 のprobeで実測済み。
#   - backend/gradle/libs.versions.toml を認識する(directory: "/backend" のレーン)
#   - version.ref 形式のエントリを更新できる
#   - 更新PRは [versions] の行を書き換える([libraries] / [plugins] の行は変えない)
# =====================================================================

[versions]
# プラグイン
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
spotless = "8.10.4"
spotbugs = "6.5.13"
pitest = "1.19.0"
# buildscript の classpath と plugins の両方から参照する。ずれを防ぐため1箇所にする
flyway = "13.11.1"

# 依存
mybatis-spring-boot = "4.1.0"
archunit = "1.5.1"
springdoc = "3.2.0"
openhtmltopdf = "1.0.10"
java-jwt = "4.6.2"
spring-cloud-aws = "4.2.0"
commons-validator = "1.11.0"
mybatis-postgresql-typehandlers = "1.0.2"

# Spring Boot の BOM が管理する版を上書きするためのもの(build.gradle の ext で参照)。
# BOM の版に脆弱性があり、Spring Boot 側がまだ追いついていない場合に使う。
# 解除の判定: build.gradle の ext['opentelemetry.version'] の注記を参照する。
opentelemetry = "1.67.0"

# build.gradle の constraints で参照する。脆弱性のある版が推移的に入るのを引き上げるためのもの。
# commons-lang3 は buildscript の constraints(ビルド用プラグイン経由)、
# guava は dependencies の constraints(checkstyle 経由)で使う。
# 解除の判定: build.gradle の対応する constraints の注記を参照する。
commons-lang3 = "3.20.0"
guava = "33.7.2-jre"

[libraries]
# Flyway Gradleプラグインが DB別モジュールをbuildscriptクラスパスに要求するためのもの。
# implementation 側の spring-boot-starter-flyway / flyway-database-postgresql は Spring Boot のBOM管理下にあり
# バージョンを持たないため、ここには含めない
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

mybatis-starter = { module = "org.mybatis.spring.boot:mybatis-spring-boot-starter", version.ref = "mybatis-spring-boot" }
mybatis-test-starter = { module = "org.mybatis.spring.boot:mybatis-spring-boot-starter-test", version.ref = "mybatis-spring-boot" }
archunit-junit6 = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
openhtmltopdf-core = { module = "com.openhtmltopdf:openhtmltopdf-core", version.ref = "openhtmltopdf" }
openhtmltopdf-pdfbox = { module = "com.openhtmltopdf:openhtmltopdf-pdfbox", version.ref = "openhtmltopdf" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "java-jwt" }
spring-cloud-aws-dependencies = { module = "io.awspring.cloud:spring-cloud-aws-dependencies", version.ref = "spring-cloud-aws" }
commons-validator = { module = "commons-validator:commons-validator", version.ref = "commons-validator" }
mybatis-postgresql-typehandlers = { module = "com.github.onozaty:mybatis-postgresql-typehandlers", version.ref = "mybatis-postgresql-typehandlers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
