    ExportResumeRequest:
      type: object
      description: |
        `format` が `pdf` なら `pdfSettings` が要る(無ければ 400、`errors` の項目名は `pdfSettingsRequired`)。
      required: [format, disposition]
      properties:
        format:
          type: string
          enum: [pdf, markdown]
        disposition:
          type: string
          enum: [inline, attachment]
        pdfSettings:
          oneOf:
            - $ref: '#/components/schemas/PdfSettings'
            - type: 'null'
    PdfSettings:
      type: object
      description: PDF の見た目の設定(Java の `ExportResumeRequest.PdfSettingsRequest`)。
      required: [fontFamily, fontSizes, tableHeaderColor]
      properties:
        fontFamily:
          type: string
          enum: [NotoSansJP, NotoSerifJP]
        fontSizes:
          $ref: '#/components/schemas/FontSizes'
        tableHeaderColor:
          $ref: '#/components/schemas/TableHeaderColor'
    FontSizes:
      type: object
      description: 文字の大きさ(pt)。どれも 6 以上 72 以下の小数。
      required: [title, date, fullName, sectionHeading]
      properties:
        title:
          type: number
        date:
          type: number
        fullName:
          type: number
        sectionHeading:
          type: number
    TableHeaderColor:
      type: object
      description: |
        表の見出しの色。`hex` と `rgb` のちょうど一方を指定する(両方か、どちらも無いときは 400、
        `errors` の項目名は `pdfSettings.tableHeaderColor.specifiedOnce`)。
      properties:
        hex:
          type: [string, 'null']
          description: '`#` を付けない6桁の16進数(大文字も可)'
          pattern: '^[0-9a-fA-F]{6}$'
        rgb:
          oneOf:
            - $ref: '#/components/schemas/Rgb'
            - type: 'null'
    Rgb:
      type: object
      description: 0 から 255 の整数の色。
      required: [r, g, b]
      properties:
        r:
          type: integer
          minimum: 0
          maximum: 255
        g:
          type: integer
          minimum: 0
          maximum: 255
        b:
          type: integer
          minimum: 0
          maximum: 255
    GetResumeListResponse:
      type: object
      required: [resumes]
