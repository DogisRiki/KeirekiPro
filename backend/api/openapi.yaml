        復元の要求では Java の DTO はどれも必須にしていない(`version` は `1.0` でなければ 400)。
      properties:
        version:
          type: string
          description: バックアップの形式の版。今は `1.0`。
          examples:
            - '1.0'
        exportedAt:
          type: string
          format: date-time
          description: バックアップした日時(UTC、`Z` 付き。例 `2026-11-07T13:55:54.072661Z`)。復元では使わない。
        resume:
          $ref: '#/components/schemas/BackupResume'
