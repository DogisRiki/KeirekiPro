openapi: 3.1.0
info:
  title: KeirekiPro API
  version: 1.0.0
  description: |
    KeirekiPro の backend の HTTP API の取り決め。

    この文書は、main の 492ae6ae 時点の Java 版(Spring Boot)の backend のコード
    (presentation 層の controller と DTO、`AppExceptionHandler`、`SecurityConfig`、Cookie を作るコード、
    `application*.yaml`)と、動いている Java 版から springdoc が出した定義を突き合わせて書いた。
    「同じ振る舞い」の正は Java 版が実際に返す値と保存する値であり、細部(検証の規則、文言、
    項目の並び)は Java 版と Go 版を比べる差分テストで確かめる。

    ## 共通の決まり

    - 本文は UTF-8 の JSON。日時の書き方は次のとおり。
      - `LocalDate`(例 `2026-11-07`)は `format: date`。
      - `YearMonth` は `yyyy-MM`(例 `2026-11`)の文字列。
      - `LocalDateTime` は、時差を付けない日本時間の文字列(例 `2026-11-07T22:55:54.072661`)。
        `format: date-time` ではない(RFC 3339 の時差が無いため)。
      - `Instant`(バックアップの `exportedAt` だけ)は、UTC の `Z` 付きの文字列(`format: date-time`)。
    - JSON の本文が読めない(壊れた JSON、型の合わない値、`yyyy-MM` でない年月など)ときは
      400 と `{"message":"入力エラーがあります。","errors":{}}` を返す。
    - DTO の検証(Bean Validation)に落ちたときは 400 と、項目名ごとの文言の一覧
      (`errors`)を返す。入れ子の項目の名前は `pdfSettings.fontSizes.title` のような
      点区切りのパスになる。DTO の長さ・形式などの規則はこの文書に書き写していない
      (正は Java の DTO の注釈)。`required` は、Java の DTO が `@NotNull`/`@NotBlank` で
      必須にしている項目だけに付けた。必須の項目が無いときも Java は 400 と項目ごとの文言を返す。
    - 想定外の例外は 500 と `{"message":"予期せぬエラーが発生しました。","errors":{}}` を返す。
      Java 版は `@ExceptionHandler(Exception.class)` がすべてを受けるため、
      Spring が本来 405・415・413 などを返す場面(許されないメソッド、Content-Type の不一致、
      2MB を超える multipart、必須のクエリが無い、UUID でない `{careerId}` など)も 500 になる。
    - すべての応答に `X-Request-Id` ヘッダーが付く(要求に `X-Request-Id` があればその値、
      無ければ新しい UUID)。

    ## 認証

    - 認証は HttpOnly の Cookie `accessToken`(JWT、有効 10 分)で行う。`/api/auth/**` 以外はすべて認証が要る。
    - `refreshToken`(有効 7 日。サーバー側の保存先は Redis)で `POST /api/auth/token/refresh` から `accessToken` を作り直す。
    - `twoFactorChallenge`(Path `/api/auth/2fa`、Max-Age 600)は二段階認証の途中だけ使う。
    - Cookie の属性は `Path=/; HttpOnly; SameSite=Lax`。設定 `cookie.secure` が true の環境(本番)では `Secure` も付く。
      `accessToken` と `refreshToken` に `Max-Age` は付かない(ブラウザーを閉じるまで)。
    - 消すときは同じ名前で値を空にし、`Max-Age=0` と `Expires=Thu, 01 Jan 1970 00:00:00 GMT` を付ける。
    - `accessToken` が検証できないとき、要求は未認証として扱われ、`accessToken` を消す
      `Set-Cookie`(`Path=/; Max-Age=0`。HttpOnly などは付かない)が応答に付く。

    ## CSRF

    - `/api/auth/**` を除く、GET・HEAD・OPTIONS のほかの要求(POST・PUT・PATCH・DELETE など)は、Cookie `XSRF-TOKEN` の値を
      ヘッダー `X-XSRF-TOKEN` にそのまま入れて送る(double submit cookie。マスクしない)。
    - 無いか一致しないときは 403 と `{"message":"アクセス権限がありません。"}` を返す。
      このとき、新しい `XSRF-TOKEN` を `Set-Cookie` で返す。
      CSRF の検査は認証の検査より先に行うため、未認証でも CSRF が無ければ 401 ではなく 403 になる。
    - `XSRF-TOKEN` Cookie(HttpOnly なし、`Path=/`)は、要求に無ければ、OPTIONS 以外の
      すべての応答(`/api/auth/**` と GET を含む)で発行される。

    ## CORS

    許す送り元は設定 `cors.allowed-origins`。資格情報(Cookie)を許し、メソッドは
    GET・POST・PUT・DELETE・PATCH・OPTIONS、ヘッダーはすべて許す。ブラウザーに見せるヘッダーは
    `Content-Disposition` と `X-Request-Id`。OPTIONS(プリフライト)は認証なしで通す。

    ## API でない URL

    この文書に載せていない、Java 版が受け付ける URL は次のとおり。
    - `/actuator/health`: ヘルスチェック(ALB のターゲットグループと ECS のコンテナのヘルスチェックが使う)。
      認証不要。本番は `health` だけを公開し、詳細は出さない(`{"status":"UP"}`)。
      開発の設定では `/actuator/**` をすべて公開している。
    - `/v3/api-docs`、`/v3/api-docs/**`、`/swagger-ui.html`、`/swagger-ui/**`: springdoc の定義と画面。
      認証不要。本番の設定でも無効にしていない。
    - `/error`: Spring Boot の既定のエラーの URL(エラーの転送先)。
    - `/api/admin/**`: 管理者(ROLE_ADMIN)だけに許す規則があるが、受け付ける controller は無い。
servers:
  - url: /
tags:
  - name: auth
    description: 認証(ログイン、トークン、登録、メールアドレスの確認、パスワードの再設定、OIDC)。認証不要で、CSRF の検査も無い。
  - name: users
    description: ログインしている利用者のアカウント
  - name: resumes
    description: 職務経歴書とその中身、バックアップ、エクスポート
  - name: masters
    description: 画面の入力補助のための一覧
security:
  - cookieAuth: []
paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: ログイン
      description: |
        メールアドレスとパスワードでログインする。
        二段階認証が無効なら 200 と `accessToken`・`refreshToken` の Cookie を返す。
        有効なら 202 と `twoFactorChallenge` の Cookie を返し、認証コードをメールで送る
        (続きは `POST /api/auth/2fa/verify`)。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログインした(本文なし)
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAuthTokens'
        '202':
          description: 二段階認証へ進む(本文なし)
          headers:
            Set-Cookie:
              description: |
                `twoFactorChallenge=<チャレンジトークン>; Path=/api/auth/2fa; Max-Age=600; Expires=...; HttpOnly; SameSite=Lax`
                (本番は `Secure` も付く)
              schema:
                type: string
        '400':
          description: |
            入力が足りない、またはメールアドレスかパスワードが違う
            (`errors` は空。文言はアカウントの有無で変えない)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            パスワードは合っているが、メールアドレスの確認が済んでいない。
            `kind` は、確認前の登録(アカウントがまだ無い)なら `PENDING_REGISTRATION`、
            アカウントのメールアドレスの確認がまだなら `UNVERIFIED_ACCOUNT_EMAIL`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailNotVerifiedErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: ログアウト
      description: |
        `refreshToken`(無ければ `accessToken`)から利用者を特定できれば、その利用者が
        全端末でそれまでに発行したトークンを無効にする。`refreshToken` があればサーバー側から消す。
        Cookie が無くても、トークンが無効でも 204 を返す。
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
        - $ref: '#/components/parameters/AccessTokenCookie'
      responses:
        '204':
          description: ログアウトした
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieClearAuthTokens'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: アクセストークンの再発行
      description: |
        `refreshToken` の Cookie から新しい `accessToken` を作る。`refreshToken` は作り直さない。
        `refreshToken` が無い、サーバー側に無い、またはトークンの版が今の版と違うときは 401
        (版が違うときはサーバー側の `refreshToken` を消す)。
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: 再発行した(本文なし)
          headers:
            Set-Cookie:
              description: '`accessToken=<JWT>; Path=/; HttpOnly; SameSite=Lax`(本番は `Secure` も付く)'
              schema:
                type: string
        '401':
          description: '`refreshToken` が無いか無効。本文は常に `{"message":"認証に失敗しました。","errors":{}}`。Cookie は消さない。'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: 利用者の新規登録
      description: |
        メールアドレスとパスワードで登録を受け付け、確認のメールを送る。
        アカウントは確認のリンクを開いたとき(`POST /api/auth/email-verification/verify`)に作られる。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '202':
          description: 受け付けた(本文なし)
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/2fa/verify:
    post:
      tags: [auth]
      operationId: verifyTwoFactorAuth
      summary: 二段階認証の認証コードの確認
      description: |
        `twoFactorChallenge` の Cookie と認証コードを確かめ、ログインを済ませる。
        Cookie が無い、期限切れ、コードが違う、試行回数の上限に達したときは 400。
      security: []
      parameters:
        - $ref: '#/components/parameters/TwoFactorChallengeCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorAuthRequest'
      responses:
        '200':
          description: ログインした(本文なし)
          headers:
            Set-Cookie:
              description: |
                3つの `Set-Cookie` が付く。`accessToken` と `refreshToken` の発行
                (`Path=/; HttpOnly; SameSite=Lax`)と、`twoFactorChallenge` を消すもの
                (`twoFactorChallenge=; Path=/api/auth/2fa; Max-Age=0; Expires=...; HttpOnly; SameSite=Lax`)。
                本番は `Secure` も付く。
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/email-verification/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: メールアドレスの確認
      description: 確認のリンクのトークンを受け取り、確認の結果を返す。結果が失敗の種類(`EXPIRED` など)でも 200 で返す。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationTokenRequest'
      responses:
        '200':
          description: 確認の結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/email-verification/resend:
    post:
      tags: [auth]
      operationId: resendEmailVerification
      summary: 確認のメールの送り直し
      description: 期限の切れた確認のリンクのトークンから、確認のメールを送り直す。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationTokenRequest'
      responses:
        '204':
          description: 送った
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/email-verification/resend-for-login:
    post:
      tags: [auth]
      operationId: resendEmailVerificationForLogin
      summary: ログインの画面からの確認のメールの送信
      description: メールアドレスとパスワードを確かめ、確認がまだのアカウント(または確認前の登録)へ確認のメールを送る。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationForLoginRequest'
      responses:
        '204':
          description: 送った
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/password/reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: パスワードの再設定の要求
      description: パスワードの再設定のリンクをメールで送る。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetRequest'
      responses:
        '204':
          description: 受け付けた
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/password/reset/verify:
    post:
      tags: [auth]
      operationId: verifyPasswordResetToken
      summary: パスワードの再設定のトークンの確認
      description: |
        トークンが有効かを確かめる。無効または期限切れなら 400。
        Java の DTO は検証の注釈を持たない(`@Valid` も付いていない)。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetVerifyRequest'
      responses:
        '204':
          description: 有効
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: パスワードの再設定
      description: |
        トークンが無効または期限切れなら 400。トークンは有効だが利用者がもう居ないときは 401
        (`{"message":"不正なアクセスです。","errors":{}}` と、`accessToken`・`refreshToken` を消す `Set-Cookie`)。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: 再設定した
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/oidc/authorize:
    get:
      tags: [auth]
      operationId: startOidcAuthorization
      summary: OIDC の認可の開始
      description: |
        OIDC プロバイダーの認可 URL(state と PKCE の code_challenge を含む)を作って返す。
        画面はこの URL へ移動する。コールバック先は、本番は `app.api-base-url` + `/api/auth/oidc/callback`、
        開発は要求の scheme・host・port + `/api/auth/oidc/callback`。
        本文は URL の文字列そのもの(JSON の文字列としての引用符は付かない)。
        Content-Type は Accept で変わる(Spring の文字列の変換器が書くため。`text/plain` のほか、
        Accept に `application/json` が先に来ると `application/json` のまま引用符なしの本文になる)。
        `provider` が無い、または知らないプロバイダーのときは 500。
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          description: プロバイダーの名前(`google` か `github`。大文字小文字は区別しない)
          schema:
            type: string
      responses:
        '200':
          description: 認可 URL
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: handleOidcCallback
      summary: OIDC のコールバック
      description: |
        OIDC プロバイダーから戻ってきたときの処理。結果によらず、例外が起きても 302 で画面へ戻す。
        - 成功: `accessToken`・`refreshToken` の Cookie を発行し、`{frontend-base-url}/resume/list` へ。
        - アカウントのメールアドレスの確認がまだ: `{frontend-base-url}/login?error=unverified_email` へ。
        - 利用者の情報が取れない: `{frontend-base-url}/login?error=<URL エンコードした文言>` へ
          (文言は「ユーザー情報の取得に失敗しました。しばらく時間を置いてから再度お試しください。」)。
        - その他の失敗と例外: `{frontend-base-url}/login?error=<URL エンコードした文言>` へ
          (文言は「認証に失敗しました。しばらく時間を置いてから再度お試しください。」)。
        URL エンコードは Java の `URLEncoder`(空白は `+`)。
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: 画面へ戻す(本文なし)
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              description: 成功したときだけ、`accessToken` と `refreshToken` を発行する(`Path=/; HttpOnly; SameSite=Lax`、本番は `Secure` も付く)。
              schema:
                type: string
  /api/users/me:
    get:
      tags: [users]
      operationId: getUserInfo
      summary: 利用者の情報の取得
      responses:
        '200':
          description: 利用者の情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [users]
      operationId: updateUserInfo
      summary: 利用者の情報の更新
      description: |
        multipart/form-data で受け取る。送った項目だけを変える。
        Java 版は `@RequestParam` で読むため、`username` と `twoFactorAuthEnabled` はクエリ文字列で送っても受け付ける。
        画像は JPEG・PNG・GIF だけ、縦横 4096 ピクセル以下(違えば 400)。
        multipart の大きさの上限は 1ファイル 2MB・要求全体 2MB で、超えると Java 版は 500 を返す。
        multipart でない Content-Type も Java 版は 500 を返す。
      parameters:
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfTokenCookie'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateUserInfoRequest'
            encoding:
              profileImage:
                contentType: image/jpeg, image/png, image/gif
      responses:
        '200':
          description: 更新したあとの利用者の情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [users]
      operationId: deleteUser
      summary: 退会
      parameters:
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfTokenCookie'
      responses:
        '204':
          description: 退会した
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieClearAuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me/email-verification:
    post:
      tags: [users]
      operationId: sendAccountEmailVerification
      summary: 確認のメールの送信
      description: ログインしている利用者のアカウントの、確認がまだのメールアドレスへ確認のメールを送る。
      parameters:
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfTokenCookie'
      responses:
        '204':
          description: 送った
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me/email-password:
    post:
      tags: [users]
