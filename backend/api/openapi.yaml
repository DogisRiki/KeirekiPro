components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: |
        HttpOnly の Cookie `accessToken` に入れた JWT。`/api/auth/**` 以外のすべての操作に要る。
        無いか検証できないときは 401(本文なし)。
  parameters:
    XsrfTokenHeader:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: |
        Cookie `XSRF-TOKEN` の値をそのまま入れる(CSRF 対策)。`/api/auth/**` 以外の、GET・HEAD・OPTIONS のほかの要求に要る。
        サーバーは、無いか Cookie と一致しないときに 403 と `{"message":"アクセス権限がありません。"}` を返す
        (要求の形の誤りとしての 400 にはしない。そのためこの文書では `required: false` にしている)。
      schema:
        type: string
    XsrfTokenCookie:
      name: XSRF-TOKEN
      in: cookie
      required: false
      description: |
        CSRF のトークン。サーバーが `Set-Cookie: XSRF-TOKEN=<値>; Path=/`(HttpOnly なし)で発行し、
        画面はこの値を `X-XSRF-TOKEN` ヘッダーに写す。
      schema:
        type: string
    RefreshTokenCookie:
      name: refreshToken
      in: cookie
      required: false
      description: リフレッシュトークン(HttpOnly)。
      schema:
        type: string
    AccessTokenCookie:
      name: accessToken
      in: cookie
      required: false
      description: アクセストークン(HttpOnly の JWT)。
      schema:
        type: string
    TwoFactorChallengeCookie:
      name: twoFactorChallenge
      in: cookie
      required: false
      description: |
        ログインの 202 で発行した二段階認証のチャレンジトークン(HttpOnly、Path `/api/auth/2fa`)。
        無いときは 400 と「認証セッションが無効または期限切れです。もう一度最初からお試しください。」。
      schema:
        type: string
    ResumeId:
      name: resumeId
      in: path
      required: true
      description: |
        職務経歴書の ID(UUID)。Java 版は文字列で受け取り、UUID として読めない値・存在しない値・
        他人の職務経歴書は、どれも 404 と「対象の職務経歴書データが存在しません。」を返す。
      schema:
        type: string
    CareerId:
      name: careerId
      in: path
      required: true
      description: 職歴の ID。Java 版は UUID として受け取り、UUID として読めない値には 500 を返す。存在しなければ 404。
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      description: プロジェクトの ID。Java 版は UUID として受け取り、UUID として読めない値には 500 を返す。存在しなければ 404。
      schema:
        type: string
        format: uuid
    CertificationId:
      name: certificationId
      in: path
      required: true
      description: 資格の ID。Java 版は UUID として受け取り、UUID として読めない値には 500 を返す。存在しなければ 404。
      schema:
        type: string
        format: uuid
    PortfolioId:
      name: portfolioId
      in: path
      required: true
      description: ポートフォリオの ID。Java 版は UUID として受け取り、UUID として読めない値には 500 を返す。存在しなければ 404。
      schema:
        type: string
        format: uuid
    SnsPlatformId:
      name: snsPlatformId
      in: path
      required: true
      description: SNS の ID。Java 版は UUID として受け取り、UUID として読めない値には 500 を返す。存在しなければ 404。
      schema:
        type: string
        format: uuid
    SelfPromotionId:
      name: selfPromotionId
      in: path
      required: true
      description: 自己 PR の ID。Java 版は UUID として受け取り、UUID として読めない値には 500 を返す。存在しなければ 404。
      schema:
        type: string
        format: uuid
  headers:
    SetCookieAuthTokens:
      description: |
        2つの `Set-Cookie` が付く。
        `accessToken=<JWT>; Path=/; HttpOnly; SameSite=Lax` と
        `refreshToken=<トークン>; Path=/; HttpOnly; SameSite=Lax`(本番はどちらにも `Secure` が付く)。
      schema:
        type: string
    SetCookieClearAuthTokens:
      description: |
        2つの `Set-Cookie` が付く。
        `accessToken=; Path=/; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax` と、
        同じ形の `refreshToken=; ...`(本番はどちらにも `Secure` が付く)。
      schema:
        type: string
    ContentDispositionAttachment:
      description: |
        `attachment` で始まり、ファイル名を UTF-8 で書く(RFC 5987 の `filename*=UTF-8''<パーセントエンコード>` を含む。
        Spring の `ContentDisposition` が組み立てる。正確な文字列は差分テストで確かめる)。
      schema:
        type: string
    Location:
      description: 移動先の URL(`frontend-base-url` で始まる)。
      schema:
        type: string
  responses:
    ResumeInfoOk:
      description: 更新したあとの職務経歴書の全体
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResumeInfoResponse'
    ResumeInfoCreated:
      description: 作ったあとの職務経歴書の全体
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResumeInfoResponse'
    BadRequest:
      description: |
        入力の誤り。DTO の検証に落ちたときは `message` が「入力エラーがあります。」で、`errors` に
        項目名ごとの文言の一覧が入る。JSON が読めないときは `errors` が空。ユースケースやドメインの規則に
        合わないときは、その文言が `message` に入り、`errors` は項目ごとの文言か空。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        認証されていない。次の2つの形がある。
        - `accessToken` が無いか検証できない: 本文なし(Spring Security の `HttpStatusEntryPoint`)。
          検証できなかったときは `accessToken` を消す `Set-Cookie` が付く。
        - トークンは正しいが利用者が見つからない(退会のあとなど): `{"message":"不正なアクセスです。","errors":{}}` と、
          `accessToken`・`refreshToken` を消す `Set-Cookie`。
      headers:
        Set-Cookie:
          description: 上のとおり、トークンの Cookie を消すことがある。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: |
        CSRF のトークンが無いか一致しない(または権限が足りない)。本文は `{"message":"アクセス権限がありません。"}`
        だけで、`errors` は無い。Content-Type は `application/json;charset=UTF-8`。
      headers:
        Set-Cookie:
          description: CSRF のトークンが無いか一致しないときは、新しい `XSRF-TOKEN=<値>; Path=/` が付く。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenResponse'
    NotFound:
      description: |
        対象が無い(他人のものも含む)。`message` は「対象の職務経歴書データが存在しません。」や
        「対象の職歴が存在しません。」など。`errors` は空。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAcceptable:
      description: '`Accept` が PDF も Markdown も含まない。`{"message":"対応していない形式が指定されました。","errors":{}}`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 想定外の誤り。`{"message":"予期せぬエラーが発生しました。","errors":{}}`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: 失敗のときの本文(Java の `ErrorResponse`)。
      required: [message, errors]
      properties:
        message:
          type: string
          description: 全体の文言
        errors:
          type: object
          description: 項目名ごとの文言の一覧。無いときは空のオブジェクト `{}`。
          additionalProperties:
            type: array
            items:
              type: string
      examples:
        - message: 入力エラーがあります。
          errors:
            resumeName:
              - 職務経歴書名は入力必須です。
    EmailNotVerifiedErrorResponse:
      type: object
      description: メールアドレスの確認が済んでいないときの本文。`message` は常に「メールアドレスの確認が済んでいません。」、`errors` は常に空。
      required: [message, errors, kind]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        kind:
          type: string
          enum: [PENDING_REGISTRATION, UNVERIFIED_ACCOUNT_EMAIL]
    ForbiddenResponse:
      type: object
      description: 403 の本文。`errors` を持たない。
      required: [message]
      properties:
        message:
          type: string
          const: アクセス権限がありません。
    YearMonth:
      type: string
      description: 年月(`yyyy-MM`)。
      pattern: '^[0-9]{4}-[0-9]{2}$'
      examples:
        - '2026-11'
    LocalDateTime:
      type: string
      description: |
        時差を付けない日本時間の日時(Java の `LocalDateTime` を ISO_LOCAL_DATE_TIME で書いたもの)。
        秒の小数部の桁数は値によって変わる(例 `2026-11-07T22:55:54.072661`)。
      examples:
        - '2026-11-07T22:55:54.072661'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    UserRegistrationRequest:
      type: object
      description: '`password` と `confirmPassword` が違うときは、`confirmPassword` の項目の誤りとして 400。'
      required: [email, username, password, confirmPassword]
      properties:
        email:
          type: string
        username:
          type: string
        password:
          type: string
        confirmPassword:
          type: string
    EmailVerificationTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ResendEmailVerificationForLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    RequestPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    RequestPasswordResetVerifyRequest:
      type: object
      properties:
        token:
          type: [string, 'null']
    ResetPasswordRequest:
      type: object
      description: '`password` と `confirmPassword` が違うときは、`confirmPassword` の項目の誤りとして 400。'
      required: [password, confirmPassword]
      properties:
        password:
          type: string
        confirmPassword:
          type: string
        token:
          type: [string, 'null']
          description: メールのリンクで受け取ったトークン(Java の DTO は必須にしていない)
    TwoFactorAuthRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    VerifyEmailResponse:
      type: object
      required: [result, passwordResetToken]
      properties:
        result:
          type: string
          enum:
            - VERIFIED
            - PASSWORD_RESET_READY
            - ALREADY_VERIFIED
            - EXPIRED
            - REGISTRATION_GONE
            - EMAIL_TAKEN
            - INVALID
        passwordResetToken:
          type: [string, 'null']
          description: '`result` が `PASSWORD_RESET_READY` のときのパスワードの再設定のトークン。それ以外は null。'
    ChangePasswordRequest:
      type: object
      required: [nowPassword, newPassword]
      properties:
        nowPassword:
          type: string
        newPassword:
          type: string
    SetEmailAndPasswordRequest:
      type: object
      description: '`password` と `confirmPassword` が違うときは、`confirmPassword` の項目の誤りとして 400(どちらかが null なら比べない)。'
      required: [password]
      properties:
        email:
          type: [string, 'null']
        password:
          type: string
        confirmPassword:
          type: [string, 'null']
        currentPassword:
          type: [string, 'null']
    UpdateUserInfoRequest:
      type: object
      description: multipart/form-data の部品。どれも省略できる。
      properties:
        username:
          type: string
        profileImage:
          type: string
          format: binary
          description: プロフィール画像(JPEG・PNG・GIF、縦横 4096 ピクセル以下、2MB 以下)
        twoFactorAuthEnabled:
          type: boolean
          description: '`true` か `false` の文字列'
    UserInfoResponse:
      type: object
      required:
        - id
        - email
        - username
        - hasPassword
        - profileImage
        - twoFactorAuthEnabled
        - authProviders
        - roles
        - emailVerified
        - pendingEmail
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, 'null']
          description: メールアドレス(OIDC だけで作ったアカウントなどでは null)
        username:
          type: string
        hasPassword:
          type: boolean
        profileImage:
          type: [string, 'null']
          description: プロフィール画像の、有効 10 分の取得用 URL(署名付き URL)。画像が無ければ null。
        twoFactorAuthEnabled:
          type: boolean
        authProviders:
          type: [array, 'null']
          description: 連携している外部認証のプロバイダーの名前の一覧
          items:
            type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        emailVerified:
          type: boolean
        pendingEmail:
          type: [string, 'null']
          description: 確認を待っている新しいメールアドレス。無ければ null。
    CreateResumeRequest:
      type: object
      required: [resumeName]
      properties:
        resumeName:
          type: string
        resumeId:
          type: [string, 'null']
          format: uuid
          description: 写し元の職務経歴書の ID。指定すると写して作る。UUID として読めない値は 400(JSON が読めない扱い)。
    UpdateResumeBasicRequest:
      type: object
      required: [resumeName, date, lastName, firstName]
      properties:
        resumeName:
          type: string
        date:
          type: string
          format: date
        lastName:
          type: string
        firstName:
          type: string
    CareerRequest:
      type: object
      description: 職歴の追加と更新の本文(Java の `CreateCareerRequest` と `UpdateCareerRequest`。項目は同じ)。
      required: [companyName, startDate, isActive]
      properties:
        companyName:
          type: string
        startDate:
          $ref: '#/components/schemas/YearMonth'
        endDate:
          oneOf:
            - $ref: '#/components/schemas/YearMonth'
            - type: 'null'
        isActive:
          type: boolean
          description: 在籍中か。要求では `isActive`、応答では `active` という名前になる。
    CertificationRequest:
      type: object
      description: 資格の追加と更新の本文(Java の `CreateCertificationRequest` と `UpdateCertificationRequest`)。
      required: [name, date]
      properties:
        name:
          type: string
        date:
          $ref: '#/components/schemas/YearMonth'
    PortfolioRequest:
      type: object
      description: ポートフォリオの追加と更新の本文(Java の `CreatePortfolioRequest` と `UpdatePortfolioRequest`)。`link` は https の URL。
      required: [name, overview, link]
      properties:
        name:
          type: string
        overview:
          type: string
        techStack:
          type: [string, 'null']
        link:
          type: string
    SnsPlatformRequest:
      type: object
      description: SNS の追加と更新の本文(Java の `CreateSnsPlatformRequest` と `UpdateSnsPlatformRequest`)。`link` は https の URL。
      required: [name, link]
      properties:
        name:
          type: string
        link:
          type: string
    SelfPromotionRequest:
      type: object
      description: 自己 PR の追加と更新の本文(Java の `CreateSelfPromotionRequest` と `UpdateSelfPromotionRequest`)。
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
    ProjectRequest:
      type: object
      description: |
        プロジェクトの追加と更新の本文(Java の `CreateProjectRequest` と `UpdateProjectRequest`。項目は同じ)。
        作業工程は真偽値の平らな項目で、技術スタックは分類ごとの文字列の配列の平らな項目で受け取る
        (応答では `process` と `techStack` の入れ子になる)。技術スタックの配列は省略でき、省略すると null のまま保存される。
      required:
        - companyName
        - startDate
        - isActive
        - name
        - overview
        - teamComp
        - role
        - achievement
        - requirements
        - basicDesign
        - detailedDesign
        - implementation
        - integrationTest
        - systemTest
        - maintenance
      properties:
        companyName:
          type: string
        startDate:
          $ref: '#/components/schemas/YearMonth'
        endDate:
          oneOf:
            - $ref: '#/components/schemas/YearMonth'
            - type: 'null'
        isActive:
          type: boolean
          description: 継続中か。要求では `isActive`、応答では `active` という名前になる。
        name:
          type: string
        overview:
          type: string
        teamComp:
          type: string
        role:
          type: string
        achievement:
          type: string
        requirements:
          type: boolean
        basicDesign:
          type: boolean
        detailedDesign:
          type: boolean
        implementation:
          type: boolean
        integrationTest:
          type: boolean
        systemTest:
          type: boolean
        maintenance:
          type: boolean
        frontendLanguages:
