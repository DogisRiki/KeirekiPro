  /api/resumes/{resumeId}/export:
    parameters:
      - $ref: '#/components/parameters/ResumeId'
    get:
      tags: [resumes]
      operationId: exportResume
      summary: 職務経歴書のエクスポート(Accept で形式を選ぶ)
      description: |
        形式は要求の `Accept` ヘッダーの文字列で決める(内容交渉の規則ではなく、部分文字列で調べる)。
        - `Accept` が `application/pdf` を含めば PDF(既定のフォントと色)。
        - そうでなく `text/markdown` を含めば Markdown。
        - どちらも含まなければ 406 と `{"message":"対応していない形式が指定されました。","errors":{}}`。
        成功のときの `Content-Type` は `Accept` によらず、PDF なら `application/pdf`、
        Markdown なら `text/markdown;charset=utf-8`。`Content-Disposition` は常に `attachment`、
        ファイル名は `<職務経歴書名を整えたもの>.pdf` か `.md`。
        画面は `Accept: application/pdf, application/json`(または `text/markdown, application/json`)を送り、
        失敗のときは JSON のエラーを受け取る。`Accept` が JSON を受け付けないとき、Java 版の失敗の応答の本文は
        書けない(Spring の既定の動き。差分テストで確かめる)。
        職務経歴書がエクスポートの前提の規則に合わないときは 400
        (`message` は「職務経歴書をエクスポートできません。」に、改行と `- ` で始まる理由を並べたもの。`errors` は空)。
      responses:
        '200':
          description: エクスポートしたファイル
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDispositionAttachment'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [resumes]
      operationId: exportResumeWithSettings
      summary: 職務経歴書のエクスポート(設定を指定する)
      description: |
        本文の `format` で形式を、`disposition` で `Content-Disposition` の種類(`inline` はプレビュー用)を決める。
        `format` が `pdf` なら `pdfSettings` が要る(無ければ 400、`errors` の項目名は `pdfSettingsRequired`)。
        `format` が `markdown` のときは `pdfSettings` を使わない。
        成功のときの `Content-Type` は、PDF なら `application/pdf`、Markdown なら `text/markdown;charset=utf-8`。
        `Accept` は形式の選びに使わない。
        職務経歴書がエクスポートの前提の規則に合わないときは 400。`message` は、`disposition` が `inline` なら
        「入力エラーがあるため、PDFプレビューを表示できません。」、`attachment` なら「職務経歴書をエクスポートできません。」に、
        改行と `- ` で始まる理由を並べたもの(`errors` は空)。
      parameters:
        - $ref: '#/components/parameters/XsrfTokenHeader'
        - $ref: '#/components/parameters/XsrfTokenCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportResumeRequest'
      responses:
        '200':
          description: エクスポートしたファイル
          headers:
            Content-Disposition:
              description: |
                `disposition` が `inline` なら `inline`、`attachment` なら `attachment` で始まり、
                ファイル名(`<職務経歴書名を整えたもの>.pdf` か `.md`)を UTF-8 で書く(Spring の `ContentDisposition` が組み立てる)。
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
