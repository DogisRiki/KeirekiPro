services:
  dind:
    build:
      context: .
      dockerfile: docker/dind/Dockerfile
    container_name: dind
    restart: always
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR= # TLS無効
    networks:
      - my-network

  backend:
    container_name: spring
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - 8080:8080
    tty: true
    volumes:
      - ./backend:/home/spring/app
      - type: volume
        source: backend-gradle-cache
        target: /home/spring/app/.gradle
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      # Testcontainers/docker-javaはdindをDockerデーモンとして使う
      - DOCKER_HOST=tcp://dind:2375
      # 接続先ホストをdindに固定
      - TESTCONTAINERS_HOST_OVERRIDE=dind
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
    networks:
      - my-network

  # Go 版の backend。Java 版から切り替えるまでは、Java 版(8080)と並べてホストの 8081 で開く
  backend-go:
    container_name: backend-go
    build:
      context: .
      dockerfile: docker/backend-go/Dockerfile
    ports:
      - 8081:8080
    tty: true
    working_dir: /app
    command: go run ./cmd/keirekipro
    volumes:
      - ./backend:/app
      # Go のモジュールとビルドのキャッシュ(Dockerfile の GOMODCACHE と GOCACHE が /cache の下を指す)
      - type: volume
        source: backend-go-cache
        target: /cache
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - KEIREKIPRO_ENV=dev
      # db と redis と localstack への接続。名前は Java 版の application.yaml と同じで、
      # Java 版の既定の localhost では、このコンテナの中を指してしまうため、サービスの名前を書く。
      # ポートとデータベースの名前と利用者とパスワードは、Java 版の既定と db と redis のサービスの値が同じなので書かない
      - DB_HOST=db
      - REDIS_HOST=redis
      - KEIREKIPRO_AWS_ENDPOINT=http://localstack:4566
      # testcontainers-go は dind を Docker として使う
      - DOCKER_HOST=tcp://dind:2375
      # 接続先のホストを dind に固定する
      - TESTCONTAINERS_HOST_OVERRIDE=dind
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
    networks:
      - my-network

  frontend:
    container_name: react
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - 5173:5173
      - 6006:6006
    environment:
      # vitest の並列数。指定しないと「CPUの数−1」で動き、Docker のメモリを使い切って
      # テストが時間切れや強制終了になる(#404)。開発サーバと同時に動いても余裕が残る数にする
      VITEST_MAX_WORKERS: 8
      # CHOKIDAR_USEPOLLING: true
    tty: true
    volumes:
      - type: bind
        source: ./frontend
        target: /home/node/app
      - type: volume
        source: node_modules
        target: /home/node/app/node_modules
    networks:
      - my-network

  terraform:
    container_name: terraform
    build:
      context: .
      dockerfile: docker/terraform/Dockerfile
    tty: true
    volumes:
      - type: bind
        source: ./terraform
        target: /workspace
    networks:
      - my-network

  db:
    container_name: postgresql
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - 5432:5432
    environment:
      TZ: Asia/Tokyo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: keireki_pro
    restart: always
    command: -c 'config_file=/etc/postgresql/postgresql.conf'
    volumes:
      - type: volume
        source: db-data
        target: /var/lib/postgresql/data
    configs:
      - source: postgres_config
        target: /etc/postgresql/postgresql.conf
    networks:
      - my-network

  redis:
    container_name: redis
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    restart: always
    ports:
      - 6379:6379
    networks:
      - my-network

  localstack:
    container_name: localstack
    build:
      context: .
      dockerfile: docker/localstack/Dockerfile
    restart: always
    ports:
      - 4566:4566
    environment:
      - SERVICES=s3,secretsmanager,ses
      - DEBUG=1
    volumes:
      - type: bind
        source: ./docker/localstack/init-localstack.sh
        target: /etc/localstack/init/ready.d/init-localstack.sh
        read_only: true
      - type: volume
        source: localstack-data
        target: /var/lib/localstack
    env_file:
      # .env.local の無い worktree でも compose の読み込みが通るようにする
      - path: ./docker/localstack/.env.local
        required: false
    networks:
      - my-network

volumes:
  db-data:
    name: named-db-data
  node_modules:
    name: named-node_modules
  vendor:
    name: named-vendor
  localstack-data:
    name: named-localstack
  backend-gradle-cache:
    name: named-backend-gradle-cache
  backend-go-cache:
    name: named-backend-go-cache

configs:
  postgres_config:
    file: ./docker/db/postgresql.conf

networks:
  my-network:
    driver: bridge
