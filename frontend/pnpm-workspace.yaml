packages:
  - .

# 公開直後の版を入れない。悪意ある版は公開から数時間で削除されることが多く、
# 寝かせるだけで大半を避けられる。既定の1440(24時間)より長くしているのは、
# 著名事例の検知までの時間の中央値が4〜48時間と報告されており、24時間では
# 分布の端をカバーできないため。Dependabotの既定クールダウン(3日)とも揃う。
# 明示することで minimumReleaseAgeStrict が true になり、条件を満たす版が無いとき
# 黙って非準拠の版へ落ちるのではなく解決が失敗する。
#
# 注意: pnpm 11.1.3 以降、この制約は --frozen-lockfile のインストールでも検証される。
# lockfileに72時間以内の版が含まれると ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION でCIが落ちる。
# Dependabotは独自リゾルバでこの設定に従わず、security updates にはクールダウンが
# 適用されないため、DependabotのfrontendのPRがこれに当たることがある。
# 時間の経過で解消するため、通常は再実行を待てばよい。
# 本番で動く部品の深刻度が high か critical の脆弱性の警告が示す最初の修正版を、
# 72時間待たずに入れるときだけ、minimumReleaseAgeExclude に、その版を指す要素を
# '<名前>@<版>' の形で1つ足す(同じ部品の版が2つあるときは '<名前>@<版1> || <版2>')。
# 名前だけの要素やパターンの要素は、72時間待たずに入れる版の要素に数えない。
# 値はキーと同じ行に書かず、キーの下の行に「- '<名前>@<版>'」の形で並べる。
# この要素を足したPRは、dependency-cooldown が確かめ、所有者の承認を求める。
minimumReleaseAge: 4320

overrides:
  follow-redirects: ">=1.16.0"
  # 開発依存の推移的パッケージの脆弱性解消。直接依存のバージョン変更では解消せず、
  # Dependabotが修正PRを作成できないため上書きで対応する
  brace-expansion@1: "^1.1.16"
  brace-expansion@2: "^2.1.2"
  js-yaml@3: "^3.15.2"
  js-yaml@4: "^4.3.2"
  postcss@8: "^8.5.23"
  qs@6: "^6.15.2"
  # CVE-2026-73088(ReDoS)。修正版は 4.28.7 以降。babel経由の推移的依存で、
  # pnpm は推移的依存の狙い撃ち更新を非対応(pnpm/pnpm#12744)のため上書きする
  browserslist: "^4.28.7"
  # minimatch の脆弱性の警告は 11.0.1 より古い版をすべて対象にし、古い版の修正版は無い。
  # ESLint とプラグインは minimatch 11 で動く版をまだ出していないので、下の patchedDependencies で
  # 読み込み方を書き換えてから 11 にそろえる
  minimatch@<11.0.1: "^11.0.1"

# minimatch 11 は既定の書き出しと makeRe を消したので、それを使う部品を minimatch 11 で動くように書き換える。
# 書き換えるのは minimatch の読み込みの行だけである。eslint-plugin-import では、makeRe を使う2行も書き換える。
# 版の範囲から外れる版に上がると、差分ファイルが使われずにインストールが失敗する(allowUnusedPatches の既定)。
# そのときは、新しい版で差分ファイルを作り直すか、その部品が minimatch 11 に対応していれば消す
patchedDependencies:
  "@eslint/config-array@^0.21.2": patches/@eslint__config-array.patch
  "@eslint/eslintrc@^3.3.7": patches/@eslint__eslintrc.patch
  eslint-plugin-import@^2.32.0: patches/eslint-plugin-import.patch
  eslint-plugin-jsx-a11y@^6.10.2: patches/eslint-plugin-jsx-a11y.patch
  eslint-plugin-react@^7.37.5: patches/eslint-plugin-react.patch

allowBuilds:
  esbuild: false
  unrs-resolver: false
