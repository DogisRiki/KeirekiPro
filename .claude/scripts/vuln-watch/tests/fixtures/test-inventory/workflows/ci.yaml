name: ci
env:
  TRIVY_VERSION: '0.76.1'
jobs:
  build:
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials/sub/path@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      - uses: ./.github/actions/setup-tool
        with:
          node-version: '24.22.2'
          trivy-version: ${{ env.TRIVY_VERSION }}
      - uses: docker://alpine:3
